name: M13 round8 bootstrap diagnostic
on:
  push:
    branches: [milestone-13-runtime-slice-a]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20.8', '20.20.2', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Plain process bootstrap list
        run: |
          node -e 'console.log(JSON.stringify({node:process.version,vm:process.moduleLoadList.includes("NativeModule vm"),buffer:process.moduleLoadList.includes("NativeModule buffer"),v8:process.moduleLoadList.includes("NativeModule v8")}))'
      - name: node:test bootstrap list
        run: |
          cat > /tmp/m13-bootstrap-list.test.js <<'JS'
          "use strict";
          const test = require("node:test");
          test("bootstrap", () => {
            console.log("BOOTSTRAP_LIST=" + JSON.stringify({node:process.version,vm:process.moduleLoadList.includes("NativeModule vm"),buffer:process.moduleLoadList.includes("NativeModule buffer"),v8:process.moduleLoadList.includes("NativeModule v8")}));
          });
          JS
          node --test /tmp/m13-bootstrap-list.test.js
