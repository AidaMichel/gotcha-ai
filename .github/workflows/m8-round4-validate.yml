name: M8 round 4 final validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Syntax
        run: |
          node --check src/ai-data.js
          node --check src/contract-attacks.js
          node --check test/m8-codex-round4.test.js

      - name: Round 4
        run: node --test test/m8-codex-round4.test.js

      - name: M8 focused
        run: |
          node --test test/m8-codex-remediation.test.js
          node --test test/m8-codex-round3.test.js
          node --test test/contract-attacks.test.js
          node --test test/ai-data.test.js

      - name: Full repository
        run: node --test

      - name: Public export and diff hygiene
        run: |
          node - <<'NODE'
          const publicApi = require('./src');
          const internal = require('./src/contract-attacks');
          if (publicApi.runContractAttacks !== internal.runContractAttacks) {
            throw new Error('public runContractAttacks identity mismatch');
          }
          console.log('public export identity PASS');
          NODE
          git diff --check origin/main...HEAD
          test -z "$(git diff origin/main...HEAD -- src/engine.js)"

  node14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Minimum runtime syntax
        run: |
          node --check src/ai-data.js
          node --check src/contract-attacks.js

      - name: Minimum runtime adversarial smoke
        run: |
          node - <<'NODE'
          'use strict';
          const vm = require('node:vm');
          const { cloneAiData } = require('./src/ai-data');
          const { runContractAttacks } = require('./src');

          function mustReject(value, label) {
            let rejected = false;
            try {
              cloneAiData(value, label);
            } catch {
              rejected = true;
            }
            if (!rejected) throw new Error(label + ' was not rejected');
          }

          if (typeof WebAssembly.Memory === 'function') {
            const value = new WebAssembly.Memory({ initial: 1 });
            Object.setPrototypeOf(value, Object.prototype);
            mustReject(value, 'WebAssembly.Memory');
          }
          if (typeof WebAssembly.Table === 'function') {
            const value = new WebAssembly.Table({ initial: 1, element: 'anyfunc' });
            Object.setPrototypeOf(value, Object.prototype);
            mustReject(value, 'WebAssembly.Table');
          }
          if (typeof WebAssembly.Global === 'function') {
            const value = new WebAssembly.Global({ value: 'i32', mutable: true }, 1);
            Object.setPrototypeOf(value, Object.prototype);
            mustReject(value, 'WebAssembly.Global');
          }

          const deep = {};
          let cursor = deep;
          for (let i = 0; i < 2500; i += 1) {
            cursor.next = {};
            cursor = cursor.next;
          }
          cursor.ok = true;
          cloneAiData(deep, 'deep data');

          const contract = {
            version: 1,
            status: 'confirmed',
            task: 'Return the approved time.',
            rules: [{
              id: 'time-rule',
              statement: 'Time must be 3 PM.',
              kind: 'required',
              severity: 'critical'
            }]
          };

          function output(value) {
            return {
              version: 1,
              task: 'Return the approved time.',
              attacks: [{
                id: 'wrong-time',
                ruleId: 'time-rule',
                type: 'wrong-time',
                description: 'Changes the approved time.',
                rationale: 'Proposed violation.',
                mutatedOutput: value,
                scores: { realism: 1, subtlety: 1, novelty: 1, fixability: 1 }
              }]
            };
          }

          async function main() {
            const foreignRejected = vm.runInNewContext(`
              (() => {
                const p = Promise.reject(new Error('foreign frozen rejection'));
                Object.preventExtensions(p);
                Object.freeze(Promise.prototype);
                return p;
              })()
            `);

            let sawForeign = false;
            try {
              await runContractAttacks({
                contract,
                input: { request: '3 PM' },
                expectedOutput: { time: '3 PM' },
                evaluator: () => true,
                generator: () => foreignRejected
              });
            } catch (error) {
              if (!/foreign frozen rejection/.test(String(error && error.message))) throw error;
              sawForeign = true;
            }
            if (!sawForeign) throw new Error('foreign frozen Promise did not reject through bridge');

            const result = await runContractAttacks({
              contract,
              input: ['3 PM'],
              expectedOutput: ['3 PM'],
              evaluator(value) {
                if (Array.isArray(value) && value[0] === '4 PM') {
                  if (Object.getPrototypeOf(value) === Array.prototype) {
                    throw new Error('evaluator received process Array.prototype');
                  }
                }
                return true;
              },
              generator: () => output(['4 PM'])
            });
            if (!result.topFinding || result.topFinding.id !== 'wrong-time') {
              throw new Error('evaluator isolation smoke lost top finding');
            }

            const originalFreeze = Object.freeze;
            try {
              const freezeResult = await runContractAttacks({
                contract,
                input: { request: '3 PM' },
                expectedOutput: { time: '3 PM' },
                evaluator(value) {
                  if (value.time === '4 PM' && Reflect.set(value, 'time', '9 PM')) {
                    throw new Error('captured freeze boundary failed');
                  }
                  return true;
                },
                generator() {
                  Object.freeze = (value) => value;
                  return output({ time: '4 PM' });
                }
              });
              if (freezeResult.generatedAttacks[0].output.time !== '4 PM') {
                throw new Error('frozen snapshot was mutated');
              }
            } finally {
              Object.freeze = originalFreeze;
            }

            console.log('Node 14.18.0 M8 round 4 smoke PASS');
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
