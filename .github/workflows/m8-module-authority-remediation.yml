name: M8 Node 24 Authority Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: read

jobs:
  diagnose-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate remediation
        run: |
          python3 scripts/qa/m8-module-authority-fix.py
          python3 scripts/qa/m8-module-authority-global-fallback.py
          python3 scripts/qa/m8-node24-blob-authority-fix.py
          python3 scripts/qa/m8-module-authority-trim.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Trace exact ambient Blob getter touch
        run: |
          node - <<'NODE' > node24-blob-touch-stack.txt 2>&1
          'use strict';
          let calls = 0;
          Object.defineProperty(globalThis, 'Blob', {
            configurable: true,
            enumerable: false,
            get() {
              calls += 1;
              console.log(`BLOB_GETTER_TOUCH_${calls}`);
              console.log(new Error('Blob getter touched here').stack);
              throw new Error('poisoned global Blob getter executed');
            }
          });
          globalThis.structuredClone = undefined;
          try {
            require('./src/ai-data');
          } catch (error) {
            console.log('REQUIRE_ERROR');
            console.log(error && error.stack ? error.stack : error);
          }
          console.log(`TOTAL_BLOB_GETTER_TOUCHES=${calls}`);
          NODE

      - name: Run focused suite and capture exact failure
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check src/ai-data-core.js 2>&1 | tee node24-syntax.txt
          node --test --test-reporter=spec test/m8-runtime-brand-authority.test.js 2>&1 | tee node24-focused.txt

      - name: Upload Node 24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-authority-evidence
          path: |
            node24-blob-touch-stack.txt
            node24-syntax.txt
            node24-focused.txt
          if-no-files-found: error

      - name: Preserve failure gate
        if: steps.focused.outcome != 'success'
        run: exit 1
