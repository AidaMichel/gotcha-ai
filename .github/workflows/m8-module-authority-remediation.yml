name: M8 Node 24 Authority Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: read

jobs:
  diagnose-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate remediation
        run: |
          python3 scripts/qa/m8-module-authority-fix.py
          python3 scripts/qa/m8-module-authority-global-fallback.py
          python3 scripts/qa/m8-node24-blob-authority-fix.py
          python3 scripts/qa/m8-module-authority-trim.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Locate Node 24 Blob source authority
        run: |
          node - <<'NODE' > node24-blob-source-map.txt
          'use strict';
          const { Blob } = require('node:buffer');
          const natives = process.binding('natives');
          const toSource = Function.prototype.toString;
          const ctorSource = toSource.call(Blob);
          const sliceSource = toSource.call(Blob.prototype.slice);
          const constructorMatches = [];
          const sliceMatches = [];
          for (const [name, source] of Object.entries(natives)) {
            if (typeof source !== 'string') continue;
            if (source.includes(ctorSource)) constructorMatches.push(name);
            if (source.includes(sliceSource)) sliceMatches.push(name);
          }
          console.log(JSON.stringify({
            node: process.version,
            constructorMatches,
            sliceMatches,
            internalBlobExists: typeof natives['internal/blob'] === 'string',
            internalBlobHasConstructor: typeof natives['internal/blob'] === 'string' && natives['internal/blob'].includes(ctorSource),
            internalBlobHasSlice: typeof natives['internal/blob'] === 'string' && natives['internal/blob'].includes(sliceSource),
            constructorPrefix: ctorSource.slice(0, 260),
            sliceSource
          }, null, 2));
          NODE

      - name: Run focused suite and capture exact failure
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check src/ai-data-core.js 2>&1 | tee node24-syntax.txt
          node --test --test-reporter=spec test/m8-runtime-brand-authority.test.js 2>&1 | tee node24-focused.txt

      - name: Upload Node 24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-authority-evidence
          path: |
            node24-blob-source-map.txt
            node24-syntax.txt
            node24-focused.txt
          if-no-files-found: error

      - name: Preserve failure gate
        if: steps.focused.outcome != 'success'
        run: exit 1
