name: M8 Node 24 Authority Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: read

jobs:
  diagnose-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate remediation
        run: |
          python3 scripts/qa/m8-module-authority-fix.py
          python3 scripts/qa/m8-module-authority-global-fallback.py
          python3 scripts/qa/m8-node24-blob-authority-fix.py
          python3 scripts/qa/m8-module-authority-trim.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Capture Node 24 runtime authority facts
        run: |
          node - <<'NODE' > node24-runtime-diagnostic.txt
          'use strict';
          const nodeUrl = require('node:url');
          const nodeBuffer = require('node:buffer');
          const workerThreads = require('node:worker_threads');
          const own = (o, k) => Object.getOwnPropertyDescriptor(o, k);
          const fnInfo = (fn) => typeof fn === 'function' ? {
            name: fn.name,
            source: Function.prototype.toString.call(fn),
            hasInstance: own(fn, Symbol.hasInstance) || null
          } : { type: typeof fn };
          console.log(JSON.stringify({
            node: process.version,
            identities: {
              URL: globalThis.URL === nodeUrl.URL,
              URLSearchParams: globalThis.URLSearchParams === nodeUrl.URLSearchParams,
              Blob: globalThis.Blob === nodeBuffer.Blob,
              MessageChannel: globalThis.MessageChannel === workerThreads.MessageChannel
            },
            globals: {
              URL: fnInfo(globalThis.URL),
              URLSearchParams: fnInfo(globalThis.URLSearchParams),
              Blob: fnInfo(globalThis.Blob),
              Headers: fnInfo(globalThis.Headers),
              FormData: fnInfo(globalThis.FormData),
              AbortController: fnInfo(globalThis.AbortController),
              MessageChannel: fnInfo(globalThis.MessageChannel)
            },
            processBinding: fnInfo(process.binding)
          }, null, 2));
          NODE

      - name: Run focused suite and capture exact failure
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check src/ai-data-core.js 2>&1 | tee node24-syntax.txt
          node --test --test-reporter=spec test/m8-runtime-brand-authority.test.js 2>&1 | tee node24-focused.txt

      - name: Upload Node 24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-authority-evidence
          path: |
            node24-runtime-diagnostic.txt
            node24-syntax.txt
            node24-focused.txt
          if-no-files-found: error

      - name: Preserve failure gate
        if: steps.focused.outcome != 'success'
        run: exit 1
