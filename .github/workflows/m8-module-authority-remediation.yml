name: M8 Node 24 Authority Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: read

jobs:
  diagnose-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate remediation
        run: |
          python3 scripts/qa/m8-module-authority-fix.py
          python3 scripts/qa/m8-module-authority-global-fallback.py
          python3 scripts/qa/m8-node24-blob-authority-fix.py
          python3 scripts/qa/m8-module-authority-trim.py
          git diff --check

      - name: Instrument generated initialization order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ai-data-core.js')
          text = path.read_text()
          replacements = [
              (
                  'function hasTrustedUndiciBlobDependency() {\n',
                  'function hasTrustedUndiciBlobDependency() {\n  process.stderr.write("TRACE blob-dependency-check\\n");\n'
              ),
              (
                  'function resolveRequiredUndiciConstructor(\n  constructorName\n) {\n',
                  'function resolveRequiredUndiciConstructor(\n  constructorName\n) {\n  process.stderr.write(`TRACE undici-resolver:${constructorName}\\n`);\n'
              ),
              (
                  'function resolveTrustedAbortControllerConstructor() {\n',
                  'function resolveTrustedAbortControllerConstructor() {\n  process.stderr.write("TRACE abort-controller-resolver\\n");\n'
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one instrumentation seam: {old!r}')
              text = text.replace(old, new, 1)
          marker = '''  if (\n    !("get" in globalDescriptor) &&\n    !("set" in globalDescriptor)\n  ) {\n    return ('''
          replacement = '''  if (\n    !("get" in globalDescriptor) &&\n    !("set" in globalDescriptor)\n  ) {\n    process.stderr.write(`TRACE undici-data-branch:${constructorName}\\n`);\n    return ('''
          start = text.index('function resolveRequiredUndiciConstructor(')
          end = text.index('\nfunction captureRequiredUndiciProbe(', start)
          block = text[start:end]
          if block.count(marker) != 1:
              raise SystemExit('expected one Undici data-property branch')
          block = block.replace(marker, replacement, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Trace exact ambient Blob getter touch
        run: |
          node - <<'NODE' > node24-init-order.txt 2>&1
          'use strict';
          let calls = 0;
          Object.defineProperty(globalThis, 'Blob', {
            configurable: true,
            enumerable: false,
            get() {
              calls += 1;
              console.log(`BLOB_GETTER_TOUCH_${calls}`);
              console.log(new Error('Blob getter touched here').stack);
              throw new Error('poisoned global Blob getter executed');
            }
          });
          globalThis.structuredClone = undefined;
          try {
            require('./src/ai-data');
          } catch (error) {
            console.log('REQUIRE_ERROR');
            console.log(error && error.stack ? error.stack : error);
          }
          console.log(`TOTAL_BLOB_GETTER_TOUCHES=${calls}`);
          NODE

      - name: Upload initialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-init-order
          path: node24-init-order.txt
          if-no-files-found: error
