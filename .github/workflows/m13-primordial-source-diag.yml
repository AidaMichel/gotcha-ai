name: M13 primordial identity diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply candidate remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Diagnose identity gate
        run: |
          node <<'NODE'
          "use strict";
          const a = require('./src/runtime-authority');
          console.log('consumerPrimordialsAvailable', a.consumerPrimordialsAvailable);
          console.log('promiseAuthorityAvailable', a.promiseAuthorityAvailable);
          const localProto = a.localFunctionPrototype;
          const isProxy = a.isProxy;
          const ts = a.functionToString;
          const checks = [
            ['Object', Object], ['Array', Array], ['Set', Set], ['Map', Map],
            ['Number', Number], ['String', String], ['TypeError', TypeError],
            ['Object.getOwnPropertyDescriptors', Object.getOwnPropertyDescriptors],
            ['Object.isExtensible', Object.isExtensible], ['Object.is', Object.is],
            ['Object.defineProperty', Object.defineProperty],
            ['Object.prototype.hasOwnProperty', Object.prototype.hasOwnProperty],
            ['Reflect.ownKeys', Reflect.ownKeys], ['Number.isFinite', Number.isFinite],
            ['String.prototype.trim', String.prototype.trim],
            ['String.prototype.includes', String.prototype.includes],
            ['Set.prototype.has', Set.prototype.has], ['Set.prototype.add', Set.prototype.add],
            ['Map.prototype.get', Map.prototype.get], ['Map.prototype.set', Map.prototype.set],
            ['Array.prototype.push', Array.prototype.push], ['Array.prototype.pop', Array.prototype.pop],
            ['Array.prototype.join', Array.prototype.join],
          ];
          for (const [name, fn] of checks) {
            let proxy = 'ERR', proto = 'ERR', source = 'ERR';
            try { proxy = isProxy(fn); } catch (e) { proxy = 'throw:' + e.message; }
            try { proto = Object.getPrototypeOf(fn) === localProto; } catch (e) { proto = 'throw:' + e.message; }
            try { source = Reflect.apply(ts, fn, []).replace(/\n/g, '\\n'); } catch (e) { source = 'throw:' + e.message; }
            console.log(JSON.stringify({name, proxy, proto, source}));
          }
          NODE
