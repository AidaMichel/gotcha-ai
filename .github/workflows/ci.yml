name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  package-smoke:
    name: Fresh package smoke
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          test -n "$TARBALL"
          test -f "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install packed artifact into fresh consumer
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}"
          ./node_modules/.bin/gotcha-ai demo

      - name: Verify public exports from packed artifact
        shell: bash
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/${{ steps.pack.outputs.tarball }}" >/dev/null
          node <<'NODE'
          const api = require("gotcha-ai");
          const expected = [
            "runGotcha",
            "draftQualityContract",
            "confirmQualityContract",
            "runContractAttacks",
            "draftContractProtection",
            "confirmContractProtection",
            "verifyContractProtection",
            "generateContractProtectionProposal",
            "createStructuredProviderAdapter",
            "probeEvaluator",
            "createCommandEvaluator",
            "prepareContractQualityLoop",
            "completeContractQualityLoop"
          ];

          for (const name of expected) {
            if (typeof api[name] !== "function") {
              throw new Error(`Missing public function: ${name}`);
            }
          }
          NODE
