name: M13 Codex round 7

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Round-7 remediation
        run: |
          python3 scripts/qa/m13-codex-round7.py
          python3 scripts/qa/m13-codex-round7-followup.py
          python3 scripts/qa/m13-codex-round7-followup2.py
          python3 scripts/qa/m13-codex-round7-followup3.py
          python3 scripts/qa/m13-codex-round7-followup4.py
          python3 scripts/qa/m13-codex-round7-followup5.py
          python3 scripts/qa/m13-codex-round7-followup6.py
          python3 scripts/qa/m13-codex-round7-followup7.py
          python3 scripts/qa/m13-codex-round7-followup8.py
          python3 scripts/qa/m13-codex-round7-followup9.py

      - name: Syntax and diff hygiene
        run: |
          git diff --check
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/index.js
          node --check src/contract-protection-proposal.js
          node --check test/contract-protection-proposal.test.js
          node --check test/m13-review-remediation.test.js

      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
      - name: Node 14 compatibility
        run: |
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/index.js
          node --check src/contract-protection-proposal.js
          node -e "const api=require('./src'); if(typeof api.generateContractProtectionProposal!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: Node 16 compatibility
        run: |
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/index.js
          node -e "const api=require('./src'); if(typeof api.generateContractProtectionProposal!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
      - name: Node 18 Round-7 focused and full
        run: |
          node --test test/m13-review-remediation.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Node 20 Round-7 focused and full
        run: |
          node --test test/m13-review-remediation.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Node 22 Round-7 focused stress and full
        run: |
          node --test test/m13-review-remediation.test.js
          for i in 1 2 3; do node --test test/m13-review-remediation.test.js; done
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Node 24 Round-7 focused and full
        run: |
          node --test test/m13-review-remediation.test.js
          npm test

      - name: Materialize tested production state
        env:
          BRANCH: milestone-13-runtime-slice-a
        run: |
          rm -f .github/workflows/*round7*
          rm -f scripts/qa/*round7*
          rm -f .github/workflows/m13-node22-isolated-diagnostic.yml scripts/qa/m13-node22-isolated.log
          test -z "$(find .github/workflows scripts/qa -type f \( -iname '*round7*' -o -iname 'm13-node22-isolated*' \) -print)"
          git diff --check
          git add src/package-authority.js src/runtime-authority.js src/index.js src/contract-protection-proposal.js test/contract-protection-proposal.test.js test/m13-review-remediation.test.js
          git add -u .github/workflows scripts/qa
          git diff --cached --check
          git status --short
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git commit -m "fix: close M13 Codex round7 findings"
          git push origin HEAD:${BRANCH}
