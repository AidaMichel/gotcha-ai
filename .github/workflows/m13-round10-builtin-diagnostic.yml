name: M13 Round10 builtin diagnostic

on:
  push:
    branches:
      - qa/m13-round9-root-audit

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect loader and inspector poison behavior
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const original = Object.getOwnPropertyDescriptor(util, 'types');
          let calls = 0;
          Object.defineProperty(util, 'types', {
            configurable: true,
            enumerable: original.enumerable,
            get() { calls += 1; throw new Error('poison util.types'); }
          });
          console.log('node', process.version);
          try {
            require('node:inspector');
            console.log('inspector-loaded', true);
          } catch (error) {
            console.log('inspector-loaded', false, error && error.message);
          }
          console.log('types-getter-calls-after-inspector', calls);
          Object.defineProperty(util, 'types', original);
          const d = Object.getOwnPropertyDescriptor(process, 'getBuiltinModule');
          console.log('getBuiltinModule-descriptor', d && { writable:d.writable, enumerable:d.enumerable, configurable:d.configurable, type:typeof d.value });
          if (d && typeof d.value === 'function') console.log('getBuiltinModule-source', Function.prototype.toString.call(d.value));
          NODE
