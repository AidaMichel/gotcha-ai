name: M13 Round10 builtin diagnostic

on:
  push:
    branches:
      - qa/m13-round9-root-audit

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect builtin loader script metadata
        run: |
          node - <<'NODE'
          const inspector = require('node:inspector');
          const genuine = Object.getOwnPropertyDescriptor(process, 'getBuiltinModule').value;
          const BuiltinModule = { normalizeRequirableId(id) { return id; } };
          const requireFake = () => null;
          const fake = Function('BuiltinModule', 'require', `return function getBuiltinModule(id) {\n  validateString(id, 'id');\n  const normalizedId = BuiltinModule.normalizeRequirableId(id);\n  return normalizedId ? require(normalizedId) : undefined;\n}`)(BuiltinModule, requireFake);
          globalThis.__gotchaGenuine = genuine;
          globalThis.__gotchaFake = fake;
          const session = new inspector.Session();
          session.connect();
          const scripts = new Map();
          session.on('Debugger.scriptParsed', ({params}) => scripts.set(params.scriptId, params));
          function post(method, params = {}) {
            let called = false, error = null, result = null;
            session.post(method, params, (e, r) => { called = true; error = e; result = r; });
            if (!called || error) throw error || new Error('inspector callback not synchronous');
            return result;
          }
          post('Debugger.enable');
          function inspect(expression) {
            const remote = post('Runtime.evaluate', {expression, returnByValue:false, generatePreview:false}).result;
            const props = post('Runtime.getProperties', {objectId:remote.objectId, ownProperties:true, generatePreview:false});
            const location = props.internalProperties.find((entry) => entry.name === '[[FunctionLocation]]');
            const scriptId = location && location.value && location.value.value && location.value.value.scriptId;
            const meta = scripts.get(scriptId);
            console.log(expression, JSON.stringify({scriptId, meta: meta && {url:meta.url, hash:meta.hash, hasSourceURL:meta.hasSourceURL, isModule:meta.isModule, length:meta.length, embedderName:meta.embedderName}}));
          }
          console.log('node', process.version);
          inspect('globalThis.__gotchaGenuine');
          inspect('globalThis.__gotchaFake');
          session.disconnect();
          delete globalThis.__gotchaGenuine;
          delete globalThis.__gotchaFake;
          NODE
