name: M11 Slice A Validation
on:
  push:
    branches:
      - milestone-11-provider-adapters
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check src/provider-adapter.js
      - run: node --test test/provider-adapter.test.js
      - run: npm test
      - run: git diff --check origin/main...HEAD
