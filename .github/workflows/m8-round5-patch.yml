name: M8 round 5 Node 14 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Syntax
        run: |
          node --check src/ai-data.js
          node --check src/contract-attacks.js

      - name: Round 5 minimum-runtime smoke
        run: |
          node --unhandled-rejections=strict - <<'NODE'
          "use strict";

          const vm = require("node:vm");
          const util = require("node:util");
          const { runContractAttacks } = require("./src");
          const { cloneAiData } = require("./src/ai-data");

          function contract() {
            return {
              version: 1,
              status: "confirmed",
              task: "Return the approved value.",
              rules: [{
                id: "value-rule",
                statement: "Return the approved value.",
                kind: "required",
                severity: "critical"
              }]
            };
          }

          function output(mutatedOutput) {
            return {
              version: 1,
              task: "Return the approved value.",
              attacks: [{
                id: "wrong-value",
                ruleId: "value-rule",
                type: "wrong-value",
                description: "Changes the approved value.",
                rationale: "Proposed violation.",
                mutatedOutput,
                scores: {
                  realism: 1,
                  subtlety: 1,
                  novelty: 1,
                  fixability: 1
                }
              }]
            };
          }

          function deep(depth, leaf) {
            const root = {};
            let cursor = root;
            for (let index = 0; index < depth; index += 1) {
              cursor.next = {};
              cursor = cursor.next;
            }
            cursor.value = leaf;
            return root;
          }

          async function main() {
            const context = vm.createContext({ foo: "bar" });
            let contextRejected = false;
            try {
              cloneAiData(context, "context");
            } catch (error) {
              contextRejected = /unsupported runtime object/.test(String(error && error.message));
            }
            if (!contextRejected) throw new Error("vm context was not rejected");

            const expected = deep(2500, "approved");
            const deepResult = await runContractAttacks({
              contract: contract(),
              input: { request: "approved" },
              expectedOutput: expected,
              evaluator: () => true,
              generator: () => output(deep(2500, "approved"))
            });
            if (
              deepResult.generatedAttacks.length !== 0 ||
              deepResult.discardedAttacks.length !== 1 ||
              deepResult.discardedAttacks[0].reason !== "unchanged-output"
            ) {
              throw new Error("deep stack-safe equality smoke failed");
            }

            const originalIsPromise = util.types.isPromise;
            try {
              let sawRejection = false;
              try {
                await runContractAttacks({
                  contract: contract(),
                  input: { request: "approved" },
                  expectedOutput: { value: "approved" },
                  evaluator: () => true,
                  generator() {
                    util.types.isPromise = () => false;
                    return Promise.reject(new Error("captured predicate rejection"));
                  }
                });
              } catch (error) {
                sawRejection = /captured predicate rejection/.test(String(error && error.message));
              }
              if (!sawRejection) throw new Error("captured Promise predicate smoke failed");
            } finally {
              util.types.isPromise = originalIsPromise;
            }

            const arrayResult = await runContractAttacks({
              contract: contract(),
              input: { request: "approved" },
              expectedOutput: [],
              evaluator: value => value instanceof Array,
              generator: () => output(["wrong"])
            });
            if (!arrayResult.topFinding || arrayResult.topFinding.id !== "wrong-value") {
              throw new Error("Array instanceof compatibility smoke failed");
            }

            const originalVersion = Object.getOwnPropertyDescriptor(Object.prototype, "version");
            const originalTask = Object.getOwnPropertyDescriptor(Object.prototype, "task");
            const originalAttacks = Object.getOwnPropertyDescriptor(Object.prototype, "attacks");
            const restore = (key, descriptor) => {
              if (descriptor === undefined) delete Object.prototype[key];
              else Object.defineProperty(Object.prototype, key, descriptor);
            };

            try {
              let rejectedInherited = false;
              try {
                await runContractAttacks({
                  contract: contract(),
                  input: { request: "approved" },
                  expectedOutput: { value: "approved" },
                  evaluator: () => true,
                  generator() {
                    Object.prototype.version = 1;
                    Object.prototype.task = "Return the approved value.";
                    Object.prototype.attacks = output({ value: "wrong" }).attacks;
                    return {};
                  }
                });
              } catch (error) {
                rejectedInherited = /own data property/.test(String(error && error.message));
              }
              if (!rejectedInherited) throw new Error("inherited generator schema was accepted");
            } finally {
              restore("version", originalVersion);
              restore("task", originalTask);
              restore("attacks", originalAttacks);
            }

            console.log("Node 14.18.0 M8 round 5 smoke PASS");
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
