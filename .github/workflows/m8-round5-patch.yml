name: M8 round 5 remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Apply round 5 patch
        run: python3 .github/scripts/m8_round5_patch.py

      - name: Syntax
        run: |
          node --check src/ai-data.js
          node --check src/contract-attacks.js
          node --check test/m8-codex-round5.test.js

      - name: Round 5 focused regressions
        run: node --test test/m8-codex-round5.test.js

      - name: M8 focused suites
        run: |
          node --test \
            test/contract-attacks.test.js \
            test/ai-data.test.js \
            test/m8-codex-remediation.test.js \
            test/m8-codex-round3.test.js \
            test/m8-codex-round4.test.js \
            test/m8-codex-round5.test.js

      - name: Full repository
        run: node --test

      - name: Diff checks
        run: |
          git diff --check
          git diff origin/main...HEAD -- src/engine.js

      - name: Commit validated remediation
        run: |
          if git diff --quiet -- src/ai-data.js src/contract-attacks.js test/m8-codex-round5.test.js; then
            echo "Round 5 already applied; nothing to commit."
            exit 0
          fi
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git add src/ai-data.js src/contract-attacks.js test/m8-codex-round5.test.js
          git commit -m "fix: harden M8 round 5 boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
