name: M13 Round11 util ESM diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-util-esm-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "20.0.0", "20.11.1", "20.12.0", "22.0.0", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe builtin ESM namespace under poisoned CJS util
        run: |
          node - <<'NODE'
          (async () => {
            const util = require('node:util');
            const typesDescriptor = Object.getOwnPropertyDescriptor(util, 'types');
            const inspectDescriptor = Object.getOwnPropertyDescriptor(util, 'inspect');
            if (!typesDescriptor || !typesDescriptor.configurable) {
              console.log('NOT_APPLICABLE', process.version);
              return;
            }
            const genuineTypes = require('node:util/types');
            let typeCalls = 0;
            let inspectCalls = 0;
            Object.defineProperty(util, 'types', {
              configurable: true,
              enumerable: typesDescriptor.enumerable,
              get() { typeCalls += 1; throw new Error('poison types'); }
            });
            if (inspectDescriptor && inspectDescriptor.configurable) {
              Object.defineProperty(util, 'inspect', {
                configurable: true,
                enumerable: inspectDescriptor.enumerable,
                get() { inspectCalls += 1; throw new Error('poison inspect'); }
              });
            }

            let ns = null;
            let importError = null;
            try { ns = await import('node:util'); }
            catch (error) { importError = String(error && error.message || error); }
            console.log(JSON.stringify({
              node: process.version,
              typeCalls,
              inspectCalls,
              importError,
              nsType: ns && typeof ns.types,
              nsTypesIsGenuine: !!(ns && ns.types === genuineTypes),
              nsInspectType: ns && typeof ns.inspect
            }));

            Object.defineProperty(util, 'types', typesDescriptor);
            if (inspectDescriptor && inspectDescriptor.configurable) {
              Object.defineProperty(util, 'inspect', inspectDescriptor);
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
