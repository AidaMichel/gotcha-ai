name: M13 Promise authority diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  inspect-promise-brand:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Print Promise brand authority
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const d = Object.getOwnPropertyDescriptor(util.types, 'isPromise');
          console.log('node=' + process.version);
          console.log('source=' + Function.prototype.toString.call(util.types.isPromise));
          console.log('prototypeLocal=' + (Object.getPrototypeOf(util.types.isPromise) === Function.prototype));
          console.log('descriptor=' + JSON.stringify({writable:d?.writable, enumerable:d?.enumerable, configurable:d?.configurable, accessor:!!(d?.get||d?.set)}));
          console.log('true=' + util.types.isPromise(true));
          console.log('promise=' + util.types.isPromise(Promise.resolve()));
          NODE
