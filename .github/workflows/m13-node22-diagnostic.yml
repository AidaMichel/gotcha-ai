name: M13 Node 22 diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  isolate-node22-parallel-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact round4 remediation
        run: |
          python3 scripts/qa/m13-codex-p1-round4.py
          python3 scripts/qa/m13-codex-p1-round4-followup.py
          python3 scripts/qa/m13-codex-p1-round4-core-followup.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Serial all six x20
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            node --test --test-concurrency=1 \
              test/m13-review-remediation.test.js \
              test/provider-adapter-m13.test.js \
              test/mutation-pack.test.js \
              test/contract-protection-proposal.test.js \
              test/contract-quality-loop.test.js \
              test/package-contract-protection-proposal.test.js
          done

      - name: Omit remediation x12
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do node --test \
            test/provider-adapter-m13.test.js test/mutation-pack.test.js \
            test/contract-protection-proposal.test.js test/contract-quality-loop.test.js \
            test/package-contract-protection-proposal.test.js; done

      - name: Omit provider x12
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do node --test \
            test/m13-review-remediation.test.js test/mutation-pack.test.js \
            test/contract-protection-proposal.test.js test/contract-quality-loop.test.js \
            test/package-contract-protection-proposal.test.js; done

      - name: Omit mutation x12
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do node --test \
            test/m13-review-remediation.test.js test/provider-adapter-m13.test.js \
            test/contract-protection-proposal.test.js test/contract-quality-loop.test.js \
            test/package-contract-protection-proposal.test.js; done

      - name: Omit proposal x12
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do node --test \
            test/m13-review-remediation.test.js test/provider-adapter-m13.test.js \
            test/mutation-pack.test.js test/contract-quality-loop.test.js \
            test/package-contract-protection-proposal.test.js; done

      - name: Omit quality x12
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do node --test \
            test/m13-review-remediation.test.js test/provider-adapter-m13.test.js \
            test/mutation-pack.test.js test/contract-protection-proposal.test.js \
            test/package-contract-protection-proposal.test.js; done

      - name: Omit package x12
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do node --test \
            test/m13-review-remediation.test.js test/provider-adapter-m13.test.js \
            test/mutation-pack.test.js test/contract-protection-proposal.test.js \
            test/contract-quality-loop.test.js; done

      - name: All six parallel x20 control
        continue-on-error: true
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do node --test \
            test/m13-review-remediation.test.js test/provider-adapter-m13.test.js \
            test/mutation-pack.test.js test/contract-protection-proposal.test.js \
            test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js; done

      - name: Diagnostic complete
        run: echo "Inspect step conclusions."
