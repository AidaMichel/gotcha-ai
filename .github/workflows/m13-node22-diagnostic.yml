name: M13 Promise authority fix validation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  validate-authority-fix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Apply round4 plus current Node authority fix
        run: |
          python3 scripts/qa/m13-codex-p1-round4.py
          python3 scripts/qa/m13-codex-p1-round4-followup.py
          python3 scripts/qa/m13-codex-p1-round4-core-followup.py
          python3 scripts/qa/m13-node22-authority-fix.py
      - name: Focused M13 suite
        run: |
          node --test \
            test/m13-review-remediation.test.js \
            test/provider-adapter-m13.test.js \
            test/mutation-pack.test.js \
            test/contract-protection-proposal.test.js \
            test/contract-quality-loop.test.js \
            test/package-contract-protection-proposal.test.js
      - name: Full repository suite
        run: npm test
      - name: Node 22 stress focused x10
        if: matrix.node == 22
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "stress $i"
            node --test \
              test/m13-review-remediation.test.js \
              test/provider-adapter-m13.test.js \
              test/mutation-pack.test.js \
              test/contract-protection-proposal.test.js \
              test/contract-quality-loop.test.js \
              test/package-contract-protection-proposal.test.js
          done
