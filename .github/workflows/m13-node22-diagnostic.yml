name: M13 Node 22 diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  isolate-node22-concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact round4 remediation
        run: |
          python3 scripts/qa/m13-codex-p1-round4.py
          python3 scripts/qa/m13-codex-p1-round4-followup.py
          python3 scripts/qa/m13-codex-p1-round4-core-followup.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: half A - remediation provider mutation
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js

      - name: half B - proposal quality package
        continue-on-error: true
        run: node --test test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - name: omit remediation
        continue-on-error: true
        run: node --test test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - name: omit provider
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - name: omit mutation
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - name: omit proposal
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - name: omit quality
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/package-contract-protection-proposal.test.js

      - name: omit package
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js

      - name: all six control
        continue-on-error: true
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - name: Diagnostic complete
        run: echo "Use per-step conclusions to isolate concurrency interaction."
