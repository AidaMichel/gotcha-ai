name: M13 Promise authority diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  inspect-util-types-alias:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compare util types exports
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const direct = require('node:util/types');
          const original = util.types.isPromise;
          console.log('node=' + process.version);
          console.log('sameObject=' + (util.types === direct));
          console.log('sameFunction=' + (util.types.isPromise === direct.isPromise));
          util.types.isPromise = function poisoned() { throw new Error('poison'); };
          console.log('mutationPropagates=' + (direct.isPromise === util.types.isPromise));
          util.types.isPromise = original;
          NODE
