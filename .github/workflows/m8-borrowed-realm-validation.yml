name: M8 borrowed realm final validation

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'milestone-8-ai-attacks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-8-ai-attacks
          fetch-depth: 0

      - name: Apply final borrowed-realm patch
        run: python3 .github/scripts/m8_borrowed_realm_patch.py

      - name: Node 22.23 setup
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Static gates
        run: |
          node --check src/contract-attacks.js
          node --check test/m8-final-borrowed-realm.test.js
          git diff --check
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- src/engine.js

      - name: Borrowed-realm regressions on Node 22
        run: node --test test/m8-final-borrowed-realm.test.js

      - name: Focused M8 suites on Node 22
        run: node --test test/ai-data.test.js test/contract-attacks.test.js test/m8-*.test.js

      - name: Full repository on Node 22
        run: npm test

      - name: Node 24.19 setup
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Borrowed-realm regressions on Node 24
        run: node --test test/m8-final-borrowed-realm.test.js

      - name: Adversarial M8 closure suites on Node 24
        run: node --test test/m8-codex-round9.test.js test/m8-codex-round10.test.js test/m8-codex-round11.test.js test/m8-codex-round12.test.js test/m8-final-closure.test.js test/m8-final-realm-closure.test.js test/m8-final-borrowed-realm.test.js

      - name: Full repository on Node 24
        run: npm test

      - name: Node 14.18 setup
        uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Node 14 syntax and borrowed-realm smoke
        run: |
          node --check src/contract-attacks.js
          node --check .github/scripts/m8_borrowed_realm_node14_smoke.js
          node .github/scripts/m8_borrowed_realm_node14_smoke.js

      - name: Commit validated source and regression only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contract-attacks.js test/m8-final-borrowed-realm.test.js
          if git diff --cached --quiet; then
            echo "No validated source changes to commit"
            exit 1
          fi
          git commit -m "fix: preserve borrowed array method realms"
          git push origin HEAD:milestone-8-ai-attacks
