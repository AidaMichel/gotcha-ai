name: M8 Round 11 validation

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  validate-round11:
    if: >-
      github.event.pull_request.head.ref == 'milestone-8-ai-attacks' &&
      github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M8 branch
        uses: actions/checkout@v4
        with:
          ref: milestone-8-ai-attacks
          fetch-depth: 0

      - name: Apply Round 11 candidate patch
        run: python3 .github/scripts/m8_round11_patch.py

      - name: Set up Node 22.23.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Node 22 syntax and diff gates
        run: |
          node --version
          node --check src/contract-attacks.js
          node --check test/m8-codex-round11.test.js
          git diff --check
          git diff --exit-code origin/main -- src/engine.js

      - name: Node 22 Round 11 regressions
        run: node --test test/m8-codex-round11.test.js

      - name: Node 22 focused M8 suites
        run: node --test test/ai-data.test.js test/contract-attacks.test.js test/m8-codex-*.test.js

      - name: Node 22 full repository
        run: npm test

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Node 24 adversarial and full gate
        run: |
          node --version
          node --test test/m8-codex-round9.test.js test/m8-codex-round10.test.js test/m8-codex-round11.test.js
          npm test

      - name: Set up Node 14.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Node 14 minimum-runtime gate
        run: |
          node --version
          node --check src/contract-attacks.js
          node --check src/ai-data.js
          node .github/scripts/m8_round11_node14_smoke.js

      - name: Commit validated Round 11 source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/M8_AI_ATTACKS_SPEC.md src/contract-attacks.js test/m8-codex-round11.test.js
          git diff --cached --check
          git status --short
          git commit -m "fix: preserve exact evaluator realm provenance"
          git push origin HEAD:milestone-8-ai-attacks
