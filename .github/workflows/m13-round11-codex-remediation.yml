name: M13 Round11 Codex remediation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a
    paths:
      - scripts/qa/m13-round11-codex-remediation.py
      - scripts/qa/m13-round11-codex-remediation-v2.py
      - .github/workflows/m13-round11-codex-remediation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: ["14.21.3", "16.20.2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round11 patch
        run: |
          python3 scripts/qa/m13-round11-codex-remediation.py
          python3 scripts/qa/m13-round11-codex-remediation-v2.py
      - name: Syntax and diff hygiene
        run: |
          node --check src/runtime-authority.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          ! grep -q 'inspectorHasNodeInternalFunctionOrigin' src/runtime-authority.js
          ! grep -q 'nodeMajorVersion' src/runtime-authority.js
          ! grep -q 'getAuthenticatedBuiltinModule' src/runtime-authority.js
          ! grep -q 'bootstrapOwnDataValue(process,' src/runtime-authority.js
      - name: Compatibility smoke
        run: |
          node - <<'NODE'
          const api = require('./src');
          if (!api || typeof api !== 'object') throw new Error('root API unavailable');
          const authority = require('./src/runtime-authority');
          if (typeof authority.canLoadMutableBuiltinGraph !== 'function') throw new Error('preflight unavailable');
          if (authority.canLoadMutableBuiltinGraph() !== true) throw new Error('clean builtin graph rejected');
          NODE

  supported:
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "20.0.0", "20.11.1", "20.12.0", "20.15.1", "20.20.2", "22.0.0", "22.2.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round11 patch
        run: |
          python3 scripts/qa/m13-round11-codex-remediation.py
          python3 scripts/qa/m13-round11-codex-remediation-v2.py
      - name: Static guards
        run: |
          node --check src/runtime-authority.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          ! grep -q 'inspectorHasNodeInternalFunctionOrigin' src/runtime-authority.js
          ! grep -q 'nodeMajorVersion' src/runtime-authority.js
          ! grep -q 'getAuthenticatedBuiltinModule' src/runtime-authority.js
          ! grep -q 'authenticatedGetBuiltinModule' src/runtime-authority.js
          ! grep -q 'bootstrapOwnDataValue(process,' src/runtime-authority.js
      - name: Focused authority and M13 regressions
        run: node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
      - name: Full repository suite
        run: npm test

  node22_stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Round11 patch
        run: |
          python3 scripts/qa/m13-round11-codex-remediation.py
          python3 scripts/qa/m13-round11-codex-remediation-v2.py
      - name: Repeat focused authority suite
        run: |
          for i in 1 2 3; do
            echo "Round11 stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
          done
