name: M13 final exact production validation

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-final-exact-production-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_PRODUCTION_HEAD: 369fa9e9d0c899fc6fc8310c448c7a8f1d5cb8e5

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: ["14.21.3", "16.20.2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_PRODUCTION_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact head and static hygiene
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_PRODUCTION_HEAD"
          node --check src/runtime-authority.js
          node --check src/legacy-ai-data-safe.js
          node --check src/provider-adapter.js
          node --check src/provider-adapter-m13.js
          node --check src/contract-attacks-core.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          test -z "$(find .github/workflows scripts/qa -type f -name 'm13-round11-*' -print 2>/dev/null)"
      - name: Compatibility bootstrap
        run: |
          node - <<'NODE'
          const api = require('./src');
          const authority = require('./src/runtime-authority');
          if (!api || typeof api !== 'object') throw new Error('root API unavailable');
          if (typeof authority.canLoadMutableBuiltinGraph !== 'function') throw new Error('preflight unavailable');
          if (authority.canLoadMutableBuiltinGraph() !== true) throw new Error('legacy host generation rejected');
          NODE
      - name: Node 14 preserves pre-existing fail-closed advanced API contract
        if: matrix.node == '14.21.3'
        run: |
          node - <<'NODE'
          const api = require('./src');
          const authority = require('./src/runtime-authority');
          if (authority.consumerPrimordialsAvailable !== false) throw new Error('unexpected Node14 consumer authority change');
          if (authority.promiseAuthorityAvailable !== false) throw new Error('unexpected Node14 promise authority change');
          if (api.runContractAttacks.name !== 'unavailableAsyncBoundary') throw new Error('Node14 M8 boundary changed');
          if (api.createStructuredProviderAdapter.name !== 'unavailableAdapterBoundary') throw new Error('Node14 adapter boundary changed');
          NODE
      - name: Node 16 focused compatibility
        if: matrix.node == '16.20.2'
        run: node --test test/contract-attacks.test.js test/provider-adapter.test.js test/provider-adapter-m13.test.js test/m13-review-remediation.test.js

  supported:
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "20.0.0", "20.11.1", "20.12.0", "20.15.1", "20.20.2", "22.0.0", "22.2.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_PRODUCTION_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact head and static guards
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_PRODUCTION_HEAD"
          node --check src/runtime-authority.js
          node --check src/legacy-ai-data-safe.js
          node --check src/provider-adapter.js
          node --check src/provider-adapter-m13.js
          node --check src/contract-attacks-core.js
          node --check src/ai-data-core.js
          node --check src/quality-contract.js
          node --check src/contract-quality-loop.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          ! grep -q 'inspectorHasNodeInternalFunctionOrigin' src/runtime-authority.js
          ! grep -q 'nodeMajorVersion' src/runtime-authority.js
          ! grep -q 'getAuthenticatedBuiltinModule' src/runtime-authority.js
          ! grep -q 'authenticatedGetBuiltinModule' src/runtime-authority.js
          ! grep -q 'bootstrapOwnDataValue(process,' src/runtime-authority.js
          ! grep -q 'types: utilTypes' src/quality-contract.js src/contract-quality-loop.js
          ! grep -q 'require("./ai-data-core")' src/provider-adapter.js
          ! grep -q 'require("./ai-data")' src/contract-attacks-core.js
          test -z "$(find .github/workflows scripts/qa -type f -name 'm13-round11-*' -print 2>/dev/null)"
      - name: Focused authority and M8 M11 M13 regressions
        run: node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter.test.js test/provider-adapter-m13.test.js test/contract-attacks.test.js test/m8-runtime-brand-authority.test.js
      - name: Full repository suite
        run: npm test

  node22_stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_PRODUCTION_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_PRODUCTION_HEAD"
      - name: Repeat focused authority suite
        run: |
          for i in 1 2 3; do
            echo "final exact-head stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter.test.js test/provider-adapter-m13.test.js test/contract-attacks.test.js test/m8-runtime-brand-authority.test.js
          done
