name: M13 round6 host-brand diagnostic
on:
  push:
    branches: [milestone-13-runtime-slice-a]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply current round6 remediation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa/m13-codex-p1-round6.py'); t=p.read_text()
          old='if text.count(dupe) != 1:'
          if old not in t: raise SystemExit('round6 duplicate-count marker missing')
          p.write_text(t.replace(old,'if text.count(dupe) != 2:',1))
          PY
          python3 scripts/qa/m13-codex-p1-round6.py
          python3 scripts/qa/m13-codex-p1-round6-followup.py
          python3 scripts/qa/m13-codex-p1-round6-followup2.py
          python3 scripts/qa/m13-codex-p1-round6-followup8.py
          python3 scripts/qa/m13-codex-p1-round6-followup9.py
      - uses: actions/setup-node@v4
        with: { node-version: 18.20.8 }
      - name: Identify prototype-tampered host candidate
        run: |
          node - <<'NODE'
          'use strict';
          const { cloneAiData } = require('./src/ai-data');
          const candidates = [];
          if (typeof AbortController === 'function') candidates.push(['AbortController', new AbortController()]);
          if (typeof CountQueuingStrategy === 'function') candidates.push(['CountQueuingStrategy', new CountQueuingStrategy({ highWaterMark: 1 })]);
          if (typeof ByteLengthQueuingStrategy === 'function') candidates.push(['ByteLengthQueuingStrategy', new ByteLengthQueuingStrategy({ highWaterMark: 1 })]);
          try {
            const { PerformanceObserver } = require('node:perf_hooks');
            candidates.push(['PerformanceObserver', new PerformanceObserver(() => {})]);
          } catch {}
          if (globalThis.crypto) candidates.push(['Crypto', globalThis.crypto]);
          if (globalThis.navigator) candidates.push(['Navigator', globalThis.navigator]);
          for (const [name, value] of candidates) {
            const originalPrototype = Object.getPrototypeOf(value);
            let outcome = 'unknown';
            try {
              Object.setPrototypeOf(value, Object.prototype);
              try {
                cloneAiData(value, name);
                outcome = 'ACCEPTED';
              } catch (error) {
                outcome = `rejected:${error && error.message}`;
              }
            } finally {
              Object.setPrototypeOf(value, originalPrototype);
            }
            console.log(name, outcome);
          }
          NODE
