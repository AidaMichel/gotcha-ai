name: M13 Codex round 7 diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  source-shapes:
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2, 18.20.8, 20.20.2, 22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect clean bootstrap authority shapes
        shell: bash
        run: |
          node <<'NODE'
          const source = Function.prototype.toString;
          const gopd = Object.getOwnPropertyDescriptor;
          const vm = require('node:vm');
          const bufferModule = require('node:buffer');
          const v8 = require('node:v8');
          let publicTypes = null;
          try { publicTypes = require('node:util/types'); } catch {
            try { publicTypes = require('node:util').types; } catch {}
          }
          console.log('node', process.version);
          for (const [label, fn] of [
            ['vm.runInNewContext', vm.runInNewContext],
            ['buffer.Buffer', bufferModule.Buffer],
            ['v8.setFlagsFromString', v8.setFlagsFromString]
          ]) {
            console.log(label, JSON.stringify({
              name: fn && fn.name,
              length: fn && fn.length,
              source: typeof fn === 'function' ? source.call(fn) : null,
              descriptor: label === 'vm.runInNewContext' ? gopd(vm, 'runInNewContext') : label === 'buffer.Buffer' ? gopd(bufferModule, 'Buffer') : gopd(v8, 'setFlagsFromString')
            }));
          }
          for (const name of ['isProxy','isDate','isPromise','isAsyncFunction','isGeneratorFunction']) {
            const fn = publicTypes && publicTypes[name];
            console.log('probe.' + name, JSON.stringify({
              name: fn && fn.name,
              length: fn && fn.length,
              source: typeof fn === 'function' ? source.call(fn) : null,
              descriptor: publicTypes ? gopd(publicTypes, name) : null
            }));
          }
          NODE
