name: M13 Codex round 7 diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  source-shapes:
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2, 18.20.8, 20.20.2, 22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect clean native source shapes
        shell: bash
        run: |
          node <<'NODE'
          const names = ['isProxy','isDate','isRegExp','isMap','isSet','isWeakMap','isWeakSet','isPromise','isNativeError','isAnyArrayBuffer','isBoxedPrimitive','isArgumentsObject','isGeneratorObject','isModuleNamespaceObject','isMapIterator','isSetIterator','isExternal','isAsyncFunction','isGeneratorFunction','isCryptoKey','isKeyObject'];
          const source = Function.prototype.toString;
          let publicTypes = null;
          try { publicTypes = require('node:util/types'); } catch {
            try { publicTypes = require('node:util').types; } catch {}
          }
          let v8 = null;
          try { v8 = require('node:v8'); } catch {}
          console.log('node', process.version);
          console.log('v8.setFlagsFromString', v8 && typeof v8.setFlagsFromString === 'function' ? JSON.stringify(source.call(v8.setFlagsFromString)) : 'missing');
          for (const name of names) {
            const value = publicTypes && publicTypes[name];
            console.log(name, typeof value === 'function' ? JSON.stringify(source.call(value)) : 'missing');
          }
          NODE
