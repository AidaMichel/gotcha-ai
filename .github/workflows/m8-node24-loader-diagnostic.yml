name: M8 Node 24 Loader Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply same bounded remediation as gate
        run: |
          python3 scripts/qa/m8-review4-final-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa/m8-review4-undici-lazy-fix.py')
          s = p.read_text()
          start = s.index("old_reads = ''')") if "old_reads = ''')" in s else s.index("old_reads = '''")
          end = s.index("marker = ", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 scripts/qa/m8-review4-undici-lazy-fix.py
          python3 scripts/qa/m8-review4-blob-auth-fix.py
          python3 scripts/qa/m8-review4-abort-symbol-fix.py
          python3 scripts/qa/m8-review4-abort-private-fix.py
          python3 scripts/qa/m8-review4-trim.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Trace generated ai-data AbortController global access
        shell: bash
        run: |
          node - <<'NODE' > node24-loader-probe.log 2>&1
          "use strict";

          const OriginalAbortController = globalThis.AbortController;
          const saved = new OriginalAbortController();
          saved.foo = "bar";
          Object.setPrototypeOf(saved, Object.prototype);

          let getterCalls = 0;
          let setterCalls = 0;
          const stacks = [];

          Object.defineProperty(globalThis, "AbortController", {
            configurable: true,
            enumerable: false,
            get() {
              getterCalls += 1;
              stacks.push(new Error("AbortController getter access").stack);
              throw new Error("diagnostic poisoned AbortController getter");
            },
            set() {
              setterCalls += 1;
              stacks.push(new Error("AbortController setter access").stack);
              throw new Error("diagnostic poisoned AbortController setter");
            }
          });

          globalThis.structuredClone = undefined;
          let requireError = null;
          let cloneError = null;
          let cloneAiData = null;

          try {
            ({ cloneAiData } = require("./src/ai-data"));
          } catch (caught) {
            requireError = caught;
          }

          console.log("node", process.version);
          console.log("after require", JSON.stringify({ getterCalls, setterCalls, requireError: requireError ? String(requireError.message || requireError) : null }));

          if (cloneAiData) {
            try {
              cloneAiData(saved);
            } catch (caught) {
              cloneError = caught;
            }
          }

          console.log("after clone", JSON.stringify({ getterCalls, setterCalls, cloneError: cloneError ? String(cloneError.message || cloneError) : null }));
          console.log("STACKS");
          for (const stack of stacks) console.log(stack);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: m8-node24-loader-diagnostic
          path: node24-loader-probe.log
          if-no-files-found: error
