name: M13 Round9 bootstrap remediation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round9 remediation
        run: |
          python3 scripts/qa/m13-round9-bootstrap-remediation.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v2.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v3.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v4.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v5.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v6.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v7.py
      - name: Syntax and compatibility smoke
        run: |
          for f in src/package-authority.js src/runtime-authority.js src/provider-adapter-m13.js src/contract-attacks-core.js src/index.js test/m13-review-remediation.test.js; do
            node --check "$f"
          done
          git diff --check
          node - <<'NODE'
          const api = require('./src');
          for (const name of ['runContractAttacks','generateContractProtectionProposal','createStructuredProviderAdapter']) {
            if (typeof api[name] !== 'function') throw new Error(name + ' is not callable');
          }
          NODE

  supported-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round9 remediation
        run: |
          python3 scripts/qa/m13-round9-bootstrap-remediation.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v2.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v3.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v4.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v5.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v6.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v7.py
      - name: Inspector and lazy builtin phase trace
        run: node scripts/qa/m13-round9-node18-diagnostic.js
      - name: Static bootstrap authority checks
        run: |
          if grep -n -F 'bootstrapOwnDataValue(process, "moduleLoadList")' src/runtime-authority.js; then
            echo 'runtime-authority still consults process.moduleLoadList'
            exit 1
          fi
          if grep -n -F 'require("node:util")' src/index.js; then
            echo 'package root still reloads mutable node:util during authority bootstrap'
            exit 1
          fi
          if grep -n -F 'types: utilTypes' src/provider-adapter-m13.js src/contract-attacks-core.js; then
            echo 'Round9 lazy surfaces still destructure mutable util.types authority'
            exit 1
          fi
          if grep -n -F 'reflectApply(isPromise, utilTypes' src/provider-adapter-m13.js; then
            echo 'provider adapter still depends on utilTypes receiver'
            exit 1
          fi
          git diff --check
      - name: Focused Round9 and authority regressions
        run: node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
      - name: Node 22 focused stress
        if: startsWith(matrix.node, '22')
        run: |
          for i in 1 2 3; do
            echo "Round9 focused stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
          done
      - name: Full repository suite
        run: npm test

  materialize:
    needs: [compatibility, supported-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-13-runtime-slice-a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tested Round9 remediation
        run: |
          python3 scripts/qa/m13-round9-bootstrap-remediation.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v2.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v3.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v4.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v5.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v6.py
          python3 scripts/qa/m13-round9-bootstrap-remediation-v7.py
      - name: Remove temporary Round9 QA harness
        run: |
          rm -f .github/workflows/m13-round9-bootstrap-remediation.yml
          rm -f scripts/qa/m13-round9-bootstrap-remediation.py
          rm -f scripts/qa/m13-round9-bootstrap-remediation-v2.py
          rm -f scripts/qa/m13-round9-bootstrap-remediation-v3.py
          rm -f scripts/qa/m13-round9-bootstrap-remediation-v4.py
          rm -f scripts/qa/m13-round9-bootstrap-remediation-v5.py
          rm -f scripts/qa/m13-round9-bootstrap-remediation-v6.py
          rm -f scripts/qa/m13-round9-bootstrap-remediation-v7.py
          rm -f scripts/qa/m13-round9-node18-diagnostic.js
      - name: Verify exact cleaned tree
        run: |
          for f in src/package-authority.js src/runtime-authority.js src/provider-adapter-m13.js src/contract-attacks-core.js src/index.js test/m13-review-remediation.test.js; do
            node --check "$f"
          done
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/m13-round9-bootstrap-remediation.yml',
              'scripts/qa/m13-round9-bootstrap-remediation.py',
              'scripts/qa/m13-round9-bootstrap-remediation-v2.py',
              'scripts/qa/m13-round9-bootstrap-remediation-v3.py',
              'scripts/qa/m13-round9-bootstrap-remediation-v4.py',
              'scripts/qa/m13-round9-bootstrap-remediation-v5.py',
              'scripts/qa/m13-round9-bootstrap-remediation-v6.py',
              'scripts/qa/m13-round9-bootstrap-remediation-v7.py',
              'scripts/qa/m13-round9-node18-diagnostic.js',
              'src/contract-attacks-core.js',
              'src/index.js',
              'src/package-authority.js',
              'src/provider-adapter-m13.js',
              'src/runtime-authority.js',
              'test/m13-review-remediation.test.js',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected materialization diff: missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          PY
          if grep -R -n -E 'm13-round9-(bootstrap-remediation|node18-diagnostic)' .github scripts 2>/dev/null; then
            echo 'temporary Round9 artifacts remain'
            exit 1
          fi
          node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
          for i in 1 2 3; do
            echo "Materialized Node22 stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
          done
          npm test
      - name: Commit exact tested production state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close M13 Codex round9 bootstrap findings'
          git push origin HEAD:milestone-13-runtime-slice-a
