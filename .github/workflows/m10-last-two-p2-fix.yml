name: M10LastTwoP2Fix

'on':
  push:
    branches:
      - milestone-10-remediation-r20-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-10-remediation-r20-impl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply last two Slice-A P2 fixes
        run: python3 scripts/qa/m10-last-two-p2-fix.py
      - name: Narrow String regression to the experiment seam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/contract-experiment-last-p2-regressions.test.js')
          text = p.read_text()
          old = '''            globalThis.String = function poisonedString() {
              throw new Error("mutable global String must not be used");
            };'''
          new = '''            globalThis.String = function poisonedString(value) {
              const stack = new Error().stack || "";
              if (stack.includes("generatorSurfaceIsSafe")) {
                throw new Error("mutable global String must not be used by experiment capture");
              }
              return originalString(value);
            };'''
          if old not in text:
              raise SystemExit('target String regression block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate full implementation
        run: |
          node --check src/contract-experiment-intrinsics.js
          node --check src/contract-experiment.js
          node --check src/contract-experiment-safe.js
          node --check src/contract-attacks.js
          node --check src/contract-attacks-core.js
          node --test test/contract-experiment-last-p2-regressions.test.js
          npm test
          git diff --check
      - name: Commit tested fix and remove one-shot files
        run: |
          rm -f .github/workflows/m10-last-two-p2-fix.yml
          rm -f scripts/qa/m10-last-two-p2-fix.py
          git config user.name AidaMichel
          git config user.email 126730924+AidaMichel@users.noreply.github.com
          git add -A
          git commit -m "fix: close last two Slice-A P2 findings"
          git push origin HEAD:milestone-10-remediation-r20-impl
