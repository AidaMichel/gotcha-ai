name: M13 guarded Promise authority

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-13-runtime-slice-a
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Apply guarded Promise authority remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Make contract-attacks-core capture ambient Promise without ever
          # dereferencing it unsafely, while retaining a current-realm native
          # Promise intrinsic for its own internal machinery.
          path = Path('src/contract-attacks-core.js')
          text = path.read_text()
          marker = '''const {
            runInNewContext
          } = require("node:vm");
          '''
          if marker not in text:
              raise SystemExit('contract-attacks-core vm marker missing')
          insert = marker + '''
          const promiseCaptureGetOwnPropertyDescriptor =
            Object.getOwnPropertyDescriptor;
          const promiseCaptureGetPrototypeOf =
            Object.getPrototypeOf;
          const promiseCaptureIsProxy =
            utilTypes.isProxy;

          const intrinsicPromiseProbe =
            (async function gotchaIntrinsicPromiseProbe() {})();
          const intrinsicPromisePrototype =
            promiseCaptureGetPrototypeOf(intrinsicPromiseProbe);
          const intrinsicPromiseConstructorDescriptor =
            promiseCaptureGetOwnPropertyDescriptor(
              intrinsicPromisePrototype,
              "constructor"
            );
          const intrinsicPromiseThenDescriptor =
            promiseCaptureGetOwnPropertyDescriptor(
              intrinsicPromisePrototype,
              "then"
            );
          const intrinsicPromiseConstructor =
            intrinsicPromiseConstructorDescriptor !== undefined &&
            !("get" in intrinsicPromiseConstructorDescriptor) &&
            !("set" in intrinsicPromiseConstructorDescriptor) &&
            typeof intrinsicPromiseConstructorDescriptor.value === "function" &&
            promiseCaptureIsProxy(intrinsicPromiseConstructorDescriptor.value) !== true
              ? intrinsicPromiseConstructorDescriptor.value
              : null;
          const intrinsicPromiseThen =
            intrinsicPromiseThenDescriptor !== undefined &&
            !("get" in intrinsicPromiseThenDescriptor) &&
            !("set" in intrinsicPromiseThenDescriptor) &&
            typeof intrinsicPromiseThenDescriptor.value === "function" &&
            promiseCaptureIsProxy(intrinsicPromiseThenDescriptor.value) !== true
              ? intrinsicPromiseThenDescriptor.value
              : null;

          let capturedAmbientPromiseConstructor = null;
          let capturedAmbientPromisePrototype = null;
          let capturedAmbientPromiseThen = null;
          try {
            const ambientPromiseCandidate = globalThis.Promise;
            if (
              typeof ambientPromiseCandidate === "function" &&
              promiseCaptureIsProxy(ambientPromiseCandidate) !== true
            ) {
              const prototypeDescriptor =
                promiseCaptureGetOwnPropertyDescriptor(
                  ambientPromiseCandidate,
                  "prototype"
                );
              if (
                prototypeDescriptor !== undefined &&
                !("get" in prototypeDescriptor) &&
                !("set" in prototypeDescriptor) &&
                prototypeDescriptor.value !== null &&
                typeof prototypeDescriptor.value === "object" &&
                promiseCaptureIsProxy(prototypeDescriptor.value) !== true
              ) {
                const thenDescriptor =
                  promiseCaptureGetOwnPropertyDescriptor(
                    prototypeDescriptor.value,
                    "then"
                  );
                if (
                  thenDescriptor !== undefined &&
                  !("get" in thenDescriptor) &&
                  !("set" in thenDescriptor) &&
                  typeof thenDescriptor.value === "function" &&
                  promiseCaptureIsProxy(thenDescriptor.value) !== true
                ) {
                  capturedAmbientPromiseConstructor = ambientPromiseCandidate;
                  capturedAmbientPromisePrototype = prototypeDescriptor.value;
                  capturedAmbientPromiseThen = thenDescriptor.value;
                }
              }
            }
          } catch {
            capturedAmbientPromiseConstructor = null;
            capturedAmbientPromisePrototype = null;
            capturedAmbientPromiseThen = null;
          }
          '''
          text = text.replace(marker, insert, 1)

          text = text.replace(
              '''    PromiseConstructor:\n      Promise,\n''',
              '''    PromiseConstructor:\n      capturedAmbientPromiseConstructor,\n    PromisePrototype:\n      capturedAmbientPromisePrototype,\n''',
              1
          )
          text = text.replace(
              '''    PromiseThen:\n      Promise.prototype.then,\n''',
              '''    PromiseThen:\n      capturedAmbientPromiseThen,\n''',
              1
          )

          old_internal = '''const promisePrototype =\n  Promise.prototype;\n\nconst promiseConstructor =\n  Promise;\n\nconst promiseThen =\n  Promise.prototype.then;\n'''
          new_internal = '''const promisePrototype =\n  intrinsicPromisePrototype;\n\nconst promiseConstructor =\n  intrinsicPromiseConstructor;\n\nconst promiseThen =\n  intrinsicPromiseThen;\n'''
          if old_internal not in text:
              raise SystemExit('contract-attacks-core internal Promise block missing')
          text = text.replace(old_internal, new_internal, 1)
          path.write_text(text)

          # 2) Consume the guarded prototype capture in M13 instead of reading
          # PromiseConstructor.prototype from a possibly missing binding.
          path = Path('src/contract-protection-proposal.js')
          text = path.read_text()
          text = text.replace(
              '''  PromiseConstructor,\n  TypeErrorConstructor,\n''',
              '''  PromiseConstructor,\n  PromisePrototype: promisePrototype,\n  TypeErrorConstructor,\n''',
              1
          )
          computed = '''const promisePrototype =\n  typeof PromiseConstructor === "function"\n    ? PromiseConstructor.prototype\n    : null;\n'''
          if computed not in text:
              raise SystemExit('M13 computed Promise prototype block missing')
          text = text.replace(computed, '', 1)
          path.write_text(text)

          # 3) Authenticate the new adapter mode's Promise authority against a
          # current-realm native Promise intrinsic and lazy-load the legacy M11
          # adapter so missing global.Promise cannot abort package loading.
          path = Path('src/provider-adapter-m13.js')
          text = path.read_text()
          text = text.replace(
              '''const { types: utilTypes } = require("node:util");\n''',
              '''const { types: utilTypes } = require("node:util");\nconst { runInNewContext } = require("node:vm");\n''',
              1
          )
          legacy = '''const {\n  createStructuredProviderAdapter: createLegacyStructuredProviderAdapter\n} = require("./provider-adapter");\n\n'''
          if legacy not in text:
              raise SystemExit('provider legacy import marker missing')
          text = text.replace(legacy, '', 1)

          old_promises = '''const PromiseConstructor = Promise;\nconst PromisePrototype = Promise.prototype;\nconst TypeErrorConstructor = TypeError;\nconst ArrayConstructor = Array;\nconst WeakSetConstructor = WeakSet;\nconst promiseThen = Promise.prototype.then;\nconst promiseSpecies = Symbol.species;\n'''
          new_promises = '''const TypeErrorConstructor = TypeError;\nconst ArrayConstructor = Array;\nconst WeakSetConstructor = WeakSet;\nconst promiseSpecies = Symbol.species;\n'''
          if old_promises not in text:
              raise SystemExit('provider ambient Promise capture block missing')
          text = text.replace(old_promises, new_promises, 1)

          old_safe = '''const safePromiseConstructor = objectCreate(null);\ndefineProperty(safePromiseConstructor, promiseSpecies, {\n  value: PromiseConstructor,\n  writable: false,\n  enumerable: false,\n  configurable: false\n});\nObject.freeze(safePromiseConstructor);\n'''
          if old_safe not in text:
              raise SystemExit('provider safe Promise container block missing')
          new_safe = '''let capturedAmbientPromiseConstructor = null;\ntry {\n  capturedAmbientPromiseConstructor = globalThis.Promise;\n} catch {\n  capturedAmbientPromiseConstructor = null;\n}\n\nlet trustedPromiseConstructor = null;\nlet trustedPromisePrototype = null;\nlet trustedPromiseThen = null;\nlet promiseAuthorityAvailable = false;\ntry {\n  const pristineReflectApply = runInNewContext("Reflect.apply");\n  const pristineGetPrototypeOf = runInNewContext("Object.getPrototypeOf");\n  const pristineGetOwnPropertyDescriptor = runInNewContext(\n    "Object.getOwnPropertyDescriptor"\n  );\n  const pristineFunctionToString = runInNewContext("Function.prototype.toString");\n  const pristinePromiseConstructorSource = runInNewContext(\n    "Function.prototype.toString.call(Promise)"\n  );\n  const pristinePromiseThenSource = runInNewContext(\n    "Function.prototype.toString.call(Promise.prototype.then)"\n  );\n  const localPromiseProbe =\n    (async function m13AdapterLocalPromiseProbe() {})();\n  const intrinsicPrototype = pristineReflectApply(\n    pristineGetPrototypeOf,\n    undefined,\n    [localPromiseProbe]\n  );\n  const constructorDescriptor = pristineReflectApply(\n    pristineGetOwnPropertyDescriptor,\n    undefined,\n    [intrinsicPrototype, "constructor"]\n  );\n  const thenDescriptor = pristineReflectApply(\n    pristineGetOwnPropertyDescriptor,\n    undefined,\n    [intrinsicPrototype, "then"]\n  );\n  const intrinsicConstructorSource =\n    constructorDescriptor !== undefined &&\n    typeof constructorDescriptor.value === "function"\n      ? pristineReflectApply(\n          pristineFunctionToString,\n          constructorDescriptor.value,\n          []\n        )\n      : null;\n  const intrinsicThenSource =\n    thenDescriptor !== undefined &&\n    typeof thenDescriptor.value === "function"\n      ? pristineReflectApply(\n          pristineFunctionToString,\n          thenDescriptor.value,\n          []\n        )\n      : null;\n  const intrinsicAuthorityValid = (\n    constructorDescriptor !== undefined &&\n    !("get" in constructorDescriptor) &&\n    !("set" in constructorDescriptor) &&\n    typeof constructorDescriptor.value === "function" &&\n    constructorDescriptor.writable === true &&\n    constructorDescriptor.enumerable === false &&\n    constructorDescriptor.configurable === true &&\n    !isProxy(constructorDescriptor.value) &&\n    intrinsicConstructorSource === pristinePromiseConstructorSource &&\n    thenDescriptor !== undefined &&\n    !("get" in thenDescriptor) &&\n    !("set" in thenDescriptor) &&\n    typeof thenDescriptor.value === "function" &&\n    thenDescriptor.writable === true &&\n    thenDescriptor.enumerable === false &&\n    thenDescriptor.configurable === true &&\n    !isProxy(thenDescriptor.value) &&\n    intrinsicThenSource === pristinePromiseThenSource\n  );\n\n  if (intrinsicAuthorityValid) {\n    trustedPromiseConstructor = constructorDescriptor.value;\n    trustedPromisePrototype = intrinsicPrototype;\n    trustedPromiseThen = thenDescriptor.value;\n  }\n\n  let ambientPrototypeMatches = false;\n  if (\n    intrinsicAuthorityValid &&\n    typeof capturedAmbientPromiseConstructor === "function" &&\n    !isProxy(capturedAmbientPromiseConstructor) &&\n    capturedAmbientPromiseConstructor === trustedPromiseConstructor\n  ) {\n    const ambientPrototypeDescriptor = pristineReflectApply(\n      pristineGetOwnPropertyDescriptor,\n      undefined,\n      [capturedAmbientPromiseConstructor, "prototype"]\n    );\n    ambientPrototypeMatches = (\n      ambientPrototypeDescriptor !== undefined &&\n      !("get" in ambientPrototypeDescriptor) &&\n      !("set" in ambientPrototypeDescriptor) &&\n      ambientPrototypeDescriptor.value === trustedPromisePrototype\n    );\n  }\n\n  promiseAuthorityAvailable =\n    intrinsicAuthorityValid && ambientPrototypeMatches;\n} catch {\n  trustedPromiseConstructor = null;\n  trustedPromisePrototype = null;\n  trustedPromiseThen = null;\n  promiseAuthorityAvailable = false;\n}\n\nlet safePromiseConstructor = null;\nif (promiseAuthorityAvailable) {\n  try {\n    safePromiseConstructor = objectCreate(null);\n    defineProperty(safePromiseConstructor, promiseSpecies, {\n      value: trustedPromiseConstructor,\n      writable: false,\n      enumerable: false,\n      configurable: false\n    });\n    Object.freeze(safePromiseConstructor);\n  } catch {\n    safePromiseConstructor = null;\n    promiseAuthorityAvailable = false;\n  }\n}\n'''
          text = text.replace(old_safe, new_safe, 1)
          text = text.replace(
              '    reflectApply(promiseThen, promise, [onFulfilled, onRejected]);',
              '    reflectApply(trustedPromiseThen, promise, [onFulfilled, onRejected]);',
              1
          )
          old_generator = '''  return function contractProtectionProviderGenerator(generatorRequest) {\n    return new PromiseConstructor((resolve, reject) => {\n'''
          new_generator = '''  return function contractProtectionProviderGenerator(generatorRequest) {\n    if (\n      !promiseAuthorityAvailable ||\n      typeof trustedPromiseConstructor !== "function"\n    ) {\n      return rejectAdapterBoundaryPromise(\n        boundaryError("Promise authority is unavailable.")\n      );\n    }\n    return new trustedPromiseConstructor((resolve, reject) => {\n'''
          if old_generator not in text:
              raise SystemExit('provider generator Promise marker missing')
          text = text.replace(old_generator, new_generator, 1)
          text = text.replace(
              '''          if (getPrototypeOf(transportResult) !== PromisePrototype) {\n''',
              '''          if (getPrototypeOf(transportResult) !== trustedPromisePrototype) {\n''',
              1
          )
          boundary_marker = '''function boundaryError(message) {\n  return new TypeErrorConstructor(message);\n}\n'''
          if boundary_marker not in text:
              raise SystemExit('provider boundaryError marker missing')
          text = text.replace(
              boundary_marker,
              boundary_marker + '''\nasync function rejectAdapterBoundaryPromise(error) {\n  throw error;\n}\n''',
              1
          )
          old_legacy_call = '''  if (descriptors.mode.value !== "contract-protection") {\n    return createLegacyStructuredProviderAdapter(options);\n  }\n'''
          new_legacy_call = '''  if (descriptors.mode.value !== "contract-protection") {\n    const {\n      createStructuredProviderAdapter: createLegacyStructuredProviderAdapter\n    } = require("./provider-adapter");\n    return createLegacyStructuredProviderAdapter(options);\n  }\n'''
          if old_legacy_call not in text:
              raise SystemExit('provider legacy dispatch marker missing')
          text = text.replace(old_legacy_call, new_legacy_call, 1)
          path.write_text(text)
          PY

      - name: Add Promise authority regressions
        shell: bash
        run: |
          cat >> test/m13-review-remediation.test.js <<'EOF'

          test("missing global Promise keeps package loadable and M13 fails closed through a native Promise", () => {
            const modulePath = path.join(repoRoot, "src", "index.js");
            const code = `
              "use strict";
              const NativePromise = Promise;
              delete global.Promise;
              let generatorCalls = 0;
              let api;
              try {
                api = require(${JSON.stringify(modulePath)});
              } catch (error) {
                console.error(error);
                process.exit(7);
              }
              global.Promise = NativePromise;
              const returned = api.generateContractProtectionProposal({
                experiment: null,
                sourceAttackId: "wrong-time",
                generator() {
                  generatorCalls += 1;
                  return {};
                }
              });
              if (!(returned instanceof NativePromise)) process.exitCode = 2;
              returned.then(
                () => { process.exitCode = 3; },
                (error) => {
                  if (!(error instanceof TypeError)) process.exitCode = 4;
                  if (generatorCalls !== 0) process.exitCode = 5;
                }
              );
            `;
            const run = spawnSync(process.execPath, ["-e", code], {
              cwd: repoRoot,
              encoding: "utf8"
            });
            assert.equal(run.status, 0, run.stderr);
          });

          test("contract-protection adapter rejects pre-load Promise constructor poisoning without executing it", () => {
            const modulePath = path.join(repoRoot, "src", "index.js");
            const code = `
              "use strict";
              const NativePromise = Promise;
              let poisonedConstructorCalls = 0;
              function PoisonPromise(executor) {
                poisonedConstructorCalls += 1;
                return new NativePromise(executor);
              }
              PoisonPromise.prototype = NativePromise.prototype;
              global.Promise = PoisonPromise;
              const { createStructuredProviderAdapter } = require(${JSON.stringify(modulePath)});
              global.Promise = NativePromise;
              poisonedConstructorCalls = 0;
              let transportCalls = 0;
              const generator = createStructuredProviderAdapter({
                transport() {
                  transportCalls += 1;
                  return { version: 1, kind: "gotcha-provider-response", output: {} };
                },
                model: "test-model",
                mode: "contract-protection"
              });
              const returned = generator({});
              if (!(returned instanceof NativePromise)) process.exitCode = 2;
              returned.then(
                () => { process.exitCode = 3; },
                (error) => {
                  if (!(error instanceof TypeError)) process.exitCode = 4;
                  if (poisonedConstructorCalls !== 0) process.exitCode = 5;
                  if (transportCalls !== 0) process.exitCode = 6;
                }
              );
            `;
            const run = spawnSync(process.execPath, ["-e", code], {
              cwd: repoRoot,
              encoding: "utf8"
            });
            assert.equal(run.status, 0, run.stderr);
          });
          EOF

      - name: Syntax and focused Node 20 proof
        run: |
          node --check src/contract-attacks-core.js
          node --check src/contract-protection-proposal.js
          node --check src/provider-adapter-m13.js
          node --check test/m13-review-remediation.test.js
          node --test test/contract-protection-proposal.test.js test/m13-review-remediation.test.js test/package-contract-protection-proposal.test.js test/provider-adapter-m13.test.js

      - name: Full Node 20 comparison proof
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/m13-node20-full.txt
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/m13-node20-full.txt').read_text()
          failures = [line for line in text.splitlines() if line.startswith('not ok ')]
          allowed = [
              'cloneAiData rejects prototype-tampered hidden-slot runtime objects',
              'Headers and FormData brands remain rejected when own data is added'
          ]
          if len(failures) > 2:
              raise SystemExit(f'unexpected extra failures: {failures}')
          for failure in failures:
              if not any(name in failure for name in allowed):
                  raise SystemExit(f'unexpected failure: {failure}')
          print('Node20 failure set:', failures)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Focused Node 22 proof
        run: |
          node --test test/contract-protection-proposal.test.js test/m13-review-remediation.test.js test/package-contract-protection-proposal.test.js test/provider-adapter-m13.test.js

      - name: Full Node 22 comparison proof
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/m13-node22-full.txt
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/m13-node22-full.txt').read_text()
          failures = [line for line in text.splitlines() if line.startswith('not ok ')]
          allowed = [
              'cloneAiData rejects prototype-tampered hidden-slot runtime objects',
              'Headers and FormData brands remain rejected when own data is added'
          ]
          if len(failures) > 2:
              raise SystemExit(f'unexpected extra failures: {failures}')
          for failure in failures:
              if not any(name in failure for name in allowed):
                  raise SystemExit(f'unexpected failure: {failure}')
          print('Node22 failure set:', failures)
          PY

      - name: Diff hygiene
        run: git diff --check

      - name: Commit tested remediation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/m13-promise-authority-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contract-attacks-core.js src/contract-protection-proposal.js src/provider-adapter-m13.js test/m13-review-remediation.test.js .github/workflows/m13-promise-authority-r2.yml
          git commit -m 'fix: guard M13 Promise authority across load and adapter'
          git push origin HEAD:milestone-13-runtime-slice-a
