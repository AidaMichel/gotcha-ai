name: M13 independent authority audit

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-independent-audit-inspector.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD: 568050c660d1cd7ae211f0fbe2e7c9978bf7f8d5

jobs:
  native_connection_protocol:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.20.2", "22.0.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Native Connection classifies without Session methods
        run: |
          node - <<'NODE'
          const inspector = require('node:inspector');
          const proto = inspector.Session.prototype;
          const saved = {};
          let sessionCalls = 0;
          for (const name of ['connect','disconnect','post']) {
            const d = Object.getOwnPropertyDescriptor(proto, name);
            saved[name] = d;
            if (d && d.configurable) {
              Object.defineProperty(proto, name, {
                ...d,
                value: function poisonedSessionMethod() {
                  sessionCalls += 1;
                  throw new Error('poisoned Session.' + name);
                }
              });
            }
          }

          const binding = process.binding('inspector');
          const C = binding.Connection;
          const dispatch = C.prototype.dispatch;
          const disconnect = C.prototype.disconnect;
          let nextId = 1;
          const pending = new Map();
          const connection = new C((raw) => {
            const message = JSON.parse(raw);
            if (message && message.id && pending.has(message.id)) {
              const slot = pending.get(message.id);
              slot.called = true;
              slot.message = message;
            }
          });
          function send(method, params) {
            const id = nextId++;
            const slot = { called: false, message: null };
            pending.set(id, slot);
            dispatch.call(connection, JSON.stringify({ id, method, params }));
            pending.delete(id);
            if (!slot.called || !slot.message || slot.message.error) {
              throw new Error('CDP response unavailable for ' + method + ': ' + JSON.stringify(slot.message));
            }
            return slot.message.result;
          }

          globalThis.__gotchaAuditFn = require('node:util/types').isProxy;
          const plain = send('Runtime.evaluate', {
            expression: 'globalThis.__gotchaAuditFn',
            generatePreview: false,
            returnByValue: false
          });
          const plainRemote = plain.result;
          const plainProps = send('Runtime.getProperties', {
            objectId: plainRemote.objectId,
            ownProperties: true,
            generatePreview: false
          });

          const original = require('node:util/types').isProxy;
          globalThis.__gotchaAuditFn = new Proxy(original, { apply(t,r,a){ return Reflect.apply(t,r,a); } });
          const proxied = send('Runtime.evaluate', {
            expression: 'globalThis.__gotchaAuditFn',
            generatePreview: false,
            returnByValue: false
          });

          globalThis.__gotchaAuditFn = original.bind(undefined);
          const bound = send('Runtime.evaluate', {
            expression: 'globalThis.__gotchaAuditFn',
            generatePreview: false,
            returnByValue: false
          });
          const boundRemote = bound.result;
          const boundProps = send('Runtime.getProperties', {
            objectId: boundRemote.objectId,
            ownProperties: true,
            generatePreview: false
          });

          disconnect.call(connection);
          delete globalThis.__gotchaAuditFn;
          for (const name of Object.keys(saved)) {
            if (saved[name]) Object.defineProperty(proto, name, saved[name]);
          }

          const plainBoundSlots = (plainProps.internalProperties || []).filter(x => /Bound|TargetFunction/.test(x.name));
          const boundSlots = (boundProps.internalProperties || []).filter(x => /Bound|TargetFunction/.test(x.name));
          console.log(JSON.stringify({
            node: process.version,
            sessionCalls,
            plainSubtype: plainRemote.subtype,
            plainBoundSlots: plainBoundSlots.map(x => x.name),
            proxySubtype: proxied.result && proxied.result.subtype,
            boundSubtype: boundRemote.subtype,
            boundSlots: boundSlots.map(x => x.name)
          }));
          if (sessionCalls !== 0) process.exit(91);
          if (proxied.result.subtype !== 'proxy') process.exit(92);
          if (boundSlots.length === 0) process.exit(93);
          NODE
