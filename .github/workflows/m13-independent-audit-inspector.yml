name: M13 independent Inspector authority audit

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-independent-audit-inspector.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD: 568050c660d1cd7ae211f0fbe2e7c9978bf7f8d5

jobs:
  util_sources:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.20.2", "22.0.0", "22.2.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Print util/types callable identities
        run: |
          node - <<'NODE'
          const types = require('node:util/types');
          const names = ['isProxy','isPromise','isDate','isRegExp','isMap','isSet','isNativeError','isAnyArrayBuffer','isBoxedPrimitive','isArgumentsObject','isGeneratorObject','isModuleNamespaceObject','isMapIterator','isSetIterator','isExternal'];
          for (const name of names) {
            const fn = types[name];
            console.log(JSON.stringify({ name, fnName: fn && fn.name, length: fn && fn.length, source: typeof fn === 'function' ? Function.prototype.toString.call(fn) : null }));
          }
          NODE
