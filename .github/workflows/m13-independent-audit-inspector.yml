name: M13 independent authority audit

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-independent-audit-inspector.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD: 568050c660d1cd7ae211f0fbe2e7c9978bf7f8d5

jobs:
  inspector_binding_probe:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.20.2", "22.0.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe native inspector binding under util poisoning
        run: |
          node - <<'NODE'
          const util = require('node:util');
          let parentTypesCalls = 0;
          const parentDesc = Object.getOwnPropertyDescriptor(util, 'types');
          if (parentDesc && parentDesc.configurable) {
            Object.defineProperty(util, 'types', {
              configurable: true,
              enumerable: parentDesc.enumerable,
              get() { parentTypesCalls += 1; throw new Error('poison parent util.types'); }
            });
          }
          const processBindingDesc = Object.getOwnPropertyDescriptor(process, 'binding');
          let binding = null;
          let error = null;
          try {
            binding = processBindingDesc && typeof processBindingDesc.value === 'function'
              ? Reflect.apply(processBindingDesc.value, process, ['inspector'])
              : null;
          } catch (e) { error = e; }
          const out = {
            node: process.version,
            parentTypesCalls,
            bindingError: error && error.message,
            processBinding: processBindingDesc && typeof processBindingDesc.value === 'function' ? {
              writable: processBindingDesc.writable,
              configurable: processBindingDesc.configurable,
              enumerable: processBindingDesc.enumerable,
              name: processBindingDesc.value.name,
              length: processBindingDesc.value.length,
              source: Function.prototype.toString.call(processBindingDesc.value)
            } : null,
            keys: [],
            connection: null
          };
          try { out.keys = binding ? Reflect.ownKeys(binding).map(String) : []; } catch {}
          if (binding) {
            const d = Object.getOwnPropertyDescriptor(binding, 'Connection');
            if (d && typeof d.value === 'function') {
              const proto = d.value.prototype;
              const dispatch = proto && Object.getOwnPropertyDescriptor(proto, 'dispatch');
              const disconnect = proto && Object.getOwnPropertyDescriptor(proto, 'disconnect');
              out.connection = {
                name: d.value.name,
                source: Function.prototype.toString.call(d.value),
                dispatch: dispatch && typeof dispatch.value === 'function' ? Function.prototype.toString.call(dispatch.value) : null,
                disconnect: disconnect && typeof disconnect.value === 'function' ? Function.prototype.toString.call(disconnect.value) : null
              };
            }
          }
          console.log(JSON.stringify(out));
          NODE
