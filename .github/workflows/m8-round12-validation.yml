name: M8 Round 12 validation

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'milestone-8-ai-attacks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-8-ai-attacks
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Apply Round 12 candidate
        run: python3 .github/scripts/m8_round12_patch.py

      - name: Syntax and diff gates
        run: |
          node --check src/contract-attacks.js
          node --check test/m8-codex-round12.test.js
          git diff --check
          git diff --exit-code origin/main -- src/engine.js

      - name: Round 12 targeted regressions
        run: node --test test/m8-codex-round12.test.js

      - name: Focused M8 suites on Node 22
        run: node --test test/ai-data.test.js test/contract-attacks.test.js test/m8-codex*.test.js

      - name: Full repository on Node 22
        run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Adversarial suites on Node 24
        run: node --test test/m8-codex-round9.test.js test/m8-codex-round10.test.js test/m8-codex-round11.test.js test/m8-codex-round12.test.js

      - name: Full repository on Node 24
        run: npm test

      - name: Node 14.18 minimum-runtime smoke
        run: docker run --rm -v "$PWD:/repo" -w /repo node:14.18.0 node .github/scripts/m8_round12_node14_smoke.js

      - name: Commit validated Round 12 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contract-attacks.js docs/M8_AI_ATTACKS_SPEC.md test/m8-codex-round12.test.js
          git commit -m "fix: detach evaluator realm behavior surfaces"
          git push origin HEAD:milestone-8-ai-attacks
