name: M13 Round11 binding diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-binding-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.11.1", "20.12.0", "22.0.0", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe binding entrypoints
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const td = Object.getOwnPropertyDescriptor(util, 'types');
          const id = Object.getOwnPropertyDescriptor(util, 'inspect');
          let tc=0, ic=0;
          if (td && td.configurable) Object.defineProperty(util,'types',{configurable:true,enumerable:td.enumerable,get(){tc++;throw new Error('types')}});
          if (id && id.configurable) Object.defineProperty(util,'inspect',{configurable:true,enumerable:id.enumerable,get(){ic++;throw new Error('inspect')}});
          function attempt(label, fn){const bt=tc,bi=ic;let out=null,err=null;try{out=fn()}catch(e){err=String(e&&e.message||e)}console.log(JSON.stringify({node:process.version,label,dt:tc-bt,di:ic-bi,type:typeof out,err}))}
          attempt('binding-util',()=>process.binding('util'));
          attempt('binding-natives',()=>process.binding('natives'));
          attempt('linked-util',()=>process._linkedBinding('util'));
          attempt('linked-natives',()=>process._linkedBinding('natives'));
          attempt('linked-config',()=>process._linkedBinding('config'));
          attempt('binding-config',()=>process.binding('config'));
          if (td && td.configurable) Object.defineProperty(util,'types',td);
          if (id && id.configurable) Object.defineProperty(util,'inspect',id);
          NODE
