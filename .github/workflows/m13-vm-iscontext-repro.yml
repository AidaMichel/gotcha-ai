name: M13 vm.isContext authority reproduction

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Keep poisoned vm.isContext unexecuted
        run: |
          node <<'NODE'
          "use strict";
          const vm = require("node:vm");
          const original = Object.getOwnPropertyDescriptor(vm, "isContext");
          let calls = 0;
          Object.defineProperty(vm, "isContext", {
            value: function isContext() {
              calls += 1;
              throw new Error("poisoned vm.isContext executed");
            },
            writable: true,
            enumerable: original.enumerable,
            configurable: true
          });

          (async () => {
            try {
              const api = require("./src");
              const contract = {
                version: 1,
                status: "confirmed",
                task: "Return the approved time.",
                rules: [{
                  id: "time-rule",
                  statement: "Time must be 3 PM.",
                  kind: "required",
                  severity: "major"
                }]
              };
              try {
                await api.runContractAttacks({
                  contract,
                  input: { request: "Schedule the meeting." },
                  expectedOutput: { time: "3 PM" },
                  evaluator(output) { return output.time === "3 PM"; },
                  generator() { return { version: 1, task: contract.task, attacks: [] }; }
                });
              } catch (error) {
                console.error(error && error.stack || error);
              }
              if (calls !== 0) {
                console.error("REPRODUCED: poisoned vm.isContext executed", calls);
                process.exitCode = 91;
              }
            } finally {
              Object.defineProperty(vm, "isContext", original);
            }
          })().catch((error) => {
            console.error(error && error.stack || error);
            process.exitCode = 92;
          });
          NODE
