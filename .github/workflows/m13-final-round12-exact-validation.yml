name: M13 final Round12 exact validation

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-final-round12-exact-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_HEAD: d89f7157a50fe8c2853f0fcb6f95500bce60d91d

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: ["14.21.3", "16.20.2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact head, syntax, bootstrap
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          node --check src/package-authority.js
          node --check src/index.js
          node --check src/contract-attacks-core.js
          node --check src/provider-adapter-m13.js
          git diff --check
          node -e "const api=require('./src'); if(!api||typeof api!=='object') throw new Error('root API unavailable')"
      - name: Node14 historical fail-closed contract
        if: matrix.node == '14.21.3'
        run: |
          node - <<'NODE'
          const api = require('./src');
          const authority = require('./src/runtime-authority');
          if (authority.consumerPrimordialsAvailable !== false) throw new Error('Node14 authority contract changed');
          Promise.resolve(api.runContractAttacks({})).then(
            () => { throw new Error('Node14 M8 unexpectedly executed'); },
            () => {}
          );
          NODE
      - name: Node16 focused compatibility
        if: matrix.node == '16.20.2'
        run: node --test test/contract-attacks.test.js test/provider-adapter.test.js test/provider-adapter-m13.test.js test/m13-review-remediation.test.js

  supported:
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20.8", "20.0.0", "20.11.1", "20.12.0", "20.15.1", "20.20.2", "22.0.0", "22.2.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exact head and static guards
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          node --check src/package-authority.js
          node --check src/index.js
          node --check src/contract-attacks-core.js
          node --check src/provider-adapter-m13.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          ! grep -q 'return require(modulePath)\[name\]' src/index.js
          ! find .github/workflows scripts/qa -type f -name 'm13-round12-*' -print | grep -q .
      - name: Post-load authority mutation regression
        run: |
          node - <<'NODE'
          'use strict';
          const api = require('./src');
          const originals = {
            gopd: Object.getOwnPropertyDescriptor,
            gopds: Object.getOwnPropertyDescriptors,
            getProto: Object.getPrototypeOf,
            apply: Reflect.apply
          };
          let calls = 0;
          Object.getOwnPropertyDescriptor = function (...args) { calls += 1; return originals.gopd(...args); };
          Object.getOwnPropertyDescriptors = function (...args) { calls += 1; return originals.gopds(...args); };
          Object.getPrototypeOf = function (...args) { calls += 1; return originals.getProto(...args); };
          Reflect.apply = function (...args) { calls += 1; return originals.apply(...args); };
          void api.runContractAttacks;
          void api.createStructuredProviderAdapter;
          const observed = calls;
          Object.getOwnPropertyDescriptor = originals.gopd;
          Object.getOwnPropertyDescriptors = originals.gopds;
          Object.getPrototypeOf = originals.getProto;
          Reflect.apply = originals.apply;
          if (observed !== 0) throw new Error(`post-load authority calls: ${observed}`);
          NODE
      - name: Focused security and compatibility
        run: node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter.test.js test/provider-adapter-m13.test.js test/contract-attacks.test.js test/m8-runtime-brand-authority.test.js
      - name: Full repository suite
        run: npm test

  node22_adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
      - name: Repeat focused authority suite
        run: |
          for i in 1 2 3; do
            echo "exact Round12 stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter.test.js test/provider-adapter-m13.test.js test/contract-attacks.test.js test/m8-runtime-brand-authority.test.js
          done
      - name: Sweep pre-load retained primordials
        run: |
          node - <<'NODE'
          'use strict';
          const { spawnSync } = require('node:child_process');
          const targets = [
            ['Object','create'], ['Object','keys'], ['Object','setPrototypeOf'],
            ['Reflect','ownKeys'], ['Reflect','deleteProperty'], ['Reflect','construct'],
            ['Number','isFinite'], ['Number','isInteger'],
            ['Array.prototype','map'], ['Array.prototype','find'], ['Array.prototype','push'],
            ['Array.prototype','pop'], ['Array.prototype','values'], ['Array.prototype','keys'],
            ['Array.prototype','entries'], ['String.prototype','trim'], ['String.prototype','startsWith'],
            ['Set.prototype','has'], ['Set.prototype','add'], ['Map.prototype','get'], ['Map.prototype','set'],
            ['WeakSet.prototype','has'], ['WeakSet.prototype','add'], ['WeakSet.prototype','delete'],
            ['WeakMap.prototype','get'], ['WeakMap.prototype','set'], ['JSON','stringify'], ['JSON','parse']
          ];
          const failures = [];
          for (const [holderExpr, key] of targets) {
            const code = `
              'use strict';
              (async () => {
                const holder = ${holderExpr};
                const original = Object.getOwnPropertyDescriptor(holder, ${JSON.stringify(key)});
                if (!original || typeof original.value !== 'function' || original.configurable !== true) return;
                let calls = 0;
                const poison = new Proxy(original.value, {
                  apply(target, thisArg, args) { calls += 1; return Reflect.apply(target, thisArg, args); }
                });
                Object.defineProperty(holder, ${JSON.stringify(key)}, { ...original, value: poison });
                let api;
                try { api = require('./src'); }
                catch (error) { console.error('load', error); process.exitCode = 81; return; }
                Object.defineProperty(holder, ${JSON.stringify(key)}, original);
                try { await api.runContractAttacks({}); } catch {}
                try { api.createStructuredProviderAdapter({}); } catch {}
                try { await api.draftQualityContract({}); } catch {}
                if (calls !== 0) {
                  console.error(${JSON.stringify(holderExpr + '.' + key)}, calls);
                  process.exitCode = 91;
                }
              })().catch((error) => { console.error(error); process.exitCode = 82; });
            `;
            const run = spawnSync(process.execPath, ['-e', code], { cwd: process.cwd(), encoding: 'utf8' });
            if (run.status !== 0) failures.push({ target: holderExpr + '.' + key, status: run.status, stderr: run.stderr.trim() });
          }
          if (failures.length !== 0) {
            console.error(JSON.stringify(failures, null, 2));
            process.exit(1);
          }
          NODE
