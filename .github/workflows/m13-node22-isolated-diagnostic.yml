name: M13 Node22 isolated diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a
    paths-ignore:
      - scripts/qa/m13-node22-isolated.log

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Round-7 candidate
        run: |
          python3 scripts/qa/m13-codex-round7.py
          python3 scripts/qa/m13-codex-round7-followup.py
          python3 scripts/qa/m13-codex-round7-followup2.py
          python3 scripts/qa/m13-codex-round7-followup3.py
          python3 scripts/qa/m13-codex-round7-followup4.py
          python3 scripts/qa/m13-codex-round7-followup5.py
          python3 scripts/qa/m13-codex-round7-followup6.py
          python3 scripts/qa/m13-codex-round7-followup7.py
          python3 scripts/qa/m13-codex-round7-followup8.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Capture Buffer getter stacks
        shell: bash
        run: |
          node <<'NODE' > scripts/qa/m13-node22-isolated.log 2>&1
          "use strict";
          const path = require("node:path");
          const bufferModule = require("node:buffer");
          const original = Object.getOwnPropertyDescriptor(bufferModule, "Buffer");
          let calls = 0;
          const stacks = [];
          Object.defineProperty(bufferModule, "Buffer", {
            get() {
              calls += 1;
              if (stacks.length < 8) stacks.push(new Error("Buffer getter call " + calls).stack);
              return original.value;
            },
            enumerable: original.enumerable,
            configurable: true
          });
          let loaded = false;
          let thrown = null;
          try {
            require(path.join(process.cwd(), "src", "index.js"));
            loaded = true;
          } catch (error) {
            thrown = error && error.stack ? error.stack : String(error);
          } finally {
            Object.defineProperty(bufferModule, "Buffer", original);
          }
          console.log("node=" + process.version);
          console.log("loaded=" + loaded);
          console.log("calls=" + calls);
          if (thrown) console.log("load-error=\n" + thrown);
          for (let index = 0; index < stacks.length; index += 1) {
            console.log("----- stack " + (index + 1) + " -----");
            console.log(stacks[index]);
          }
          NODE

      - name: Commit diagnostic log
        env:
          BRANCH: milestone-13-runtime-slice-a
        run: |
          git add scripts/qa/m13-node22-isolated.log
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git commit -m "qa: record Node22 Buffer getter call stacks" || exit 0
          git push origin HEAD:${BRANCH}
