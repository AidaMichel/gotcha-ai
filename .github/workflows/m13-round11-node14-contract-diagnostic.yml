name: M13 Round11 Node14 contract diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-node14-contract-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old_head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9fe528e9b691f364276937a296c65335668fe8de
      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
      - name: Probe pre-Round11 public execution
        run: |
          node - <<'NODE'
          const api = require('./src');
          const authority = require('./src/runtime-authority');
          console.log(JSON.stringify({
            node: process.version,
            consumer: authority.consumerPrimordialsAvailable,
            promise: authority.promiseAuthorityAvailable,
            runName: api.runContractAttacks && api.runContractAttacks.name,
            adapterName: api.createStructuredProviderAdapter && api.createStructuredProviderAdapter.name
          }));
          Promise.resolve(api.runContractAttacks({
            contract: {
              version: 1, status: 'confirmed', task: 't',
              rules: [{ id: 'r1', statement: 'ok must be true.', kind: 'required', severity: 'major' }]
            },
            input: { request: 'x' },
            expectedOutput: { ok: true },
            evaluator(output) { return output.ok === true; },
            generator() { return { version: 1, task: 't', attacks: [] }; }
          })).then((result) => {
            console.log('OLD_M8_OK', result && result.baselinePassed);
          }).catch((error) => {
            console.log('OLD_M8_ERROR', error && error.message);
            process.exitCode = 91;
          });
          NODE
