name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 redesign
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
      - name: Syntax and diff hygiene
        run: |
          git diff --check
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check src/contract-protection-proposal.js
          node --check src/contract-quality-loop.js
          node --check src/provider-adapter-m13.js
          node --check src/mutation-pack.js
          node --check test/runtime-authority.test.js
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Node 22 runtime authority
        run: node --test test/runtime-authority.test.js
      - name: Node 22 focused
        run: node --test test/runtime-authority.test.js test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js
      - name: Node 22 full
        run: npm test
