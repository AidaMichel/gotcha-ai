name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 redesign
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: cumulative probes 00-04
        continue-on-error: true
        run: node -e "const r=require('./src/runtime-authority'),v={}; for(let i=0;i<=4;i++) if(r.forbiddenProbes[i](v)===true) process.exit(40+i)"
      - name: cumulative probes 00-09
        continue-on-error: true
        run: node -e "const r=require('./src/runtime-authority'),v={}; for(let i=0;i<=9;i++) if(r.forbiddenProbes[i](v)===true) process.exit(40+i)"
      - name: cumulative probes 00-14
        continue-on-error: true
        run: node -e "const r=require('./src/runtime-authority'),v={}; for(let i=0;i<=14;i++) if(r.forbiddenProbes[i](v)===true) process.exit(40+i)"
      - name: cumulative probes 00-18
        continue-on-error: true
        run: node -e "const r=require('./src/runtime-authority'),v={}; for(let i=0;i<=18;i++) if(r.forbiddenProbes[i](v)===true) process.exit(40+i)"
      - name: plain object final gate
        run: node -e "const r=require('./src/runtime-authority'); if(r.hasForbiddenRuntimeBrand({})!==false) process.exit(59)"
