name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 production redesign and regressions
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
          python3 scripts/qa/m13-codex-p1-round5-regressions.py
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: npm }
      - run: npm ci
      - name: Node 18 Promise species authority
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const r = require('./src/runtime-authority');
          const d = Object.getOwnPropertyDescriptor(Promise, Symbol.species);
          console.log(JSON.stringify({
            node: process.version,
            exactProxyAuthority: r.isProxy === util.types.isProxy,
            trustedSpecies: r.hasTrustedLocalPromiseSpecies(Promise, Symbol.species),
            speciesSource: Function.prototype.toString.call(d.get),
            speciesProxy: r.isProxy(d.get),
            speciesLocalPrototype: Object.getPrototypeOf(d.get) === r.localFunctionPrototype
          }));
          NODE
      - name: Node 18 round5 targeted regressions
        run: node --test --test-name-pattern="round5 pre-load Proxy isProxy authority|round5 consumes inherited trusted-constructor" test/m13-review-remediation.test.js
