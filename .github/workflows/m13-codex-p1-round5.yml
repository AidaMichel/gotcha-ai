name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 redesign
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Inspect Node 22 isDate
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const r = require('./src/runtime-authority');
          const c = util.types.isDate;
          console.log(JSON.stringify({
            node: process.version,
            name: c.name,
            source: Function.prototype.toString.call(c),
            localPrototype: Object.getPrototypeOf(c) === r.localFunctionPrototype,
            proxyByAuthority: r.isProxy(c),
            exportedProbeIsCandidate: r.forbiddenProbes[0] === c,
            plainCandidate: c({}),
            plainExportedProbe: r.forbiddenProbes[0]({})
          }));
          NODE
