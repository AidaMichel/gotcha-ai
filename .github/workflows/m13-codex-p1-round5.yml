name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 redesign
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Node 22 plain object allowed
        run: node -e "const r=require('./src/runtime-authority'); if(r.hasForbiddenRuntimeBrand({})!==false) process.exit(31)"
      - name: Node 22 DataView forbidden
        run: node -e "const r=require('./src/runtime-authority'); if(r.hasForbiddenRuntimeBrand(new DataView(new ArrayBuffer(8)))!==true) process.exit(32)"
      - name: Node 22 Uint8Array typed
        run: node -e "const r=require('./src/runtime-authority'); if(r.isTypedArray(new Uint8Array(8))!==true) process.exit(33)"
      - name: Node 22 DataView not typed
        run: node -e "const r=require('./src/runtime-authority'); if(r.isTypedArray(new DataView(new ArrayBuffer(8)))!==false) process.exit(34)"
