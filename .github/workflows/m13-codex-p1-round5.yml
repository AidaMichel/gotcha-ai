name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 redesign
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
      - name: Syntax and diff hygiene
        run: |
          git diff --check
          node --check src/runtime-authority.js
          node --check test/runtime-authority.test.js
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Node 22 basic runtime authority brands
        run: node --test --test-name-pattern="distinguishes plain objects" test/runtime-authority.test.js
      - name: Node 22 poisoned isDataView authority
        run: node --test --test-name-pattern="mutable util.types.isDataView" test/runtime-authority.test.js
