name: M13 Codex P1 round 5

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply round5 redesign
        run: |
          python3 scripts/qa/m13-codex-p1-round5.py
          python3 scripts/qa/m13-codex-p1-round5-followup.py
      - name: Syntax and diff hygiene
        run: |
          git diff --check
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check src/contract-protection-proposal.js
          node --check src/contract-quality-loop.js
          node --check src/provider-adapter-m13.js
          node --check src/mutation-pack.js

      - uses: actions/setup-node@v4
        with: { node-version: 14.21.3, cache: npm }
      - run: npm ci
      - name: Node 14 smoke
        run: node -e "const api=require('./src'); if(typeof api.generateContractProtectionProposal!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with: { node-version: 16.20.2, cache: npm }
      - run: npm ci
      - name: Node 16 smoke
        run: node -e "const api=require('./src'); if(typeof api.createStructuredProviderAdapter!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: npm }
      - run: npm ci
      - name: Node 18 authority diagnostics
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const r = require('./src/runtime-authority');
          const names = [
            'isDate','isRegExp','isMap','isSet','isWeakMap','isWeakSet','isPromise',
            'isNativeError','isAnyArrayBuffer','isDataView','isTypedArray','isBoxedPrimitive',
            'isArgumentsObject','isGeneratorObject','isModuleNamespaceObject','isMapIterator',
            'isSetIterator','isExternal'
          ];
          for (const name of names) {
            const fn = util.types[name];
            let source;
            try { source = Function.prototype.toString.call(fn); } catch (e) { source = String(e); }
            let plain;
            try { plain = fn({}); } catch (e) { plain = 'throw:' + e.name; }
            console.log(name, JSON.stringify({source, fnName: fn && fn.name, plain}));
          }
          console.log('sharedPlainResults', r.forbiddenProbes.map((probe, i) => {
            try { return [i, probe({})]; } catch (e) { return [i, 'throw:' + e.name]; }
          }));
          const checks = {
            proxyPlain: r.isProxy({}) === false,
            proxyPromiseCtor: r.isProxy(Promise) === false,
            promiseBrand: r.isPromise(Promise.resolve()) === true,
            localFunction: r.localFunctionPrototype === Object.getPrototypeOf(function localAnchor() {}),
            promiseSpecies: r.hasTrustedLocalPromiseSpecies(Promise, Symbol.species) === true
          };
          console.log('checks', checks);
          for (const [name, ok] of Object.entries(checks)) {
            if (!ok) throw new Error('authority diagnostic failed: ' + name);
          }
          NODE
      - name: Node 18 focused
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - uses: actions/setup-node@v4
        with: { node-version: 20.20.2, cache: npm }
      - run: npm ci
      - name: Node 20 focused
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Node 22 focused
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Node 24 focused
        run: node --test test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js test/contract-protection-proposal.test.js test/contract-quality-loop.test.js test/package-contract-protection-proposal.test.js
