name: M13 review remediation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Codex remediation
        run: python scripts/qa/m13-remediate-review.py
      - name: Syntax check
        run: |
          node --check src/contract-protection-proposal.js
          node --check test/m13-review-remediation.test.js
      - name: Focused M13 proof
        run: node --test test/contract-protection-proposal.test.js test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/package-contract-protection-proposal.test.js
      - name: Full-suite comparison proof
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/m13-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          python -c 'import re; from pathlib import Path; text=Path("/tmp/m13-full-suite.log").read_text(); failures=re.findall(r"^not ok \d+ - (.+)$", text, flags=re.MULTILINE); expected=["cloneAiData rejects prototype-tampered hidden-slot runtime objects","Headers and FormData brands remain rejected when own data is added"]; assert failures == expected, failures; assert "# fail 2" in text'
          test "$status" -eq 1
      - name: Commit reviewed remediation and clean temporary QA files
        shell: bash
        run: |
          rm .github/workflows/m13-temp-ci.yml
          rm scripts/qa/m13-remediate-review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remediate M13 Codex review findings"
          git push origin HEAD:milestone-13-runtime-slice-a
