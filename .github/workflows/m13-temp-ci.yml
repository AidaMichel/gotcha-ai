name: M13 review remediation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Codex remediation
        run: python scripts/qa/m13-remediate-review.py
      - name: Complete stack-safe remediation and proof fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("src/contract-protection-proposal.js")
          source = runtime.read_text()
          marker = "function completeExperimentAuthority(experiment) {"
          serializer = '''function stringifyWireValue(root) {
            let encoded = "";
            const frames = new ArrayConstructor();
            append(frames, makeRecord([
              ["value", root],
              ["entered", false],
              ["array", false],
              ["descriptors", null],
              ["keys", null],
              ["index", 0],
              ["length", 0]
            ]));

            while (frames.length > 0) {
              const frame = frames[frames.length - 1];
              const value = frame.value;

              if (frame.entered !== true) {
                if (
                  value === null ||
                  typeof value === "string" ||
                  typeof value === "boolean" ||
                  typeof value === "number"
                ) {
                  if (typeof value === "number" && !isWireNumber(value)) {
                    throw boundaryError();
                  }
                  const primitive = jsonStringify(value);
                  if (typeof primitive !== "string") throw boundaryError();
                  encoded += primitive;
                  frames.length -= 1;
                  continue;
                }

                if (typeof value !== "object" || isProxy(value) === true) {
                  throw boundaryError();
                }

                if (arrayIsArray(value) === true) {
                  if (!exactArray(value)) throw boundaryError();
                  frame.entered = true;
                  frame.array = true;
                  frame.descriptors = getOwnPropertyDescriptors(value);
                  frame.length = frame.descriptors.length.value;
                  encoded += "[";
                  if (frame.length === 0) {
                    encoded += "]";
                    frames.length -= 1;
                  }
                  continue;
                }

                if (
                  hasForbiddenBrand(value) ||
                  getPrototypeOf(value) !== objectPrototype ||
                  isExtensible(value) !== true
                ) {
                  throw boundaryError();
                }

                const descriptors = getOwnPropertyDescriptors(value);
                const keys = ownKeys(descriptors);
                for (let index = 0; index < keys.length; index += 1) {
                  if (
                    typeof keys[index] !== "string" ||
                    !ordinaryDescriptor(descriptors[keys[index]])
                  ) {
                    throw boundaryError();
                  }
                }
                frame.entered = true;
                frame.descriptors = descriptors;
                frame.keys = keys;
                frame.length = keys.length;
                encoded += "{";
                if (frame.length === 0) {
                  encoded += "}";
                  frames.length -= 1;
                }
                continue;
              }

              if (frame.index >= frame.length) {
                encoded += frame.array === true ? "]" : "}";
                frames.length -= 1;
                continue;
              }

              if (frame.index > 0) encoded += ",";

              let child;
              if (frame.array === true) {
                const key = stringConstructor(frame.index);
                child = frame.descriptors[key].value;
              } else {
                const key = frame.keys[frame.index];
                const encodedKey = jsonStringify(key);
                if (typeof encodedKey !== "string") throw boundaryError();
                encoded += encodedKey + ":";
                child = frame.descriptors[key].value;
              }
              frame.index += 1;
              append(frames, makeRecord([
                ["value", child],
                ["entered", false],
                ["array", false],
                ["descriptors", null],
                ["keys", null],
                ["index", 0],
                ["length", 0]
              ]));
            }

            return encoded;
          }

          '''
          if marker not in source:
              raise SystemExit("completeExperimentAuthority marker missing")
          source = source.replace(marker, serializer + marker, 1)
          old_probe = 'const encoded = jsonStringify(makeRecord([["experiment", experiment]]));'
          new_probe = 'const encoded = stringifyWireValue(makeRecord([["experiment", experiment]]));'
          if old_probe not in source:
              raise SystemExit("experiment JSON probe missing")
          source = source.replace(old_probe, new_probe, 1)
          runtime.write_text(source)

          path = Path("test/m13-review-remediation.test.js")
          text = path.read_text()
          text = text.replace(
              "async function makeExperiment() {",
              "async function makeExperiment(mutatedOutput = { time: \"4 PM\" }) {",
              1,
          )
          text = text.replace(
              "          mutatedOutput: { time: \"4 PM\" },",
              "          mutatedOutput,",
              1,
          )
          text = text.replace(
              "  const experiment = await makeExperiment();\n  experiment.case.input = deepWire(12000);",
              "  const experiment = await makeExperiment(deepWire(12000));",
              1,
          )
          text = text.replace(
              "      let value = request.case.input;",
              "      let value = request.attack.output;",
              1,
          )
          text = text.replace(
              "    Promise.prototype.then = originalThen;\n    let generatorCalls = 0;",
              "    Promise.prototype.then = originalThen;\n    poisonedCalls = 0;\n    let generatorCalls = 0;",
              1,
          )
          path.write_text(text)
          PY
      - name: Syntax check
        run: |
          node --check src/contract-protection-proposal.js
          node --check test/m13-review-remediation.test.js
      - name: Focused M13 proof
        run: node --test test/contract-protection-proposal.test.js test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/package-contract-protection-proposal.test.js
      - name: Full-suite comparison proof
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/m13-full-suite.log
          status=${PIPESTATUS[0]}
          set -e
          python -c 'import re; from pathlib import Path; text=Path("/tmp/m13-full-suite.log").read_text(); failures=re.findall(r"^not ok \d+ - (.+)$", text, flags=re.MULTILINE); expected=["cloneAiData rejects prototype-tampered hidden-slot runtime objects","Headers and FormData brands remain rejected when own data is added"]; assert failures == expected, failures; assert "# fail 2" in text'
          test "$status" -eq 1
      - name: Commit reviewed remediation and clean temporary QA files
        shell: bash
        run: |
          rm .github/workflows/m13-temp-ci.yml
          rm scripts/qa/m13-remediate-review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remediate M13 Codex review findings"
          git push origin HEAD:milestone-13-runtime-slice-a
