name: M13 independent lazy primordial audit

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-independent-lazy-primordial-audit.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_HEAD: cf997fe3d846a8f9b6db3c999df75b2685afc2a7

jobs:
  lazy_primordial_poison:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.20.2", "22.0.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDIT_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Post-load mutable primordials never become lazy authority
        run: |
          node - <<'NODE'
          'use strict';
          const api = require('./src');
          const originalGOPD = Object.getOwnPropertyDescriptor;
          const originalGOPDS = Object.getOwnPropertyDescriptors;
          const originalGetProto = Object.getPrototypeOf;
          const originalReflectApply = Reflect.apply;
          let calls = 0;
          function poison(name, original) {
            return function (...args) {
              calls += 1;
              return original(...args);
            };
          }
          Object.getOwnPropertyDescriptor = poison('gopd', originalGOPD);
          Object.getOwnPropertyDescriptors = poison('gopds', originalGOPDS);
          Object.getPrototypeOf = poison('getproto', originalGetProto);
          Reflect.apply = function (...args) {
            calls += 1;
            return originalReflectApply(...args);
          };
          let accessError = null;
          try {
            void api.runContractAttacks;
            void api.createStructuredProviderAdapter;
          } catch (error) {
            accessError = error;
          }
          const accessCalls = calls;
          Object.getOwnPropertyDescriptor = originalGOPD;
          Object.getOwnPropertyDescriptors = originalGOPDS;
          Object.getPrototypeOf = originalGetProto;
          Reflect.apply = originalReflectApply;
          console.log(JSON.stringify({ node: process.version, accessCalls, accessError: accessError && accessError.message }));
          if (accessCalls !== 0) process.exit(91);
          NODE
