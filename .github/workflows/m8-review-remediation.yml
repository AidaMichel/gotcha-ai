name: M8 Codex P1 remediation gate

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: write

jobs:
  remediate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply Codex P1 remediation
        run: python scripts/qa/m8-remediate-review-p1.py

      - name: Syntax and focused proof on Node 20
        run: |
          node --check src/ai-data-core.js
          node --check test/m8-runtime-brand-authority.test.js
          node --test test/m8-runtime-brand-authority.test.js test/m8-codex-round3.test.js test/m8-codex-remediation.test.js

      - name: Full suite on Node 20
        run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax and focused proof on Node 22
        run: |
          node --check src/ai-data-core.js
          node --check test/m8-runtime-brand-authority.test.js
          node --test test/m8-runtime-brand-authority.test.js test/m8-codex-round3.test.js test/m8-codex-remediation.test.js

      - name: Full suite on Node 22
        run: npm test

      - name: Diff hygiene
        run: git diff --check

      - name: Commit proven remediation and remove temporary QA harness
        shell: bash
        run: |
          rm .github/workflows/m8-review-remediation.yml
          rm scripts/qa/m8-remediate-review-p1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close M8 runtime-brand authority gaps"
          git push origin HEAD:fix/m8-baseline-runtime-brands
