name: M11 Slice A Hardening
on:
  push:
    branches:
      - milestone-11-provider-adapters
permissions:
  contents: write
jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply hardening patch
        run: |
          python .github/m11-hardening.py
          python .github/m11-test-adjust.py
      - name: Syntax and focused tests
        run: |
          node --check src/provider-adapter.js
          node --check src/ai-data-core.js
          node --test test/provider-adapter.test.js
          node --test test/package-contract-remediation.test.js
      - name: Full-suite regression comparison
        run: |
          git worktree add /tmp/gotcha-main origin/main
          (cd /tmp/gotcha-main && npm install --ignore-scripts >/dev/null && node --test test/m8-codex-remediation.test.js test/m8-codex-round3.test.js > /tmp/main.log 2>&1 || true)
          npm test > /tmp/branch.log 2>&1 || true
          python - <<'PY'
          import re
          from pathlib import Path
          def names(path):
              out=[]
              for line in Path(path).read_text().splitlines():
                  match=re.search(r'not ok \d+ - (.+)$', line)
                  if match: out.append(match.group(1))
              return sorted(set(out))
          baseline=names('/tmp/main.log')
          branch=names('/tmp/branch.log')
          print('baseline failures:', baseline)
          print('branch failures:', branch)
          if branch != baseline:
              raise SystemExit('branch failure set differs from untouched main baseline')
          PY
      - run: git diff --check origin/main...HEAD
      - name: Persist hardening and remove temporary validation files
        run: |
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          rm .github/workflows/m11-slice-a-hardening.yml .github/m11-hardening.py .github/m11-test-adjust.py
          git add src/provider-adapter.js src/ai-data-core.js test/provider-adapter.test.js test/package-contract-remediation.test.js .github/workflows/m11-slice-a-hardening.yml .github/m11-hardening.py .github/m11-test-adjust.py
          git commit -m "fix: harden M11 provider adapter boundary"
          git push origin HEAD:milestone-11-provider-adapters
