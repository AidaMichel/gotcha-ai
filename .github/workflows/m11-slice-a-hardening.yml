name: M11 Slice A Hardening
on:
  push:
    branches:
      - milestone-11-provider-adapters
permissions:
  contents: write
jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply exact Slice A hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('src/provider-adapter.js')
          text = adapter.read_text()

          schema_marker = 'const QUALITY_CONTRACT_SCHEMA = Object.freeze({'
          schema_index = text.index(schema_marker)
          header = r'''"use strict";

const { types: utilTypes } = require("node:util");
const {
  isUnsupportedRuntimeObject
} = require("./ai-data-core");

const PromiseConstructor = Promise;
const PromisePrototype = Promise.prototype;
const TypeErrorConstructor = TypeError;
const ArrayConstructor = Array;
const WeakSetConstructor = WeakSet;
const promiseThen = Promise.prototype.then;
const promiseSpecies = Symbol.species;
const objectPrototype = Object.prototype;
const arrayPrototype = Array.prototype;
const getPrototypeOf = Object.getPrototypeOf;
const getOwnPropertyDescriptors = Object.getOwnPropertyDescriptors;
const getOwnPropertyDescriptor = Object.getOwnPropertyDescriptor;
const ownKeys = Reflect.ownKeys;
const reflectApply = Reflect.apply;
const defineProperty = Object.defineProperty;
const deleteProperty = Reflect.deleteProperty;
const objectCreate = Object.create;
const objectKeys = Object.keys;
const isExtensible = Object.isExtensible;
const arrayIsArray = Array.isArray;
const arrayPop = Array.prototype.pop;
const numberIsFinite = Number.isFinite;
const numberIsInteger = Number.isInteger;
const stringTrim = String.prototype.trim;
const stringConstructor = String;
const functionHasInstance = Function.prototype[Symbol.hasInstance];
const isProxy = utilTypes.isProxy;
const isPromise = utilTypes.isPromise;
const weakSetHas = WeakSet.prototype.has;
const weakSetAdd = WeakSet.prototype.add;
const weakSetDelete = WeakSet.prototype.delete;

const safePromiseConstructor = objectCreate(null);
defineProperty(safePromiseConstructor, promiseSpecies, {
  value: PromiseConstructor,
  writable: false,
  enumerable: false,
  configurable: false
});
Object.freeze(safePromiseConstructor);

'''
          text = header + text[schema_index:]

          start = text.index('function boundaryError(message) {')
          end = text.index('function exactDataDescriptors', start)
          boundary_block = r'''function boundaryError(message) {
  return new TypeErrorConstructor(message);
}

function isLocalTypeError(error) {
  return (
    error !== null &&
    (typeof error === "object" || typeof error === "function") &&
    reflectApply(functionHasInstance, TypeErrorConstructor, [error])
  );
}

function isForbiddenRuntimeObject(value) {
  return isUnsupportedRuntimeObject(value);
}

function appendInternal(array, value) {
  defineProperty(array, stringConstructor(array.length), {
    value,
    writable: true,
    enumerable: true,
    configurable: true
  });
}

'''
          text = text[:start] + boundary_block + text[end:]
          text = text.replace('arrayIsArray(value) || utilTypes.isProxy(value)', 'arrayIsArray(value) || isProxy(value)')
          text = text.replace('if (isForbiddenBrand(value, false)) {', 'if (isForbiddenRuntimeObject(value)) {')

          start = text.index('function projectInvocationData')
          end = text.index('function cloneSchema', start)
          traversal_block = r'''function assertDataDescriptor(descriptor, label) {
  if (
    descriptor === undefined ||
    !("value" in descriptor) ||
    "get" in descriptor ||
    "set" in descriptor ||
    descriptor.enumerable !== true
  ) {
    throw boundaryError(`${label} must use enumerable data properties only.`);
  }
}

function captureArrayEntries(value, label, descriptors) {
  const lengthDescriptor = descriptors.length;
  if (
    lengthDescriptor === undefined ||
    !("value" in lengthDescriptor) ||
    "get" in lengthDescriptor ||
    "set" in lengthDescriptor ||
    typeof lengthDescriptor.value !== "number" ||
    !numberIsInteger(lengthDescriptor.value) ||
    lengthDescriptor.value < 0
  ) {
    throw boundaryError(`${label} has an invalid array length.`);
  }

  const length = lengthDescriptor.value;
  const entries = new ArrayConstructor();
  for (const key of ownKeys(descriptors)) {
    if (key === "length") continue;
    if (typeof key !== "string") {
      throw boundaryError(`${label} must not contain symbol keys.`);
    }
    const index = Number(key);
    if (
      !numberIsInteger(index) ||
      index < 0 ||
      index >= length ||
      stringConstructor(index) !== key
    ) {
      throw boundaryError(`${label} has an invalid array property.`);
    }
    assertDataDescriptor(descriptors[key], `${label}[${index}]`);
  }

  for (let index = 0; index < length; index += 1) {
    const key = stringConstructor(index);
    const descriptor = descriptors[key];
    if (descriptor === undefined) {
      throw boundaryError(`${label} must not be sparse.`);
    }
    assertDataDescriptor(descriptor, `${label}[${index}]`);
    appendInternal(entries, {
      key,
      value: descriptor.value,
      label: `${label}[${index}]`
    });
  }

  return { entries, length };
}

function captureRecordEntries(value, label, descriptors) {
  const entries = new ArrayConstructor();
  for (const key of ownKeys(descriptors)) {
    if (typeof key !== "string") {
      throw boundaryError(`${label} must not contain symbol keys.`);
    }
    const descriptor = descriptors[key];
    assertDataDescriptor(descriptor, `${label}.${key}`);
    appendInternal(entries, {
      key,
      value: descriptor.value,
      label: `${label}.${key}`
    });
  }
  return entries;
}

function prepareInvocationNode(value, label, active) {
  if (value === null || typeof value !== "object") {
    assertSafePrimitive(value, label);
    return { value, frame: null };
  }
  if (isProxy(value) || isForbiddenRuntimeObject(value)) {
    throw boundaryError(`${label} contains unsupported runtime data.`);
  }
  if (reflectApply(weakSetHas, active, [value])) {
    throw boundaryError(`${label} must not contain cycles.`);
  }

  const descriptors = getOwnPropertyDescriptors(value);
  const isArray = arrayIsArray(value);
  let entries;
  let target;
  if (isArray) {
    const captured = captureArrayEntries(value, label, descriptors);
    entries = captured.entries;
    target = new ArrayConstructor(captured.length);
  } else {
    entries = captureRecordEntries(value, label, descriptors);
    target = objectCreate(null);
  }

  reflectApply(weakSetAdd, active, [value]);
  return {
    value: target,
    frame: {
      source: value,
      target,
      entries,
      index: 0,
      active
    }
  };
}

function projectInvocationData(value, label) {
  const active = new WeakSetConstructor();
  const root = prepareInvocationNode(value, label, active);
  if (root.frame === null) return root.value;

  const stack = new ArrayConstructor();
  appendInternal(stack, root.frame);
  while (stack.length > 0) {
    const frame = stack[stack.length - 1];
    if (frame.index >= frame.entries.length) {
      reflectApply(weakSetDelete, frame.active, [frame.source]);
      reflectApply(arrayPop, stack, []);
      continue;
    }

    const entry = frame.entries[frame.index];
    frame.index += 1;
    const child = prepareInvocationNode(entry.value, entry.label, frame.active);
    defineProperty(frame.target, entry.key, {
      value: child.value,
      writable: true,
      enumerable: true,
      configurable: true
    });
    if (child.frame !== null) appendInternal(stack, child.frame);
  }
  return root.value;
}

function prepareProviderNode(value, label, seen, root) {
  if (value === null || typeof value !== "object") {
    if (root) {
      throw boundaryError("provider response output root must be a record.");
    }
    assertSafePrimitive(value, label);
    return { value, frame: null };
  }
  if (isProxy(value) || isForbiddenRuntimeObject(value)) {
    throw boundaryError(`${label} contains unsupported runtime data.`);
  }
  if (reflectApply(weakSetHas, seen, [value])) {
    throw boundaryError(`${label} must not contain cycles or repeated mutable identity.`);
  }
  reflectApply(weakSetAdd, seen, [value]);

  const isArray = arrayIsArray(value);
  const prototype = getPrototypeOf(value);
  const descriptors = getOwnPropertyDescriptors(value);
  let entries;
  let target;
  if (isArray) {
    if (root) {
      throw boundaryError("provider response output root must be a record.");
    }
    if (prototype !== arrayPrototype) {
      throw boundaryError(`${label} must be a local array.`);
    }
    const captured = captureArrayEntries(value, label, descriptors);
    entries = captured.entries;
    target = new ArrayConstructor(captured.length);
  } else {
    if (prototype !== objectPrototype && prototype !== null) {
      throw boundaryError(`${label} must be a local plain record.`);
    }
    entries = captureRecordEntries(value, label, descriptors);
    target = objectCreate(null);
  }

  return {
    value: target,
    frame: {
      target,
      entries,
      index: 0,
      seen
    }
  };
}

function detachProviderData(value, label, root) {
  const seen = new WeakSetConstructor();
  const prepared = prepareProviderNode(value, label, seen, root);
  if (prepared.frame === null) return prepared.value;

  const stack = new ArrayConstructor();
  appendInternal(stack, prepared.frame);
  while (stack.length > 0) {
    const frame = stack[stack.length - 1];
    if (frame.index >= frame.entries.length) {
      reflectApply(arrayPop, stack, []);
      continue;
    }

    const entry = frame.entries[frame.index];
    frame.index += 1;
    const child = prepareProviderNode(entry.value, entry.label, frame.seen, false);
    defineProperty(frame.target, entry.key, {
      value: child.value,
      writable: true,
      enumerable: true,
      configurable: true
    });
    if (child.frame !== null) appendInternal(stack, child.frame);
  }
  return prepared.value;
}

'''
          text = text[:start] + traversal_block + text[end:]

          text = text.replace('if (Array.isArray(value)) return value.map(cloneSchema);', 'if (arrayIsArray(value)) return value.map(cloneSchema);')
          text = text.replace('for (const key of Object.keys(value)) out[key] = cloneSchema(value[key]);', 'for (const key of objectKeys(value)) defineProperty(out, key, { value: cloneSchema(value[key]), writable: true, enumerable: true, configurable: true });')

          start = text.index('function assertUniqueProviderIdentity')
          end = text.index('function observeAcceptedPromise', start)
          validate_block = r'''function validateProviderResponse(response) {
  const descriptors = exactDataDescriptors(
    response,
    ["version", "kind", "output"],
    "provider response",
    true
  );
  if (descriptors.version.value !== 1 || descriptors.kind.value !== "gotcha-provider-response") {
    throw boundaryError("provider response has invalid version or kind.");
  }
  return detachProviderData(
    descriptors.output.value,
    "provider response.output",
    true
  );
}

'''
          text = text[:start] + validate_block + text[end:]

          text = text.replace('typeof transport !== "function" || utilTypes.isProxy(transport)', 'typeof transport !== "function" || isProxy(transport)')
          text = text.replace('projectInvocationData(requestDescriptors.task.value, "generator request.task", new Set())', 'projectInvocationData(requestDescriptors.task.value, "generator request.task")')
          text = text.replace('projectInvocationData(requestDescriptors.examples.value, "generator request.examples", new Set())', 'projectInvocationData(requestDescriptors.examples.value, "generator request.examples")')
          text = text.replace('projectInvocationData(requestDescriptors.contract.value, "generator request.contract", new Set())', 'projectInvocationData(requestDescriptors.contract.value, "generator request.contract")')
          text = text.replace('projectInvocationData(requestDescriptors.input.value, "generator request.input", new Set())', 'projectInvocationData(requestDescriptors.input.value, "generator request.input")')
          text = text.replace('projectInvocationData(requestDescriptors.expectedOutput.value, "generator request.expectedOutput", new Set())', 'projectInvocationData(requestDescriptors.expectedOutput.value, "generator request.expectedOutput")')
          text = text.replace('error instanceof TypeError ? error : boundaryError("generator request capture failed.")', 'isLocalTypeError(error) ? error : boundaryError("generator request capture failed.")')
          text = text.replace('error instanceof TypeError ? error : boundaryError("provider response validation failed.")', 'isLocalTypeError(error) ? error : boundaryError("provider response validation failed.")')
          text = text.replace('!utilTypes.isProxy(transportResult) && utilTypes.isPromise(transportResult)', '!isProxy(transportResult) && reflectApply(isPromise, utilTypes, [transportResult])')
          text = text.replace('error instanceof TypeError ? error : boundaryError("transport Promise cannot be safely observed.")', 'isLocalTypeError(error) ? error : boundaryError("transport Promise cannot be safely observed.")')

          if 'utilTypes.isProxy(' in text or 'utilTypes.isPromise(' in text or 'new Set(' in text:
            raise SystemExit('dynamic util/Set authority remains in provider adapter')

          adapter.write_text(text)

          core = Path('src/ai-data-core.js')
          core_text = core.read_text()
          old_exports = '''module.exports = {\n  cloneAiData,\n  freezeAiData,\n  snapshotAiData\n};'''
          new_exports = '''module.exports = {\n  cloneAiData,\n  freezeAiData,\n  snapshotAiData,\n  isUnsupportedRuntimeObject\n};'''
          if old_exports not in core_text:
            raise SystemExit('ai-data-core export anchor missing')
          core.write_text(core_text.replace(old_exports, new_exports, 1))

          tests = Path('test/provider-adapter.test.js')
          test_text = tests.read_text()
          marker = 'test("M11 hardening preserves own data and captured authority"'
          if marker not in test_text:
            test_text += r'''

test("M11 hardening preserves own data and captured authority", async () => {
  const source = JSON.parse('{"__proto__":{"value":1}}');
  const providerOutput = JSON.parse('{"version":1,"task":"x","rules":[],"__proto__":{"value":2}}');
  let seen;
  const generator = createStructuredProviderAdapter({
    model: "x",
    mode: "contract-attacks",
    transport(request) {
      seen = request;
      return response(providerOutput);
    }
  });

  const returned = await generator({
    contract: { task: "x" },
    input: source,
    expectedOutput: { ok: true },
    instructions: "i"
  });

  assert.equal(Object.getPrototypeOf(seen.input.input), null);
  assert.equal(Object.hasOwn(seen.input.input, "__proto__"), true);
  assert.equal(seen.input.input.__proto__.value, 1);
  assert.equal(Object.getPrototypeOf(returned), null);
  assert.equal(Object.hasOwn(returned, "__proto__"), true);
  assert.equal(returned.__proto__.value, 2);
});

test("array projection defines own elements without inherited setters", async () => {
  const values = Array.from({ length: 138 }, (_, index) => index);
  const providerOutput = {
    version: 1,
    task: "x",
    rules: [],
    values
  };
  const previous = Object.getOwnPropertyDescriptor(Array.prototype, "137");
  let setterCalls = 0;
  Object.defineProperty(Array.prototype, "137", {
    configurable: true,
    set() {
      setterCalls += 1;
    }
  });
  try {
    const generator = createStructuredProviderAdapter({
      model: "x",
      mode: "quality-contract",
      transport: () => response(providerOutput)
    });
    const returned = await generator({ task: "x", examples: values, instructions: "i" });
    assert.equal(returned.values[137], 137);
    assert.equal(setterCalls, 0);
  } finally {
    if (previous === undefined) delete Array.prototype[137];
    else Object.defineProperty(Array.prototype, "137", previous);
  }
});

test("record length participates in provider identity uniqueness", async () => {
  const shared = { value: 1 };
  const generator = createStructuredProviderAdapter({
    model: "x",
    mode: "quality-contract",
    transport: () => response({
      version: 1,
      task: "x",
      rules: [],
      meta: { length: shared, other: shared }
    })
  });
  await assert.rejects(generator({ task: "x", examples: [], instructions: "i" }), TypeError);
});

test("projection and detachment remain stack-safe for deep valid AI data", async () => {
  function deepRecord(depth) {
    const root = {};
    let cursor = root;
    for (let index = 0; index < depth; index += 1) {
      const next = {};
      cursor.next = next;
      cursor = next;
    }
    cursor.value = "end";
    return root;
  }

  const invocationDeep = deepRecord(6000);
  const outputDeep = deepRecord(6000);
  let seen;
  const generator = createStructuredProviderAdapter({
    model: "x",
    mode: "quality-contract",
    transport(request) {
      seen = request;
      return response({ version: 1, task: "x", rules: [], deep: outputDeep });
    }
  });
  const returned = await generator({ task: "x", examples: [invocationDeep], instructions: "i" });
  assert.ok(seen.input.examples[0]);
  let cursor = returned.deep;
  for (let index = 0; index < 6000; index += 1) cursor = cursor.next;
  assert.equal(cursor.value, "end");
});

test("slot-backed runtime brands reject before transport", async () => {
  let calls = 0;
  const generator = createStructuredProviderAdapter({
    model: "x",
    mode: "quality-contract",
    transport() {
      calls += 1;
      return response({ version: 1, task: "x", rules: [] });
    }
  });

  const target = {};
  await assert.rejects(
    generator({ task: "x", examples: [new WeakRef(target)], instructions: "i" }),
    TypeError
  );
  if (typeof FinalizationRegistry === "function") {
    const registry = new FinalizationRegistry(() => {});
    await assert.rejects(
      generator({ task: "x", examples: [registry], instructions: "i" }),
      TypeError
    );
  }
  assert.equal(calls, 0);
});

test("captured Promise brand probe survives util.types mutation", async () => {
  const utilTypes = require("node:util").types;
  const descriptor = Object.getOwnPropertyDescriptor(utilTypes, "isPromise");
  const reason = { code: "captured-promise" };
  Object.defineProperty(utilTypes, "isPromise", {
    ...descriptor,
    value: () => false
  });
  try {
    const generator = createStructuredProviderAdapter({
      model: "x",
      mode: "quality-contract",
      transport: () => Promise.reject(reason)
    });
    await assert.rejects(
      generator({ task: "x", examples: [], instructions: "i" }),
      (error) => error === reason
    );
  } finally {
    Object.defineProperty(utilTypes, "isPromise", descriptor);
  }
});

test("provider identity is independent of ambient Set replacement", async () => {
  const OriginalSet = global.Set;
  const shared = { value: 1 };
  global.Set = class BrokenSet {
    has() { return false; }
    add() { return this; }
  };
  try {
    const generator = createStructuredProviderAdapter({
      model: "x",
      mode: "quality-contract",
      transport: () => response({
        version: 1,
        task: "x",
        rules: [],
        meta: { first: shared, second: shared }
      })
    });
    await assert.rejects(generator({ task: "x", examples: [], instructions: "i" }), TypeError);
  } finally {
    global.Set = OriginalSet;
  }
});

test("boundary failures use the captured local TypeError constructor", async () => {
  const OriginalTypeError = global.TypeError;
  let replacementCalls = 0;
  global.TypeError = function ReplacementTypeError() {
    replacementCalls += 1;
    return new Error("replacement executed");
  };
  try {
    const generator = createStructuredProviderAdapter({
      model: "x",
      mode: "quality-contract",
      transport: () => ({ version: 1, kind: "wrong", output: {} })
    });
    await assert.rejects(
      generator({ task: "x", examples: [], instructions: "i" }),
      (error) => error instanceof OriginalTypeError
    );
    assert.equal(replacementCalls, 0);
  } finally {
    global.TypeError = OriginalTypeError;
  }
});
'''
          tests.write_text(test_text)

          package_test = Path('test/package-contract-remediation.test.js')
