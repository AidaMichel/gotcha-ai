    constructorDescriptor === undefined &&
    isExtensible(promise) !== true
  ) {
    if (!prototypeConstructorIsTrusted(promise)) {
      throw boundaryError();
    }
    reflectApply(trustedPromiseThen, promise, [onFulfilled, onRejected]);
    return;
