          new = '''function constructorDescriptorIsTrusted(descriptor) {
  return (
    descriptor !== undefined &&
    !("get" in descriptor) &&
    !("set" in descriptor) &&
    descriptor.value === trustedPromiseConstructor
  );
}

function prototypeConstructorIsTrusted(promise) {
