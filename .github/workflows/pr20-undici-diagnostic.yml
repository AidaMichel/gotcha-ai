name: PR20 remediation proof

on:
  push:
    branches:
      - fix/pr20-late-m8-undici

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded remediation
        run: python3 .github/scripts/pr20_remediate.py
      - name: Diagnose retained authority
        run: |
          GOTCHA_PR20_DIAGNOSTIC=1 node -e "require('./src/ai-data-core')"
          node <<'NODE'
          const p = require('./src/package-authority');
          const r = require('./src/runtime-authority');
          const C = globalThis.FormData;
          const cd = Object.getOwnPropertyDescriptor(C.prototype, 'constructor');
          const md = Object.getOwnPropertyDescriptor(C.prototype, 'get');
          const nativeSource = process.binding('natives')['internal/deps/undici/undici'];
          const csrc = Function.prototype.toString.call(C);
          const msrc = Function.prototype.toString.call(md.value);
          console.log(JSON.stringify({
            packageAvailable: p.available,
            packageSetPrototypeOf: typeof p.ObjectSetPrototypeOf,
            runtimeSetPrototypeOf: typeof r.objectSetPrototypeOf,
            consumerAvailable: r.consumerPrimordialsAvailable,
            formData: {
              name: C.name,
              length: C.length,
              constructorDescriptorMatches: cd && cd.value === C,
              methodName: md && md.value && md.value.name,
              methodLength: md && md.value && md.value.length,
              constructorSourceInBundle: typeof nativeSource === 'string' && nativeSource.includes(csrc),
              methodSourceInBundle: typeof nativeSource === 'string' && nativeSource.includes(msrc),
              constructorSource: csrc,
              methodSource: msrc
            }
          }));
          NODE
      - name: Focused proof
        run: |
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/ai-data-core.js
          node --check test/m8-pr20-late-undici.test.js
          node --test test/m8-pr20-late-undici.test.js test/m8-runtime-brand-authority.test.js test/m8-codex-round10.test.js
          git diff --check
      - name: Full repository proof
        run: npm test
      - name: Commit only after proof
        run: |
          if git diff --quiet -- src/package-authority.js src/runtime-authority.js src/ai-data-core.js test/m8-pr20-late-undici.test.js; then
            echo "Production remediation already committed."
            exit 0
          fi
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git add src/package-authority.js src/runtime-authority.js src/ai-data-core.js test/m8-pr20-late-undici.test.js
          git commit -m "fix: close late PR20 Undici brand bypasses"
          git push origin HEAD:fix/pr20-late-m8-undici
