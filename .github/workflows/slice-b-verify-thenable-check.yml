name: Slice B verification thenable validation
on:
  push:
    branches: [milestone-10-remediation-slice-b]
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/qa/patch-slice-b-verify-thenable.py
      - run: python scripts/qa/patch-slice-b-verify-schedule.py
      - run: python scripts/qa/patch-m8-async-return-thenable.py
      - run: node --check src/contract-attacks-core.js
      - run: node --check src/contract-remediation.js
      - run: node --check src/index.js
      - run: node --test test/contract-remediation-verify.test.js test/contract-remediation-confirm.test.js test/contract-remediation-draft.test.js test/contract-remediation-review-regressions.test.js
      - run: npm test
      - run: git diff --check
      - name: Persist validated source
        run: |
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git add src/contract-attacks-core.js src/contract-remediation.js test/contract-remediation-verify.test.js
          git commit -m "fix: shield verification internal Promise boundaries"
          git push
