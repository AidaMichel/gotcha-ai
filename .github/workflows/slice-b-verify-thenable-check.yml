name: Slice B verification thenable validation
on:
  push:
    branches: [milestone-10-remediation-slice-b]
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/qa/patch-slice-b-verify-thenable.py
      - run: python scripts/qa/patch-slice-b-verify-schedule.py
      - run: python scripts/qa/patch-slice-b-verify-generator-thenable.py
      - run: python scripts/qa/patch-slice-b-verify-generator-sync.py
      - run: python scripts/qa/patch-m8-async-return-thenable.py
      - run: python scripts/qa/diagnose-slice-b-verify-error.py
      - run: node --check src/contract-attacks-core.js
      - run: node --check src/contract-remediation.js
      - run: node --test test/contract-remediation-verify.test.js
