name: PR20 Undici prototype restoration diagnostic

on:
  push:
    branches:
      - fix/pr20-late-m8-undici

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test temporary authenticated prototype restoration
        run: |
          node <<'NODE'
          "use strict";
          const makers = {
            Headers: () => new Headers(),
            FormData: () => new FormData(),
            Request: () => new Request("https://example.com/"),
            Response: () => new Response("ok")
          };
          const probes = {
            Headers: ["method", "get", ["x"]],
            FormData: ["method", "get", ["x"]],
            Request: ["getter", "url", []],
            Response: ["getter", "status", []]
          };
          for (const [name, make] of Object.entries(makers)) {
            const C = globalThis[name];
            if (typeof C !== "function") continue;
            const [kind, key, args] = probes[name];
            const d = Object.getOwnPropertyDescriptor(C.prototype, key);
            const fn = kind === "getter" ? d.get : d.value;
            function testReceiver(receiver) {
              const original = Object.getPrototypeOf(receiver);
              Object.setPrototypeOf(receiver, C.prototype);
              let result;
              try {
                const output = Reflect.apply(fn, receiver, args);
                result = { ok: true, type: typeof output };
              } catch (error) {
                result = { ok: false, name: error && error.name, message: error && error.message };
              } finally {
                Object.setPrototypeOf(receiver, original);
              }
              return {
                result,
                restored: Object.getPrototypeOf(receiver) === original
              };
            }
            const genuine = make();
            Object.setPrototypeOf(genuine, Object.prototype);
            const plain = {};
            console.log(JSON.stringify({
              node: process.version,
              name,
              genuine: testReceiver(genuine),
              plain: testReceiver(plain)
            }));
          }
          NODE
