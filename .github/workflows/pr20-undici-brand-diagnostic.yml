name: PR20 Undici brand diagnostic

on:
  push:
    branches:
      - fix/pr20-late-m8-undici

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect rewritten brands
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const make = {
            Headers: () => new Headers(),
            FormData: () => new FormData(),
            Request: () => new Request("https://example.com/"),
            Response: () => new Response("ok")
          };
          const probes = {
            Headers: ["method", "get", ["x"]],
            FormData: ["method", "get", ["x"]],
            Request: ["getter", "url", []],
            Response: ["getter", "status", []]
          };
          for (const name of Object.keys(make)) {
            if (typeof globalThis[name] !== "function") continue;
            const C = globalThis[name];
            const value = make[name]();
            const keysBefore = Reflect.ownKeys(value);
            const symbolInfo = keysBefore
              .filter((k) => typeof k === "symbol")
              .map((k) => {
                const d = Object.getOwnPropertyDescriptor(value, k);
                return {
                  key: String(k),
                  enumerable: d && d.enumerable,
                  configurable: d && d.configurable,
                  writable: d && "writable" in d ? d.writable : null,
                  valueType: d && "value" in d ? typeof d.value : "accessor"
                };
              });
            const [kind, property, args] = probes[name];
            const d = Object.getOwnPropertyDescriptor(C.prototype, property);
            const callable = kind === "getter" ? d.get : d.value;
            const tryProbe = () => {
              try {
                const result = Reflect.apply(callable, value, args);
                return { ok: true, type: typeof result, value: typeof result === "object" ? "[object]" : String(result) };
              } catch (error) {
                return { ok: false, name: error && error.name, message: error && error.message };
              }
            };
            const beforeProbe = tryProbe();
            Object.setPrototypeOf(value, Object.prototype);
            const afterProbe = tryProbe();
            console.log(JSON.stringify({
              node: process.version,
              name,
              constructorLength: C.length,
              ownKeys: keysBefore.map(String),
              symbols: symbolInfo,
              beforeProbe,
              afterProbe
            }));
          }
          NODE
