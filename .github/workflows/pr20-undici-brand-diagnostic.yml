name: PR20 final cross-version proof

on:
  push:
    branches:
      - fix/pr20-late-m8-undici

jobs:
  prove:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cross-version focused proof
        run: |
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/ai-data-core.js
          node --check test/m8-pr20-late-undici.test.js
          node --test test/m8-pr20-late-undici.test.js test/m8-runtime-brand-authority.test.js
