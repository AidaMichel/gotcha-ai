name: M13 proxy surface diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compare util proxy authority surfaces
        shell: bash
        run: |
          node <<'NODE' > proxy-surface-${{ matrix.node }}.log 2>&1
          "use strict";
          const gopd = Object.getOwnPropertyDescriptor;
          const fts = Function.prototype.toString;
          const util = require("node:util");
          let types;
          try { types = require("node:util/types"); }
          catch (e) { types = null; }
          const a = util && util.types;
          const ad = a && gopd(a, "isProxy");
          const bd = types && gopd(types, "isProxy");
          console.log("node", process.version);
          console.log("same-types-object", a === types);
          console.log("same-isProxy", !!ad && !!bd && ad.value === bd.value);
          console.log("util.types desc", ad && {writable:ad.writable, enumerable:ad.enumerable, configurable:ad.configurable, type:typeof ad.value, source:typeof ad.value === "function" ? fts.call(ad.value) : null});
          console.log("util/types desc", bd && {writable:bd.writable, enumerable:bd.enumerable, configurable:bd.configurable, type:typeof bd.value, source:typeof bd.value === "function" ? fts.call(bd.value) : null});
          if (ad && bd) {
            const originalA = ad.value;
            const poison = new Proxy(originalA, {apply(){throw new Error("poison apply");}});
            Object.defineProperty(a, "isProxy", {...ad, value: poison});
            const ad2 = gopd(a, "isProxy");
            const bd2 = gopd(types, "isProxy");
            console.log("after-poison same-isProxy", ad2.value === bd2.value);
            console.log("after-poison util source", fts.call(ad2.value));
            console.log("after-poison standalone source", fts.call(bd2.value));
            Object.defineProperty(a, "isProxy", ad);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-surface-${{ matrix.node }}
          path: proxy-surface-${{ matrix.node }}.log
          retention-days: 1
