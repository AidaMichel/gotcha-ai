name: M13 Node22 runtime-authority diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diagnose-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Apply Round-8 candidate
        run: |
          python3 scripts/qa/m13-codex-round8.py
          python3 scripts/qa/m13-codex-round8-followup.py
          python3 scripts/qa/m13-codex-round8-followup2.py
          python3 scripts/qa/m13-codex-round8-followup3.py
          python3 scripts/qa/m13-codex-round8-followup4.py
          python3 scripts/qa/m13-codex-round8-followup5.py
          python3 scripts/qa/m13-codex-round8-followup6.py
      - name: Expose runtime-authority under node test
        shell: bash
        run: |
          cat > .round8-runtime-diag.test.js <<'NODE'
          "use strict";
          const test = require("node:test");
          const assert = require("node:assert/strict");
          test("diagnose runtime authority", () => {
            console.log("preloads", process.moduleLoadList.filter((x) => /NativeModule (inspector|v8|vm|util|util\/types|buffer)$/.test(x)));
            let authority;
            try {
              authority = require("./src/runtime-authority");
              console.log("authority-loaded", true);
              console.log("promiseAuthorityAvailable", authority.promiseAuthorityAvailable);
              console.log("plain", authority.isProxy({}));
              console.log("proxy", authority.isProxy(new Proxy({}, {})));
            } catch (error) {
              console.error("RUNTIME_AUTHORITY_ERROR", error && error.stack || error);
              throw error;
            }
            assert.ok(authority);
          });
          NODE
          node --test .round8-runtime-diag.test.js 2>&1 | tee round8-runtime-diag.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round8-runtime-diag
          path: round8-runtime-diag.log
          retention-days: 1
