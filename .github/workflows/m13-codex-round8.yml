name: M13 Codex round 8 Node22 diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diagnose-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Round-8 remediation
        run: |
          python3 scripts/qa/m13-codex-round8.py
          python3 scripts/qa/m13-codex-round8-followup.py
          python3 scripts/qa/m13-codex-round8-followup2.py

      - name: Syntax and diff hygiene
        run: |
          git diff --check
          node --check src/runtime-authority.js
          node --check src/index.js
          node --check src/provider-adapter-m13.js
          node --check test/m13-review-remediation.test.js
          node --check test/provider-adapter-m13.test.js
          node --check test/runtime-authority.test.js
          test -z "$(grep -nE 'getBuiltinModule|setFlagsFromString|node:v8|pristineObjectToString' src/runtime-authority.js || true)"
          test -z "$(grep -nE 'new Set|authorityRootModulePaths' src/index.js || true)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Capture Node 22 focused output
        shell: bash
        run: |
          set +e
          node --version > round8-node22-focused.log 2>&1
          node --test test/m13-review-remediation.test.js >> round8-node22-focused.log 2>&1
          status=$?
          printf '%s\n' "$status" > round8-node22-focused.status
          set -e
          exit 0

      - name: Capture Node 22 full-suite output
        shell: bash
        run: |
          set +e
          npm test > round8-node22-full.log 2>&1
          status=$?
          printf '%s\n' "$status" > round8-node22-full.status
          set -e
          exit 0

      - name: Upload Node 22 diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: m13-round8-node22-diagnostic
          path: |
            round8-node22-focused.log
            round8-node22-focused.status
            round8-node22-full.log
            round8-node22-full.status
          if-no-files-found: error
          retention-days: 1

      - name: Preserve diagnostic gate
        shell: bash
        run: |
          focused="$(cat round8-node22-focused.status)"
          full="$(cat round8-node22-full.status)"
          echo "focused=$focused full=$full"
          test "$focused" -eq 0
          test "$full" -eq 0
