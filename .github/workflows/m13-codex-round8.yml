name: M13 Codex round 8 proxy bootstrap diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diagnose-proxy-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Capture proxy bootstrap metadata
        shell: bash
        run: |
          node <<'NODE' > "proxy-bootstrap-${{ matrix.node }}.log" 2>&1
          "use strict";
          const gopd = Object.getOwnPropertyDescriptor;
          const fts = Function.prototype.toString;
          const util = require("node:util");
          const d = gopd(util.types, "isProxy");
          console.log("node", process.version);
          console.log("isProxy-source", typeof d.value === "function" ? fts.call(d.value) : null);
          console.log("moduleLoadList", JSON.stringify(process.moduleLoadList.filter((x) => /NativeModule (util\/types|buffer|v8|vm)$/.test(x))));
          const bindingDescriptor = gopd(process, "binding");
          console.log("process.binding-source", bindingDescriptor && typeof bindingDescriptor.value === "function" ? fts.call(bindingDescriptor.value) : null);
          const oldNoDeprecation = process.noDeprecation;
          process.noDeprecation = true;
          try {
            const v8Binding = bindingDescriptor.value.call(process, "v8");
            const setter = gopd(v8Binding, "setFlagsFromString");
            console.log("binding-v8", "ok", setter && typeof setter.value, setter && typeof setter.value === "function" ? fts.call(setter.value) : null);
          } catch (error) {
            console.log("binding-v8", "error", error && error.message);
          } finally {
            process.noDeprecation = oldNoDeprecation;
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-bootstrap-${{ matrix.node }}
          path: proxy-bootstrap-${{ matrix.node }}.log
          retention-days: 1
