name: M13 Codex round 8 Node22 binding diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diagnose-node22-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Capture Node 22 binding metadata
        shell: bash
        run: |
          node <<'NODE' > round8-node22-binding.log 2>&1
          "use strict";
          const gopd = Object.getOwnPropertyDescriptor;
          const gopn = Object.getOwnPropertyNames;
          const fts = Function.prototype.toString;
          const types = require("node:util/types");
          const publicDesc = gopd(types, "isProxy");
          console.log("node", process.version);
          console.log("public source", fts.call(publicDesc.value));
          for (const name of ["types", "util", "v8"]) {
            try {
              const binding = process.binding(name);
              console.log("binding", name, "keys", JSON.stringify(gopn(binding).sort()));
              const d = gopd(binding, "isProxy");
              console.log("binding", name, "isProxy", d ? JSON.stringify({
                enumerable:d.enumerable,
                configurable:d.configurable,
                writable:d.writable,
                type:typeof d.value,
                same:d.value === publicDesc.value,
                source:typeof d.value === "function" ? fts.call(d.value) : null
              }) : "missing");
            } catch (error) {
              console.log("binding", name, "error", error && error.message);
            }
          }
          NODE
      - name: Upload Node 22 binding artifact
        uses: actions/upload-artifact@v4
        with:
          name: m13-round8-node22-binding
          path: round8-node22-binding.log
          retention-days: 1
