name: M13 Codex round 8 final matrix

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Round-8 remediation
        run: |
          python3 scripts/qa/m13-codex-round8.py
          python3 scripts/qa/m13-codex-round8-followup.py
          python3 scripts/qa/m13-codex-round8-followup2.py
          python3 scripts/qa/m13-codex-round8-followup3.py
          python3 scripts/qa/m13-codex-round8-followup4.py
          python3 scripts/qa/m13-codex-round8-followup5.py
          python3 scripts/qa/m13-codex-round8-followup6.py
          python3 scripts/qa/m13-codex-round8-followup7.py

      - name: Syntax and diff hygiene
        run: |
          git diff --check
          node --check src/runtime-authority.js
          node --check src/index.js
          node --check src/provider-adapter-m13.js
          node --check test/m13-review-remediation.test.js
          node --check test/provider-adapter-m13.test.js
          node --check test/runtime-authority.test.js
          test -z "$(grep -nE 'getBuiltinModule|pristineObjectToString|node:v8|setFlagsFromString|%IsJSProxy' src/runtime-authority.js || true)"
          test -z "$(grep -nE 'new Set|authorityRootModulePaths|Object\.keys\(require\.cache\)' src/index.js || true)"

      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
      - name: Node 14 compatibility
        run: |
          node --check src/runtime-authority.js
          node --check src/index.js
          node --check src/provider-adapter-m13.js
          node -e "const api=require('./src'); if(typeof api.generateContractProtectionProposal!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: Node 16 compatibility
        run: |
          node --check src/runtime-authority.js
          node --check src/index.js
          node --check src/provider-adapter-m13.js
          node -e "const api=require('./src'); if(typeof api.generateContractProtectionProposal!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
      - name: Node 18 Round-8 focused and full
        run: |
          node --test test/m13-review-remediation.test.js
          node --test test/runtime-authority.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Node 20 Round-8 focused and full
        run: |
          node --test test/m13-review-remediation.test.js
          node --test test/runtime-authority.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Node 22 Round-8 focused stress and full
        shell: bash
        run: |
          set -o pipefail
          node --test test/m13-review-remediation.test.js 2>&1 | tee round8-node22-focused.log
          node --test test/runtime-authority.test.js 2>&1 | tee round8-node22-runtime.log
          for i in 1 2 3; do node --test test/m13-review-remediation.test.js; done
          npm test 2>&1 | tee round8-node22-full.log

      - name: Upload Node 22 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-round8-node22-final
          path: |
            round8-node22-focused.log
            round8-node22-runtime.log
            round8-node22-full.log
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Node 24 Round-8 focused and full
        run: |
          node --test test/m13-review-remediation.test.js
          node --test test/runtime-authority.test.js
          npm test

      - name: Materialize tested production state
        env:
          BRANCH: milestone-13-runtime-slice-a
        run: |
          rm -f .github/workflows/*round8*
          rm -f .github/workflows/m13-proxy-surface-diag.yml
          rm -f scripts/qa/*round8*
          test -z "$(find .github/workflows scripts/qa -type f \( -iname '*round8*' -o -name 'm13-proxy-surface-diag.yml' \) -print)"
          git diff --check
          git add src/runtime-authority.js src/index.js src/provider-adapter-m13.js test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/runtime-authority.test.js
          git add -u .github/workflows scripts/qa
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -Ei 'round8|m13-proxy-surface-diag' || true)"
          git status --short
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git commit -m "fix: close M13 Codex round8 bootstrap findings"
          git push origin HEAD:${BRANCH}
