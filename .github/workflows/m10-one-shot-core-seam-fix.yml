name: M10CoreSeamFix

'on':
  push:
    branches:
      - milestone-10-remediation-r20-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-10-remediation-r20-impl
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgical source patch
        run: python3 scripts/qa/m10-one-shot-core-seam-fix.py
      - name: Validate complete implementation
        run: |
          node --check src/contract-attacks-core.js
          node --check src/contract-attacks.js
          node --check src/contract-experiment.js
          node --check src/contract-experiment-safe.js
          npm test
          git diff --check
      - name: Commit tested source and remove one-shot files
        run: |
          rm -f .github/workflows/m10-one-shot-core-seam-fix.yml
          rm -f scripts/qa/m10-one-shot-core-seam-fix.py
          git config user.name AidaMichel
          git config user.email 126730924+AidaMichel@users.noreply.github.com
          git add -A
          git commit -m "fix: capture M10 evidence at M8 retention seam"
          git push origin HEAD:milestone-10-remediation-r20-impl
