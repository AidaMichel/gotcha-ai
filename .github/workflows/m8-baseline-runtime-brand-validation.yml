name: M8 baseline runtime brand validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node --check src/ai-data-core.js

      - name: Focused historical regressions
        run: node --test test/m8-codex-round3.test.js test/m8-codex-remediation.test.js

      - name: Full repository suite
        run: npm test

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD
