name: M8 Codex review3 remediation gate

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: write

jobs:
  remediate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Apply Codex review3 remediation
        run: node scripts/qa/patch-m8-review3.js

      - name: Syntax and focused proof on Node 20
        run: |
          node --check src/ai-data-core.js
          node --test test/m8-runtime-brand-authority.test.js

      - name: Full suite on Node 20
        run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Syntax and focused proof on Node 22
        run: |
          node --check src/ai-data-core.js
          node --test test/m8-runtime-brand-authority.test.js

      - name: Full suite on Node 22
        run: npm test

      - name: Diff hygiene
        run: git diff --check

      - name: Commit proven remediation and remove temporary QA harness
        run: |
          git rm .github/workflows/m8-review3-remediation.yml scripts/qa/patch-m8-review3.js
          git add src/ai-data-core.js test/m8-runtime-brand-authority.test.js
          git diff --cached --check
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git commit -m "fix: harden host probe authority"
          git push origin HEAD:fix/m8-baseline-runtime-brands
