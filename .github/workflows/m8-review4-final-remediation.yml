name: M8 V8 Serialization Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compare V8 serialization
        run: |
          node - <<'NODE'
          const v8 = require('node:v8');
          const crypto = require('node:crypto');
          function dump(label, value) {
            try {
              const b = v8.serialize(value);
              console.log(label, b.length, crypto.createHash('sha256').update(b).digest('hex'), b.toString('hex'));
            } catch (e) { console.log(label, 'THROW', e.name, e.message); }
          }
          console.log('node', process.version);
          dump('plain', {foo:'bar'});
          if (typeof Headers === 'function') {
            const h = new Headers([['x','y']]); h.foo='bar'; Object.setPrototypeOf(h,Object.prototype); dump('Headers',h);
          }
          if (typeof FormData === 'function') {
            const f = new FormData(); f.append('x','y'); f.foo='bar'; Object.setPrototypeOf(f,Object.prototype); dump('FormData',f);
          }
          NODE
