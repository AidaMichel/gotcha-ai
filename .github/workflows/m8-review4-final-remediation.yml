name: M8 AbortController Capture Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current remediation in workspace
        run: |
          python3 scripts/qa/m8-review4-final-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa/m8-review4-undici-lazy-fix.py')
          s = p.read_text()
          start = s.index("old_reads = ''')") if "old_reads = ''')" in s else s.index("old_reads = '''")
          end = s.index("marker = ", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 scripts/qa/m8-review4-undici-lazy-fix.py
          python3 scripts/qa/m8-review4-blob-auth-fix.py
          python3 scripts/qa/m8-review4-trim.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ai-data-core.js')
          s = p.read_text()
          needle = '''const abortBrandGetters =\n  captureAbortBrandGetters();'''
          replacement = needle + '''\n\nif (process.env.GOTCHA_DEBUG_ABORT === "1") {\n  console.log("DEBUG_ABORT_CAPTURE", {\n    controller: abortBrandGetters.controller !== null,\n    signal: abortBrandGetters.signal !== null,\n    transferableDescriptor: Object.getOwnPropertyDescriptor(nodeUtil, "transferableAbortController")\n  });\n}'''
          if s.count(needle) != 1:
              raise SystemExit('abort capture seam not unique')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Trace capture and classification
        env:
          GOTCHA_DEBUG_ABORT: "1"
        run: |
          node - <<'NODE'
          const { cloneAiData } = require('./src/ai-data');
          const c = new AbortController();
          c.foo = 'bar';
          Object.setPrototypeOf(c, Object.prototype);
          try {
            cloneAiData(c, 'AbortController');
            console.log('CLASSIFICATION accepted');
          } catch (error) {
            console.log('CLASSIFICATION', error.message);
          }
          NODE
