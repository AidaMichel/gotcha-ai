name: M8 Node24 Poison Trace

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply current remediation in workspace
        run: |
          python3 scripts/qa/m8-review4-final-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa/m8-review4-undici-lazy-fix.py')
          s = p.read_text()
          start = s.index("old_reads = ''')") if "old_reads = ''')" in s else s.index("old_reads = '''")
          end = s.index("marker = ", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 scripts/qa/m8-review4-undici-lazy-fix.py
          python3 scripts/qa/m8-review4-blob-auth-fix.py
          python3 scripts/qa/m8-review4-abort-symbol-fix.py
          python3 scripts/qa/m8-review4-abort-private-fix.py
          python3 scripts/qa/m8-review4-trim.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Trace exact stateful Headers getter case
        run: |
          node - <<'NODE'
          "use strict";
          const path = require('node:path');
          const aiDataPath = path.resolve('src/ai-data.js');
          const OriginalHeaders = globalThis.Headers;
          const saved = new OriginalHeaders();
          saved.foo = 'bar';
          Object.setPrototypeOf(saved, Object.prototype);
          const poisoned = new Proxy(OriginalHeaders, {});
          let reads = 0;
          Object.defineProperty(globalThis, 'Headers', {
            configurable: true,
            get() {
              reads += 1;
              console.log('STATEFUL_HEADERS_GET', reads, '\n' + new Error('stateful headers read').stack);
              return reads === 1 ? poisoned : undefined;
            }
          });
          globalThis.structuredClone = undefined;
          let cloneAiData;
          try { ({ cloneAiData } = require(aiDataPath)); console.log('LOAD_OK'); }
          catch (e) { console.log('LOAD_THROW', e.name, e.message, '\n' + e.stack); }
          console.log('READS_AFTER_LOAD', reads);
          if (cloneAiData) {
            try { cloneAiData(saved); console.log('CLONE_ACCEPTED'); }
            catch (e) { console.log('CLONE_THROW', e.name, e.message); }
          }
          console.log('READS_FINAL', reads);
          NODE

      - name: Trace Proxy Headers.get case
        run: |
          node - <<'NODE'
          "use strict";
          const path = require('node:path');
          const aiDataPath = path.resolve('src/ai-data.js');
          const Constructor = globalThis.Headers;
          const saved = new Constructor();
          saved.foo = 'bar';
          Object.setPrototypeOf(saved, Object.prototype);
          const originalGet = Constructor.prototype.get;
          let trapCalls = 0;
          Constructor.prototype.get = new Proxy(originalGet, {
            apply(target, receiver, args) {
              trapCalls += 1;
              console.log('HEADERS_GET_PROXY_APPLY', trapCalls, 'receiverProto', Object.getPrototypeOf(receiver), 'args', args, '\n' + new Error('proxy apply').stack);
              throw new Error('poisoned Headers.get executed');
            }
          });
          globalThis.structuredClone = undefined;
          let cloneAiData;
          try { ({ cloneAiData } = require(aiDataPath)); console.log('LOAD_OK'); }
          catch (e) { console.log('LOAD_THROW', e.name, e.message, '\n' + e.stack); }
          console.log('TRAPS_AFTER_LOAD', trapCalls);
          if (cloneAiData) {
            try { cloneAiData(saved); console.log('CLONE_ACCEPTED'); }
            catch (e) { console.log('CLONE_THROW', e.name, e.message); }
          }
          console.log('TRAPS_FINAL', trapCalls);
          NODE

      - name: Trace ordinary Headers.get case
        run: |
          node - <<'NODE'
          "use strict";
          const path = require('node:path');
          const aiDataPath = path.resolve('src/ai-data.js');
          const Constructor = globalThis.Headers;
          const saved = new Constructor();
          saved.foo = 'bar';
          Object.setPrototypeOf(saved, Object.prototype);
          let calls = 0;
          Constructor.prototype.get = function get() {
            calls += 1;
            console.log('HEADERS_GET_ORDINARY', calls, '\n' + new Error('ordinary get call').stack);
            throw new Error('poisoned Headers.get executed');
          };
          globalThis.structuredClone = undefined;
          let cloneAiData;
          try { ({ cloneAiData } = require(aiDataPath)); console.log('LOAD_OK'); }
          catch (e) { console.log('LOAD_THROW', e.name, e.message, '\n' + e.stack); }
          console.log('CALLS_AFTER_LOAD', calls);
          if (cloneAiData) {
            try { cloneAiData(saved); console.log('CLONE_ACCEPTED'); }
            catch (e) { console.log('CLONE_THROW', e.name, e.message); }
          }
          console.log('CALLS_FINAL', calls);
          NODE

      - name: Trace untrusted AbortController accessor case
        run: |
          node - <<'NODE'
          "use strict";
          const path = require('node:path');
          const aiDataPath = path.resolve('src/ai-data.js');
          const OriginalAbortController = globalThis.AbortController;
          const saved = new OriginalAbortController();
          saved.foo = 'bar';
          Object.setPrototypeOf(saved, Object.prototype);
          let getterCalls = 0;
          let setterCalls = 0;
          Object.defineProperty(globalThis, 'AbortController', {
            configurable: true,
            enumerable: false,
            get() {
              getterCalls += 1;
              console.log('ABORT_GET', getterCalls, '\n' + new Error('abort getter').stack);
              throw new Error('untrusted AbortController getter executed');
            },
            set(value) {
              setterCalls += 1;
              console.log('ABORT_SET', setterCalls, typeof value, '\n' + new Error('abort setter').stack);
              throw new Error('untrusted AbortController setter executed');
            }
          });
          globalThis.structuredClone = undefined;
          let cloneAiData;
          try { ({ cloneAiData } = require(aiDataPath)); console.log('LOAD_OK'); }
          catch (e) { console.log('LOAD_THROW', e.name, e.message, '\n' + e.stack); }
          console.log('COUNTS_AFTER_LOAD', {getterCalls, setterCalls});
          if (cloneAiData) {
            try { cloneAiData(saved); console.log('CLONE_ACCEPTED'); }
            catch (e) { console.log('CLONE_THROW', e.name, e.message); }
          }
          console.log('COUNTS_FINAL', {getterCalls, setterCalls});
          NODE
