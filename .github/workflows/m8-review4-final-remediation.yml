name: M8 AbortController Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Verify module-owned getter on rewritten receiver
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const c = util.transferableAbortController();
          const getter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(c), 'signal').get;
          const normal = new AbortController();
          const normalSignal = normal.signal;
          Object.setPrototypeOf(normal, Object.prototype);
          try {
            const result = Reflect.apply(getter, normal, []);
            console.log('controller getter accepted rewritten normal', result === normalSignal, result);
          } catch (error) {
            console.log('controller getter rejected rewritten normal', error.name, error.message);
          }
          const signalGetter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(c.signal), 'aborted').get;
          Object.setPrototypeOf(normalSignal, Object.prototype);
          try {
            console.log('signal getter accepted rewritten normal signal', Reflect.apply(signalGetter, normalSignal, []));
          } catch (error) {
            console.log('signal getter rejected rewritten normal signal', error.name, error.message);
          }
          NODE
