name: M8 AbortController Accessor Source Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [16.20.2, 18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect trusted util accessor source
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const d = Object.getOwnPropertyDescriptor(util, 'transferableAbortController');
          const natives = process.binding('natives');
          console.log('node', process.version, 'descriptor', d && {
            enumerable:d.enumerable,
            configurable:d.configurable,
            get:typeof d.get,
            set:typeof d.set,
            value:typeof d.value
          });
          if (d && typeof d.get === 'function') {
            const source = Function.prototype.toString.call(d.get);
            console.log('name', d.get.name, 'length', d.get.length, 'source', JSON.stringify(source));
            const matches=[];
            for (const key of Reflect.ownKeys(natives)) {
              const nd=Object.getOwnPropertyDescriptor(natives,key);
              if (nd && typeof nd.value==='string' && nd.value.includes(source)) matches.push(key);
            }
            console.log('matches', matches);
          }
          NODE
