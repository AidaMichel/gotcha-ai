name: M8 Headers Inspect Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect rewritten Headers safely
        run: |
          node - <<'NODE'
          const util = require('node:util');
          console.log('node', process.version);
          const values = [
            ['plain', {foo:'bar'}],
            ['null-proto', Object.assign(Object.create(null), {foo:'bar'})]
          ];
          if (typeof Headers === 'function') {
            const h = new Headers([['x','y']]); h.foo='bar'; Object.setPrototypeOf(h, Object.prototype); values.push(['Headers', h]);
          }
          if (typeof FormData === 'function') {
            const f = new FormData(); f.append('x','y'); f.foo='bar'; Object.setPrototypeOf(f, Object.prototype); values.push(['FormData', f]);
          }
          for (const [name, value] of values) {
            let s;
            try {
              s = util.inspect(value, { showHidden:true, customInspect:false, getters:false, depth:1, maxArrayLength:5, maxStringLength:80 });
              console.log(name, 'inspect=', JSON.stringify(s));
            } catch (e) { console.log(name, 'inspect THROW', e.name, e.message); }
            try { console.log(name, 'tag=', Object.prototype.toString.call(value)); }
            catch (e) { console.log(name, 'tag THROW', e.name, e.message); }
          }
          NODE
