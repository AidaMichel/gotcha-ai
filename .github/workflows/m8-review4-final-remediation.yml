name: M8 Host Probe Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Probe Blob authenticating methods
        run: |
          node - <<'NODE'
          const buffer = require('node:buffer');
          const Blob = buffer.Blob;
          console.log('node', process.version, 'Blob', typeof Blob);
          if (typeof Blob !== 'function') process.exit(0);
          const proto = Blob.prototype;
          for (const key of ['size','type']) {
            const d = Object.getOwnPropertyDescriptor(proto, key);
            const getter = d && d.get;
            if (typeof getter !== 'function') { console.log(key, 'getter ABSENT'); continue; }
            try { console.log(key, 'ordinary ACCEPT', Reflect.apply(getter, {}, [])); }
            catch (e) { console.log(key, 'ordinary REJECT', e.name, e.message); }
          }
          for (const key of ['slice']) {
            const d = Object.getOwnPropertyDescriptor(proto, key);
            const method = d && d.value;
            if (typeof method !== 'function') { console.log(key, 'method ABSENT'); continue; }
            try { console.log(key, 'ordinary ACCEPT', Reflect.apply(method, {}, [0,1])); }
            catch (e) { console.log(key, 'ordinary REJECT', e.name, e.message); }
            const genuine = new Blob(['abc']);
            Object.setPrototypeOf(genuine, Object.prototype);
            try {
              const out = Reflect.apply(method, genuine, [0,1]);
              console.log(key, 'rewritten genuine ACCEPT', out && out.size, Object.prototype.toString.call(out));
            } catch (e) {
              console.log(key, 'rewritten genuine REJECT', e.name, e.message);
            }
          }
          NODE
