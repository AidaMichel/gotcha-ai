name: M8 Native Binding Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect native utility bindings
        run: |
          node - <<'NODE'
          console.log('node', process.version);
          for (const bindingName of ['util','types']) {
            try {
              const b = process.binding(bindingName);
              console.log('binding', bindingName, Reflect.ownKeys(b));
              const values = [['plain',{foo:'bar'}]];
              if (typeof Headers === 'function') {
                const h = new Headers([['x','y']]); h.foo='bar'; Object.setPrototypeOf(h,Object.prototype); values.push(['Headers',h]);
              }
              for (const fnName of ['getConstructorName','getOwnNonIndexProperties','isExternal','isProxy']) {
                const fn = b && b[fnName];
                if (typeof fn !== 'function') continue;
                for (const [label,v] of values) {
                  try { console.log(bindingName, fnName, label, Reflect.apply(fn,b,[v])); }
                  catch(e) { console.log(bindingName, fnName, label, 'THROW', e.name, e.message); }
                }
              }
            } catch (e) { console.log('binding', bindingName, 'FAIL', e.name, e.message); }
          }
          NODE
