name: M8 Lazy Accessor Shape Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect accessor pair
        run: |
          node - <<'NODE'
          const natives = process.binding('natives');
          const fts = Function.prototype.toString;
          function modulesContaining(source) {
            const out=[];
            for (const k of Reflect.ownKeys(natives)) {
              if (typeof k !== 'string') continue;
              const d=Object.getOwnPropertyDescriptor(natives,k);
              if (d && typeof d.value==='string' && d.value.includes(source)) out.push(k);
            }
            return out;
          }
          console.log('node', process.version);
          for (const name of ['Headers','FormData','Request','Response']) {
            const d=Object.getOwnPropertyDescriptor(globalThis,name);
            console.log('\n',name,'descriptor',d && {enumerable:d.enumerable,configurable:d.configurable,get:typeof d.get,set:typeof d.set,value:typeof d.value});
            for (const key of ['get','set']) {
              const fn=d && d[key];
              if (typeof fn!=='function') continue;
              const s=fts.call(fn);
              console.log(key,'name',fn.name,'length',fn.length,'protoDesc',Object.getOwnPropertyDescriptor(fn,'prototype'),'modules',modulesContaining(s),'source',JSON.stringify(s));
            }
          }
          NODE
