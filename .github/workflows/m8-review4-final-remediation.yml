name: M8 Final Host Authority Remediation

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded remediation
        run: |
          python3 scripts/qa/m8-review4-final-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa/m8-review4-undici-lazy-fix.py')
          s = p.read_text()
          start = s.index("old_reads = ''')") if "old_reads = ''')" in s else s.index("old_reads = '''")
          end = s.index("marker = ", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 scripts/qa/m8-review4-undici-lazy-fix.py
          python3 scripts/qa/m8-review4-blob-auth-fix.py
          python3 scripts/qa/m8-review4-trim.py

      - name: Diff hygiene before tests
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Diagnose AbortController authority
        run: |
          node - <<'NODE'
          const util = require('node:util');
          console.log('node', process.version);
          console.log('transferableAbortController', typeof util.transferableAbortController);
          console.log('transferableAbortSignal', typeof util.transferableAbortSignal);
          if (typeof util.transferableAbortController === 'function') {
            const c = util.transferableAbortController();
            let p = Object.getPrototypeOf(c);
            let i = 0;
            while (p && i < 5) {
              console.log('controller proto', i, Object.getOwnPropertyNames(p), Object.getOwnPropertySymbols(p).map(String));
              const d = Object.getOwnPropertyDescriptor(p, 'signal');
              if (d) console.log('signal descriptor level', i, d, 'get source', d.get && Function.prototype.toString.call(d.get));
              p = Object.getPrototypeOf(p);
              i += 1;
            }
            const s = c.signal;
            p = Object.getPrototypeOf(s);
            i = 0;
            while (p && i < 5) {
              console.log('signal proto', i, Object.getOwnPropertyNames(p), Object.getOwnPropertySymbols(p).map(String));
              const d = Object.getOwnPropertyDescriptor(p, 'aborted');
              if (d) console.log('aborted descriptor level', i, d, 'get source', d.get && Function.prototype.toString.call(d.get));
              p = Object.getPrototypeOf(p);
              i += 1;
            }
          }
          NODE

      - name: Node 18 focused and full suite
        run: |
          npm ci
          node --check src/ai-data-core.js
          node --test test/m8-runtime-brand-authority.test.js
          npm test
