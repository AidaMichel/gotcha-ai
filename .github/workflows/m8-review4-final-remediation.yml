name: M8 Final Host Authority Remediation

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded remediation
        run: |
          python3 scripts/qa/m8-review4-final-remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa/m8-review4-undici-lazy-fix.py')
          s = p.read_text()
          start = s.index("old_reads = ''')") if "old_reads = ''')" in s else s.index("old_reads = '''")
          end = s.index("marker = ", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 scripts/qa/m8-review4-undici-lazy-fix.py
          python3 scripts/qa/m8-review4-blob-auth-fix.py
          python3 scripts/qa/m8-review4-abort-symbol-fix.py
          python3 scripts/qa/m8-review4-abort-private-fix.py
          python3 scripts/qa/m8-node24-abort-bootstrap-order-fix.py
          python3 scripts/qa/m8-node24-urlpattern-brand-fix.py
          python3 scripts/qa/m8-review4-trim.py

      - name: Diff hygiene before tests
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
      - name: Node 14 compatibility
        run: |
          node --check src/ai-data-core.js
          node - <<'NODE'
          const assert = require('assert').strict;
          const { Blob } = require('node:buffer');
          const { cloneAiData } = require('./src/ai-data');
          assert.deepStrictEqual(cloneAiData({ok:true,nested:{value:1}}), {ok:true,nested:{value:1}});
          const p = new URLSearchParams('a=1');
          p.foo = 'bar';
          Object.setPrototypeOf(p, Object.prototype);
          assert.throws(() => cloneAiData(p));
          if (typeof Blob === 'function') {
            const blob = new Blob(['x']);
            blob.foo = 'bar';
            Object.setPrototypeOf(blob, Object.prototype);
            assert.throws(() => cloneAiData(blob));
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: Node 16 compatibility
        run: |
          node --check src/ai-data-core.js
          node - <<'NODE'
          const assert = require('assert').strict;
          const { Blob } = require('node:buffer');
          const { cloneAiData } = require('./src/ai-data');
          assert.deepStrictEqual(cloneAiData({ok:true,nested:{value:1}}), {ok:true,nested:{value:1}});
          const p = new URLSearchParams('a=1');
          p.foo = 'bar';
          Object.setPrototypeOf(p, Object.prototype);
          assert.throws(() => cloneAiData(p));
          if (typeof Blob === 'function') {
            const blob = new Blob(['x']);
            blob.foo = 'bar';
            Object.setPrototypeOf(blob, Object.prototype);
            assert.throws(() => cloneAiData(blob));
          }
          if (typeof AbortController === 'function') {
            const c = new AbortController();
            c.foo = 'bar';
            Object.setPrototypeOf(c, Object.prototype);
            assert.throws(() => cloneAiData(c));
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Node 18 focused and full suite
        run: |
          npm ci
          node --check src/ai-data-core.js
          node --test test/m8-runtime-brand-authority.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Node 20 focused and full suite
        run: |
          npm ci
          node --check src/ai-data-core.js
          node --test test/m8-runtime-brand-authority.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node 22 focused and full suite
        run: |
          npm ci
          node --check src/ai-data-core.js
          node --test test/m8-runtime-brand-authority.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Node 24 focused and full suite
        id: node24
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -e
            node --version
            npm ci
            node --check src/ai-data-core.js
            node --test test/m8-runtime-brand-authority.test.js
            npm test
          ) > node24-diagnostic.log 2>&1
          status=$?
          cat node24-diagnostic.log
          exit "$status"

      - name: Upload Node 24 diagnostic
        if: steps.node24.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: m8-node24-diagnostic
          path: node24-diagnostic.log
          if-no-files-found: error

      - name: Preserve Node 24 gate
        if: steps.node24.outcome == 'failure'
        run: exit 1

      - name: Final diff hygiene
        run: git diff --check

      - name: Commit proven remediation and remove harness
        env:
          BRANCH: fix/m8-baseline-runtime-brands
        run: |
          rm -f \
            scripts/qa/m8-review4-final-remediate.py \
            scripts/qa/m8-review4-undici-lazy-fix.py \
            scripts/qa/m8-review4-blob-auth-fix.py \
            scripts/qa/m8-review4-abort-symbol-fix.py \
            scripts/qa/m8-review4-abort-private-fix.py \
            scripts/qa/m8-node24-abort-bootstrap-order-fix.py \
            scripts/qa/m8-node24-urlpattern-brand-fix.py \
            scripts/qa/m8-review4-trim.py \
            .github/workflows/m8-node24-loader-diagnostic.yml \
            .github/workflows/m8-review4-final-remediation.yml
          git add -A
          git diff --cached --check
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git commit -m "fix: replace ambient host probe authority"
          git push origin HEAD:"$BRANCH"
