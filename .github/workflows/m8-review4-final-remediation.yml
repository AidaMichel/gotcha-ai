name: M8 Undici Handle Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Find core-owned Undici handles
        run: |
          node - <<'NODE'
          const mod = require('node:module');
          console.log('node', process.version);
          console.log('builtin undici matches', mod.builtinModules.filter(x => String(x).toLowerCase().includes('undici')));
          console.log('process.getBuiltinModule', typeof process.getBuiltinModule);
          for (const spec of ['undici','node:undici','internal/deps/undici/undici','node:internal/deps/undici/undici']) {
            try {
              const m = require(spec);
              console.log('require', spec, 'OK', m && typeof m, m && Object.keys(m).slice(0,20));
            } catch (e) {
              console.log('require', spec, 'FAIL', e && e.code, e && e.message);
            }
            if (typeof process.getBuiltinModule === 'function') {
              try {
                const m = process.getBuiltinModule(spec);
                console.log('getBuiltinModule', spec, '=>', m && typeof m, m && Object.keys(m).slice(0,20));
              } catch (e) {
                console.log('getBuiltinModule', spec, 'FAIL', e && e.code, e && e.message);
              }
            }
          }
          const vm = require('node:vm');
          try {
            const d = vm.runInNewContext("Object.getOwnPropertyDescriptor(globalThis, 'Headers')");
            console.log('vm Headers descriptor', d && Object.keys(d), d && typeof d.value, d && typeof d.get);
          } catch (e) { console.log('vm descriptor FAIL', e.name, e.message); }
          try {
            const t = vm.runInNewContext("typeof Headers");
            console.log('vm typeof Headers', t);
          } catch (e) { console.log('vm typeof FAIL', e.name, e.message); }
          NODE
