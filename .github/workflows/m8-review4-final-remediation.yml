name: M8 VM AbortController Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [16.20.2, 18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect VM globals and cross-realm brand probes
        run: |
          node - <<'NODE'
          const vm = require('node:vm');
          console.log('node', process.version, 'typeof VM AbortController', vm.runInNewContext('typeof AbortController'), 'typeof VM AbortSignal', vm.runInNewContext('typeof AbortSignal'));
          let vmController;
          try { vmController = vm.runInNewContext('typeof AbortController === "function" ? new AbortController() : null'); } catch (e) { console.log('vm construct error',e.name,e.message); }
          if (vmController) {
            const getter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(vmController), 'signal').get;
            const local = new AbortController();
            const expected = local.signal;
            Object.setPrototypeOf(local,Object.prototype);
            try { const got=Reflect.apply(getter,local,[]); console.log('vm getter accepted local',got===expected); } catch(e) { console.log('vm getter rejected local',e.name,e.message); }
          }
          NODE
