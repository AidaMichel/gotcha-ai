name: M8 Node18 Clone Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Probe Node18 clone behavior
        run: |
          node - <<'NODE'
          const wt = require('node:worker_threads');
          const { port1, port2 } = new wt.MessageChannel();
          if (typeof port1.unref === 'function') port1.unref();
          if (typeof port2.unref === 'function') port2.unref();
          function run(label, make) {
            const value = make();
            value.foo = 'bar';
            Object.setPrototypeOf(value, Object.prototype);
            try {
              const c = structuredClone(value);
              console.log(label, 'structuredClone OK', c, Object.keys(c));
            } catch (e) {
              console.log(label, 'structuredClone THROW', e.name, e.message);
            }
            try {
              port1.postMessage(value);
              const r = wt.receiveMessageOnPort(port2);
              console.log(label, 'MessagePort OK', r && r.message, r && r.message && Object.keys(r.message));
            } catch (e) {
              console.log(label, 'MessagePort THROW', e.name, e.message);
            }
          }
          for (const [name, make] of [
            ['Headers', () => new Headers()],
            ['FormData', () => new FormData()],
            ['Request', () => new Request('https://example.com/')],
            ['Response', () => new Response('x')]
          ]) {
            run(name, make);
          }
          port1.close(); port2.close();
          NODE
