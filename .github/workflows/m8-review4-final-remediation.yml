name: M8 AbortController Embedded Authority Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [16.20.2, 18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect global constructor and signal getter authority
        run: |
          node - <<'NODE'
          const natives = process.binding('natives');
          const fts = Function.prototype.toString;
          const d = Object.getOwnPropertyDescriptor(globalThis,'AbortController');
          console.log('node',process.version,'global descriptor',d && {
            enumerable:d.enumerable, configurable:d.configurable, writable:d.writable,
            get:typeof d.get, set:typeof d.set, value:typeof d.value
          });
          let C;
          try { C = globalThis.AbortController; } catch(e) { console.log('global read threw',e.name,e.message); }
          if (typeof C === 'function') {
            const cs=fts.call(C);
            console.log('constructor metadata',C.name,C.length,Object.getOwnPropertyDescriptor(C,'prototype'),'source',JSON.stringify(cs));
            console.log('constructor source matches',Object.keys(natives).filter(k=>typeof natives[k]==='string'&&natives[k].includes(cs)));
            const pd=Object.getOwnPropertyDescriptor(C.prototype,'signal');
            console.log('signal desc',pd && {enumerable:pd.enumerable,configurable:pd.configurable,get:typeof pd.get,set:typeof pd.set});
            if (pd && typeof pd.get==='function') {
              const gs=fts.call(pd.get);
              console.log('getter metadata',pd.get.name,pd.get.length,Object.getOwnPropertyDescriptor(pd.get,'prototype'),'source',JSON.stringify(gs));
              console.log('getter source matches',Object.keys(natives).filter(k=>typeof natives[k]==='string'&&natives[k].includes(gs)));
              const x=new C(); const sig=x.signal; Object.setPrototypeOf(x,Object.prototype);
              try { const got=Reflect.apply(pd.get,x,[]); console.log('getter accepts rewritten',got===sig); } catch(e){ console.log('getter rejects rewritten',e.name,e.message); }
            }
          }
          console.log('abort related native module names',Object.keys(natives).filter(k=>/abort/i.test(k)));
          NODE
