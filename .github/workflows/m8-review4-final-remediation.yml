name: M8 Undici Own-State Diagnostic

on:
  push:
    branches:
      - fix/m8-baseline-runtime-brands

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect own state after prototype rewrite
        run: |
          node - <<'NODE'
          console.log('node', process.version);
          const makers = [
            ['Headers', () => new Headers()],
            ['FormData', () => new FormData()],
            ['Request', () => new Request('https://example.com/')],
            ['Response', () => new Response('x')]
          ];
          for (const [name, make] of makers) {
            if (typeof globalThis[name] !== 'function') continue;
            const value = make();
            value.foo = 'bar';
            Object.setPrototypeOf(value, Object.prototype);
            const ds = Object.getOwnPropertyDescriptors(value);
            const keys = Reflect.ownKeys(ds);
            console.log('\n', name, 'keys', keys.map(k => typeof k === 'symbol' ? 'symbol:' + String(k) : k));
            for (const k of keys) {
              const d = ds[k];
              console.log(' descriptor', typeof k === 'symbol' ? String(k) : k, {
                enumerable:d.enumerable, configurable:d.configurable, writable:'writable' in d ? d.writable : undefined,
                get:typeof d.get, set:typeof d.set, valueType:'value' in d ? typeof d.value : undefined
              });
            }
          }
          NODE
