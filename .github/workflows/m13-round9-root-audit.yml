name: M13 Round10 bootstrap trust validation

on:
  push:
    branches:
      - qa/m13-round9-root-audit

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round10 remediation
        run: python3 scripts/qa/m13-round10-run.py
      - name: Syntax and compatibility proof
        run: |
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check src/provider-adapter-m13.js
          node --check src/index.js
          node --check test/m13-bootstrap-root-authority.test.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          node --test test/m13-bootstrap-root-authority.test.js test/m13-review-remediation.test.js
          node - <<'NODE'
          const api = require('./src');
          for (const name of ['runContractAttacks','generateContractProtectionProposal','createStructuredProviderAdapter']) {
            if (typeof api[name] !== 'function') throw new Error(name + ' is not callable');
          }
          NODE

  supported-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round10 remediation
        run: python3 scripts/qa/m13-round10-run.py
      - name: Syntax and diff hygiene
        run: |
          node --check src/package-authority.js
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check src/provider-adapter-m13.js
          node --check src/index.js
          node --check test/m13-bootstrap-root-authority.test.js
          node --check test/m13-review-remediation.test.js
          git diff --check
      - name: Round10 non-root authority regressions
        run: node --test test/m13-bootstrap-root-authority.test.js
      - name: Focused authority and M13 regressions
        run: node --test test/m13-bootstrap-root-authority.test.js test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
      - name: Node 22 focused stress
        if: startsWith(matrix.node, '22')
        run: |
          for i in 1 2 3; do
            echo "Round10 focused stress pass $i"
            node --test test/m13-bootstrap-root-authority.test.js test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js test/m8-runtime-brand-authority.test.js
          done
      - name: Full repository suite
        run: npm test
