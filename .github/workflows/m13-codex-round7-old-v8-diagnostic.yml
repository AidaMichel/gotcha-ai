name: M13 round7 old-v8 diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2, 18.20.8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Inspect process.binding V8 path
        shell: bash
        run: |
          node <<'NODE'
          const source = Function.prototype.toString;
          const bindingDescriptor = Object.getOwnPropertyDescriptor(process, 'binding');
          console.log('node', process.version);
          console.log('binding-descriptor', JSON.stringify({writable: bindingDescriptor && bindingDescriptor.writable, enumerable: bindingDescriptor && bindingDescriptor.enumerable, configurable: bindingDescriptor && bindingDescriptor.configurable}));
          console.log('binding-source', JSON.stringify(bindingDescriptor && typeof bindingDescriptor.value === 'function' ? source.call(bindingDescriptor.value) : null));
          const bufferModule = require('node:buffer');
          const originalBuffer = Object.getOwnPropertyDescriptor(bufferModule, 'Buffer');
          let bufferCalls = 0;
          Object.defineProperty(bufferModule, 'Buffer', {
            get() { bufferCalls += 1; throw new Error('Buffer getter executed'); },
            enumerable: originalBuffer.enumerable,
            configurable: true
          });
          const previousNoDeprecation = process.noDeprecation;
          process.noDeprecation = true;
          let setter = null;
          let error = null;
          try {
            const binding = bindingDescriptor.value.call(process, 'v8');
            const descriptor = Object.getOwnPropertyDescriptor(binding, 'setFlagsFromString');
            setter = descriptor && descriptor.value;
            console.log('setter-descriptor', JSON.stringify({writable: descriptor && descriptor.writable, enumerable: descriptor && descriptor.enumerable, configurable: descriptor && descriptor.configurable}));
            console.log('setter-source', JSON.stringify(typeof setter === 'function' ? source.call(setter) : null));
          } catch (caught) {
            error = caught;
          } finally {
            process.noDeprecation = previousNoDeprecation;
            Object.defineProperty(bufferModule, 'Buffer', originalBuffer);
          }
          console.log('buffer-calls', bufferCalls);
          console.log('error', error && error.stack || null);
          if (bufferCalls !== 0 || error) process.exitCode = 2;
          NODE
