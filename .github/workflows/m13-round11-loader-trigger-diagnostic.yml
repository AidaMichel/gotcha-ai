name: M13 Round11 loader trigger diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-loader-trigger-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.11.1", "20.12.0", "22.0.0", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Trace individual builtin operations
        run: |
          node - <<'NODE'
          const util = require('node:util');
          const typesDescriptor = Object.getOwnPropertyDescriptor(util, 'types');
          const inspectDescriptor = Object.getOwnPropertyDescriptor(util, 'inspect');
          if (!typesDescriptor || !typesDescriptor.configurable) {
            console.log('NOT_APPLICABLE', process.version);
            process.exit(0);
          }
          let typeCalls = 0;
          let inspectCalls = 0;
          Object.defineProperty(util, 'types', {
            configurable: true,
            enumerable: typesDescriptor.enumerable,
            get() { typeCalls += 1; throw new Error('poison types'); }
          });
          if (inspectDescriptor && inspectDescriptor.configurable) {
            Object.defineProperty(util, 'inspect', {
              configurable: true,
              enumerable: inspectDescriptor.enumerable,
              get() { inspectCalls += 1; throw new Error('poison inspect'); }
            });
          }

          const report = (label, beforeT, beforeI, error) => {
            console.log(JSON.stringify({
              node: process.version,
              label,
              deltaTypes: typeCalls - beforeT,
              deltaInspect: inspectCalls - beforeI,
              totalTypes: typeCalls,
              totalInspect: inspectCalls,
              error: error ? String(error && error.message || error) : null
            }));
          };
          const attempt = (label, fn) => {
            const beforeT = typeCalls;
            const beforeI = inspectCalls;
            let error = null;
            try { fn(); } catch (e) { error = e; }
            report(label, beforeT, beforeI, error);
          };

          attempt('require-node-util-types', () => require('node:util/types'));
          attempt('process-binding-natives', () => process.binding('natives'));
          for (const id of [
            'node:vm', 'node:perf_hooks', 'node:worker_threads', 'node:url',
            'node:buffer', 'node:stream/web', 'node:crypto', 'node:process',
            'node:async_hooks', 'node:inspector'
          ]) {
            attempt('require-' + id, () => require(id));
          }
          attempt('process-binding-natives-after-loads', () => process.binding('natives'));

          Object.defineProperty(util, 'types', typesDescriptor);
          if (inspectDescriptor && inspectDescriptor.configurable) {
            Object.defineProperty(util, 'inspect', inspectDescriptor);
          }
          NODE
