name: M8 temporary patch trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: milestone-8-ai-attacks
          fetch-depth: 0

      - name: Apply and verify final remediation
        run: |
          set -euo pipefail

          node - <<'NODE'
          for (const [name, Constructor] of [["Headers", globalThis.Headers], ["FormData", globalThis.FormData]]) {
            if (typeof Constructor !== "function") continue;
            const value = new Constructor();
            value.foo = "bar";
            Object.setPrototypeOf(value, Object.prototype);
            const get = Constructor.prototype.get;
            try {
              Reflect.apply(get, value, ["__gotcha_brand_probe__"]);
              console.log(`${name}.get brand probe: SUCCESS`);
            } catch (error) {
              console.log(`${name}.get brand probe: FAIL ${error && error.message}`);
            }
            if (typeof structuredClone === "function") {
              try {
                structuredClone(value);
                console.log(`${name} structuredClone: SUCCESS`);
              } catch (error) {
                console.log(`${name} structuredClone: FAIL ${error && error.message}`);
              }
            }
          }
          NODE

          python3 .github/scripts/m8-final-patch.py

          node --check src/ai-data.js
          node --check src/contract-attacks.js
          node --check test/m8-codex-round3.test.js

          node --test test/m8-codex-round3.test.js

          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"

          git add -- \
            src/ai-data.js \
            src/contract-attacks.js \
            test/m8-codex-round3.test.js

          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "fix: close final M8 adversarial gaps"
            git push origin HEAD:milestone-8-ai-attacks
          fi
