name: M8 temporary final validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Syntax
        run: |
          node --check src/ai-data.js
          node --check src/contract-attacks.js
          node --check src/index.js
          node --check test/m8-codex-remediation.test.js
          node --check test/m8-codex-round3.test.js
          node --check test/contract-attacks.test.js

      - name: Round 2 remediation regressions
        run: node --test test/m8-codex-remediation.test.js

      - name: Round 3 remediation regressions
        run: node --test test/m8-codex-round3.test.js

      - name: Contract attacks focused
        run: node --test test/contract-attacks.test.js

      - name: AI data focused
        run: node --test test/ai-data.test.js

      - name: Full repository
        run: node --test

      - name: Public export identity
        run: |
          node - <<'NODE'
          const publicApi = require('./src');
          const internal = require('./src/contract-attacks');
          if (publicApi.runContractAttacks !== internal.runContractAttacks) {
            throw new Error('public runContractAttacks export mismatch');
          }
          console.log('public export identity: PASS');
          NODE

      - name: Diff integrity
        run: |
          git diff --check origin/main...HEAD
          git diff --exit-code origin/main...HEAD -- src/engine.js

  node14:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 14.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Node 14 syntax
        run: |
          node --check src/ai-data.js
          node --check src/contract-attacks.js
          node --check src/index.js

      - name: Node 14 minimum-runtime smoke
        run: |
          node - <<'NODE'
          const assert = require('assert').strict;
          const vm = require('vm');
          const { cloneAiData } = require('./src/ai-data');
          const publicApi = require('./src');

          assert.equal(typeof publicApi.runContractAttacks, 'function');

          for (const value of [
            new WebAssembly.Memory({ initial: 1 }),
            new WebAssembly.Table({ initial: 1, element: 'anyfunc' }),
            new WebAssembly.Global({ value: 'i32', mutable: true }, 1)
          ]) {
            value.foo = 'bar';
            Object.setPrototypeOf(value, Object.prototype);
            assert.throws(() => cloneAiData(value));
          }

          const foreignInput = vm.runInNewContext('({ request: ["3 PM"] })');
          const contract = {
            version: 1,
            status: 'confirmed',
            task: 'Return the approved time.',
            rules: [{
              id: 'time-rule',
              statement: 'Time must be 3 PM.',
              kind: 'required',
              severity: 'critical'
            }]
          };

          publicApi.runContractAttacks({
            contract,
            input: foreignInput,
            expectedOutput: { time: '3 PM' },
            evaluator() { return true; },
            generator({ input }) {
              assert.equal(Object.getPrototypeOf(input), null);
              return Promise.resolve({
                version: 1,
                task: contract.task,
                attacks: [{
                  id: 'wrong-time',
                  ruleId: 'time-rule',
                  type: 'wrong-time',
                  description: 'Changes the approved time.',
                  rationale: 'Proposed rule violation.',
                  mutatedOutput: { time: '4 PM' },
                  scores: {
                    realism: 1,
                    subtlety: 1,
                    novelty: 1,
                    fixability: 1
                  }
                }]
              });
            }
          }).then((result) => {
            assert.equal(result.generatedAttacks.length, 1);
            assert.equal(result.topFinding.ruleId, 'time-rule');
            console.log('Node 14 minimum-runtime smoke: PASS');
          }).catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
