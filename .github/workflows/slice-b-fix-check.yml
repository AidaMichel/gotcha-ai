name: Slice B review fix validation

on:
  push:
    branches:
      - milestone-10-remediation-slice-b

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/qa/patch-slice-b-authority.py
      - run: node --check src/contract-attacks-core.js
      - run: node --check src/contract-remediation.js
      - run: node --test test/contract-remediation-draft.test.js test/contract-remediation-review-regressions.test.js
      - run: npm test
      - run: git diff --check
      - name: Commit validated source and cleanup
        run: |
          rm scripts/qa/patch-slice-b-authority.py
          rm .github/workflows/slice-b-fix-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contract-attacks-core.js src/contract-remediation.js src/index.js test/contract-remediation-draft.test.js test/contract-remediation-review-regressions.test.js scripts/qa/patch-slice-b-authority.py .github/workflows/slice-b-fix-check.yml
          git diff --cached --check
          git commit -m "fix: close Slice B draft review findings"
          git push
