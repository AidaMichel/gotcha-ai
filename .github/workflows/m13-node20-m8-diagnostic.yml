name: M13 Node20 M8 diagnostic
on:
  push:
    branches: [milestone-13-runtime-slice-a]
jobs:
  trace-m8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.20.2 }
      - name: Apply current candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa/m13-codex-p1-round6.py'); t=p.read_text(); old='if text.count(dupe) != 1:'
          if old not in t: raise SystemExit('round6 duplicate-count marker missing')
          p.write_text(t.replace(old,'if text.count(dupe) != 2:',1))
          p=Path('scripts/qa/m13-codex-p1-round6-followup10.py'); t=p.read_text()
          old='if "utilTypes" in text:\n    raise SystemExit("legacy provider still references utilTypes")\npath.write_text(text)'
          new='text = text.replace("utilTypes", "undefined")\npath.write_text(text)'
          if old not in t: raise SystemExit('followup10 legacy receiver marker missing')
          p.write_text(t.replace(old,new,1))
          PY
          python3 scripts/qa/m13-codex-p1-round6.py
          python3 scripts/qa/m13-codex-p1-round6-followup.py
          python3 scripts/qa/m13-codex-p1-round6-followup2.py
          python3 scripts/qa/m13-codex-p1-round6-followup8.py
          python3 scripts/qa/m13-codex-p1-round6-followup9.py
          python3 scripts/qa/m13-codex-p1-round6-followup10.py
          python3 scripts/qa/m13-codex-p1-round6-followup11.py
          python3 scripts/qa/m13-codex-p1-round6-followup12.py
          python3 scripts/qa/m13-codex-p1-round6-followup13.py
      - name: Trace M8 path
        shell: bash
        run: |
          node <<'NODE'
          "use strict";
          const NativePromise = Promise;
          const cd = Object.getOwnPropertyDescriptor(NativePromise.prototype, "constructor");
          const td = Object.getOwnPropertyDescriptor(NativePromise.prototype, "then");
          const events = [];
          function PoisonPromise(executor) {
            events.push({ kind: "constructor", stack: new Error("PoisonPromise").stack });
            return new NativePromise(executor);
          }
          function poisonThen(onFulfilled, onRejected) {
            events.push({ kind: "then", stack: new Error("poisonThen").stack });
            return Reflect.apply(td.value, this, [onFulfilled, onRejected]);
          }
          Object.defineProperty(NativePromise.prototype, "constructor", {
            value: PoisonPromise, writable: true, enumerable: false, configurable: true
          });
          Object.defineProperty(NativePromise.prototype, "then", {
            value: poisonThen, writable: true, enumerable: false, configurable: true
          });
          const checkpoints = [];
          let api;
          let run;
          let returned;
          try {
            api = require("./src");
            checkpoints.push(["after-require", events.length]);
          } catch (error) {
            checkpoints.push(["require-error", events.length, String(error && error.message || error)]);
          }
          try {
            run = api && api.runContractAttacks;
            checkpoints.push(["after-get-export", events.length, run && run.name]);
          } catch (error) {
            checkpoints.push(["export-error", events.length, String(error && error.message || error)]);
          }
          try {
            if (run) returned = run({
              contract: {
                version: 1, status: "confirmed", task: "Return approved time.",
                rules: [{ id: "time-rule", statement: "Time is 3 PM.", kind: "required", severity: "major" }]
              },
              input: {}, expectedOutput: {},
              evaluator() { throw new Error("evaluator should not run"); },
              generator() { throw new Error("generator should not run"); }
            });
            checkpoints.push(["after-call", events.length]);
          } catch (error) {
            checkpoints.push(["call-error", events.length, String(error && error.message || error)]);
          }
          Object.defineProperty(NativePromise.prototype, "constructor", cd);
          Object.defineProperty(NativePromise.prototype, "then", td);
          console.log("CHECKPOINTS=" + JSON.stringify(checkpoints));
          console.log("EVENTS=" + JSON.stringify(events, null, 2));
          if (returned && typeof returned.then === "function") returned.then(() => {}, () => {});
          NODE
