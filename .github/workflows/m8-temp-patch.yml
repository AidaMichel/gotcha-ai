name: M8 temporary round-3 patch

on:
  push:
    branches:
      - milestone-8-ai-attacks

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply round-3 hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ai = Path("src/ai-data.js")
          text = ai.read_text()

          method_marker = '''const weakRefDeref =
            capturePrototypeMethod(
          '''

          method_insert = '''const additionalHostBrandMethodProbes =
            Object.freeze(
              [
                {
                  method:
                    capturePrototypeMethod(
                      captureGlobalConstructor(
                        "Headers"
                      ),
                      "get"
                    ),
                  args: [
                    "__gotcha_brand_probe__"
                  ]
                },
                {
                  method:
                    capturePrototypeMethod(
                      captureGlobalConstructor(
                        "FormData"
                      ),
                      "get"
                    ),
                  args: [
                    "__gotcha_brand_probe__"
                  ]
                }
              ].filter(
                (probe) =>
                  probe.method !== null
              )
            );

          const weakRefDeref =
            capturePrototypeMethod(
          '''

          if "additionalHostBrandMethodProbes" not in text:
              if method_marker not in text:
                  raise SystemExit("AI method insertion marker not found")
              text = text.replace(
                  method_marker,
                  method_insert,
                  1,
              )

          additional_marker = '''function hasUnsupportedAdditionalBrand(
            value
          ) {
            if (weakRefDeref !== null) {
          '''

          additional_insert = '''function hasUnsupportedAdditionalBrand(
            value
          ) {
            for (
              const probe of
                additionalHostBrandMethodProbes
            ) {
              try {
                reflectApply(
                  probe.method,
                  value,
                  probe.args
                );

                return true;
              } catch {}
            }

            if (weakRefDeref !== null) {
          '''

          if "const probe of\n      additionalHostBrandMethodProbes" not in text:
              if additional_marker not in text:
                  raise SystemExit("AI brand-loop marker not found")
              text = text.replace(
                  additional_marker,
                  additional_insert,
                  1,
              )

          ai.write_text(text)

          contract = Path("src/contract-attacks.js")
          text = contract.read_text()

          top_marker = '''const promiseSpeciesDescriptor =
            getOwnPropertyDescriptor(
              promiseConstructor,
              promiseSpecies
            );

          const hasOwnProperty =
          '''

          top_insert = '''const promiseSpeciesDescriptor =
            getOwnPropertyDescriptor(
              promiseConstructor,
              promiseSpecies
            );

          const functionToString =
            Function.prototype.toString;

          const promiseConstructorSource =
            reflectApply(
              functionToString,
              promiseConstructor,
              []
            );

          const promiseSpeciesGetterSource =
            promiseSpeciesDescriptor !==
                undefined &&
              typeof promiseSpeciesDescriptor
                .get === "function"
              ? reflectApply(
                  functionToString,
                  promiseSpeciesDescriptor.get,
                  []
                )
              : null;

          const hasOwnProperty =
          '''

          if "promiseConstructorSource" not in text:
              if top_marker not in text:
                  raise SystemExit("Promise source marker not found")
              text = text.replace(
                  top_marker,
                  top_insert,
                  1,
              )

          integrity_marker = '''function captureOptions(
            value
          ) {
          '''

          integrity_insert = '''function hasMatchingDescriptorFlags(
            left,
            right
          ) {
            return (
              left !== undefined &&
              right !== undefined &&
              left.enumerable ===
                right.enumerable &&
              left.configurable ===
                right.configurable &&
              left.writable ===
                right.writable
            );
          }

          function isAuthenticatedStandardPromisePrototype(
            prototype
          ) {
            if (
              prototype === null ||
              typeof prototype !== "object" ||
              utilTypes.isProxy(prototype)
            ) {
              return false;
            }

            let constructorDescriptor;
            let constructorPrototypeDescriptor;
            let speciesDescriptor;
            let constructorSource;
            let speciesGetterSource;

            try {
              constructorDescriptor =
                getOwnPropertyDescriptor(
                  prototype,
                  "constructor"
                );

              if (
                constructorDescriptor ===
                  undefined ||
                "get" in
                  constructorDescriptor ||
                "set" in
                  constructorDescriptor ||
                typeof constructorDescriptor
                  .value !== "function" ||
                utilTypes.isProxy(
                  constructorDescriptor.value
                )
              ) {
                return false;
              }

              constructorPrototypeDescriptor =
                getOwnPropertyDescriptor(
                  constructorDescriptor.value,
                  "prototype"
                );

              speciesDescriptor =
                getOwnPropertyDescriptor(
                  constructorDescriptor.value,
                  promiseSpecies
                );

              constructorSource =
                reflectApply(
                  functionToString,
                  constructorDescriptor.value,
                  []
                );

              speciesGetterSource =
                speciesDescriptor !==
                    undefined &&
                  typeof speciesDescriptor
                    .get === "function"
                  ? reflectApply(
                      functionToString,
                      speciesDescriptor.get,
                      []
                    )
                  : null;
            } catch {
              return false;
            }

            return (
              constructorSource ===
                promiseConstructorSource &&
              hasMatchingDescriptorFlags(
                constructorDescriptor,
                promisePrototypeConstructorDescriptor
              ) &&
              constructorPrototypeDescriptor !==
                undefined &&
              !("get" in
                constructorPrototypeDescriptor) &&
              !("set" in
                constructorPrototypeDescriptor) &&
              constructorPrototypeDescriptor.value ===
                prototype &&
              speciesDescriptor !==
                undefined &&
              !("value" in speciesDescriptor) &&
              speciesDescriptor.set ===
                undefined &&
              speciesDescriptor.enumerable ===
                promiseSpeciesDescriptor.enumerable &&
              speciesDescriptor.configurable ===
                promiseSpeciesDescriptor.configurable &&
              speciesGetterSource ===
                promiseSpeciesGetterSource
            );
          }

          function captureOptions(
            value
          ) {
          '''

          if "isAuthenticatedStandardPromisePrototype" not in text:
              if integrity_marker not in text:
                  raise SystemExit("Promise auth insertion marker not found")
              text = text.replace(
                  integrity_marker,
                  integrity_insert,
                  1,
              )

          nonext_old = '''  if (ownConstructor === undefined) {
            if (!isExtensible(value)) {
              throw new Error(
                "Native Promise cannot be observed safely."
              );
            }

            defineProperty(
          '''

          nonext_new = '''  if (ownConstructor === undefined) {
            if (!isExtensible(value)) {
              if (
                isAuthenticatedStandardPromisePrototype(
                  prototype
                )
              ) {
                return callback();
              }

              throw new Error(
                "Native Promise cannot be observed safely."
              );
            }

            defineProperty(
          '''

          if "isAuthenticatedStandardPromisePrototype(\n          prototype" not in text:
              if nonext_old not in text:
                  raise SystemExit("Non-extensible Promise marker not found")
              text = text.replace(
                  nonext_old,
                  nonext_new,
                  1,
              )

          bridge_old = '''function bridgeNativePromise(
            value
          ) {
            return withSafePromiseConstructor(
              value,
              () =>
                reflectApply(
                  promiseThen,
                  value,
                  [
                    passPromiseValue,
                    rethrowPromiseReason
                  ]
                )
            );
          }
          '''

          bridge_new = '''function bridgeNativePromise(
            value
          ) {
            return new promiseConstructor(
              (resolve, reject) => {
                withSafePromiseConstructor(
                  value,
                  () =>
                    reflectApply(
                      promiseThen,
                      value,
                      [
                        resolve,
                        reject
                      ]
                    )
                );
              }
            );
          }
          '''

          if bridge_old in text:
              text = text.replace(
                  bridge_old,
                  bridge_new,
                  1,
              )
          elif "return new promiseConstructor" not in text:
              raise SystemExit("Promise bridge marker not found")

          contract.write_text(text)

          tests = Path("test/m8-codex-remediation.test.js")
          text = tests.read_text()

          tamper_marker = '''    for (const value of candidates) {
              const originalPrototype =
                Object.getPrototypeOf(value);
          '''

          tamper_insert = '''    for (const value of candidates) {
              if (Object.isExtensible(value)) {
                Object.defineProperty(
                  value,
                  "gotchaOwnData",
                  {
                    value: "preserved-data",
                    enumerable: true,
                    configurable: true,
                    writable: true
                  }
                );
              }

              const originalPrototype =
                Object.getPrototypeOf(value);
          '''

          if "gotchaOwnData" not in text:
              if tamper_marker not in text:
                  raise SystemExit("Hidden-slot own-data test marker not found")
              text = text.replace(
                  tamper_marker,
                  tamper_insert,
                  1,
              )

          public_marker = '''test(
            "M8 package entry point exposes runContractAttacks",
          '''

          nonext_test = '''test(
            "non-extensible cross-realm rejected generator Promises are observed safely",
            async () => {
              const unhandled =
                await captureUnhandled(
                  async () => {
                    const value =
                      vm.runInNewContext(`
                        (() => {
                          const promise =
                            Promise.reject(
                              new Error(
                                "non-extensible foreign rejection"
                              )
                            );

                          Object.preventExtensions(
                            promise
                          );

                          return promise;
                        })()
                      `);

                    await assert.rejects(
                      runContractAttacks(
                        makeOptions({
                          generator() {
                            return value;
                          }
                        })
                      ),
                      /non-extensible foreign rejection/
                    );
                  }
                );

              assert.equal(
                unhandled,
                null
              );
            }
          );

          test(
            "M8 package entry point exposes runContractAttacks",
          '''

          if "non-extensible cross-realm rejected generator Promises" not in text:
              if public_marker not in text:
                  raise SystemExit("Non-extensible Promise test marker not found")
              text = text.replace(
                  public_marker,
                  nonext_test,
                  1,
              )

          tests.write_text(text)
          PY

          node --check src/ai-data.js
          node --check src/contract-attacks.js
          node --check test/m8-codex-remediation.test.js

          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git add src/ai-data.js src/contract-attacks.js test/m8-codex-remediation.test.js

          if ! git diff --cached --quiet; then
            git commit -m "fix: close remaining M8 review gaps"
            git push origin HEAD:milestone-8-ai-attacks
          fi
