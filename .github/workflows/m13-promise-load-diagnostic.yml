name: M13 missing Promise package-load diagnostic

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-13-runtime-slice-a
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: |
          python3 scripts/qa/m13-promise-authority-r3.py
          python3 scripts/qa/m13-promise-load-extra.py
      - name: Require package with global Promise deleted
        run: |
          node - <<'NODE'
          const NativePromise = Promise;
          delete global.Promise;
          try {
            require('./src');
          } finally {
            global.Promise = NativePromise;
          }
          console.log('package-load-without-global-Promise: PASS');
          NODE
