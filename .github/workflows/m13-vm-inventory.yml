name: M13 VM usage inventory

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory direct VM authority use
        run: |
          echo '=== node:vm imports ==='
          grep -R -n -F 'require("node:vm")' src || true
          echo '=== runInNewContext uses ==='
          grep -R -n -F 'runInNewContext' src || true
