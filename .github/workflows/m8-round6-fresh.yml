name: M8 round 6 fresh-eyes remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-audit-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Apply fresh-eyes boundary patch
        run: |
          python3 .github/scripts/m8_round6_fresh_patch.py
          python3 .github/scripts/m8_round6_harness_fix.py

      - name: Syntax
        run: |
          node --check src/contract-attacks.js
          node --check src/ai-data.js
          node --check test/m8-codex-round6.test.js

      - name: Fresh-eyes static boundary audit
        run: |
          ! grep -F 'ruleById.get(' src/contract-attacks.js
          ! grep -F 'value.trim()' src/contract-attacks.js
          ! grep -F '!Number.isFinite(value)' src/contract-attacks.js
          ! grep -F 'snapshot.rules.map(' src/contract-attacks.js
          ! grep -F 'withSafeArrayHasInstance' src/contract-attacks.js
          ! grep -F 'const normalizedScores = {}' src/contract-attacks.js
          grep -F 'withRestoredCallbackIntrinsicSurfaces' src/contract-attacks.js
          grep -F 'asyncLocalStorageGetStore' src/ai-data.js
          grep -F 'Trusted callback boundary' docs/M8_AI_ATTACKS_SPEC.md

      - name: Round 6 regressions
        run: node --test test/m8-codex-round6.test.js

      - name: All M8 focused suites
        run: |
          node --test \
            test/contract-attacks.test.js \
            test/ai-data.test.js \
            test/m8-codex-remediation.test.js \
            test/m8-codex-round3.test.js \
            test/m8-codex-round4.test.js \
            test/m8-codex-round5.test.js \
            test/m8-codex-round6.test.js

      - name: Full repository Node 22
        run: node --test

      - uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Node 14 syntax
        run: |
          node --check src/contract-attacks.js
          node --check src/ai-data.js

      - name: Node 14 fresh-boundary smoke
        run: |
          node --unhandled-rejections=strict <<'NODE'
          const { runContractAttacks } = require('./src');
          const { cloneAiData } = require('./src/ai-data');
          const { AsyncLocalStorage } = require('node:async_hooks');

          const contract = {
            version: 1,
            status: 'confirmed',
            task: 'Return the approved value.',
            rules: [{
              id: 'value-rule',
              statement: 'Return the approved value.',
              kind: 'required',
              severity: 'critical'
            }]
          };

          function output(ruleId = 'value-rule') {
            return {
              version: 1,
              task: contract.task,
              attacks: [{
                id: 'wrong', ruleId, type: 'wrong',
                description: 'wrong', rationale: 'wrong',
                mutatedOutput: { value: 'wrong' },
                scores: { realism: 1, subtlety: 1, novelty: 1, fixability: 1 }
              }]
            };
          }

          (async () => {
            const objectResult = await runContractAttacks({
              contract,
              input: { request: 'approved' },
              expectedOutput: { value: 'approved' },
              evaluator: value => value instanceof Object,
              generator: () => output()
            });
            if (objectResult.generatedAttacks.length !== 1) throw new Error('Object instanceof smoke failed');

            let mapRejected = false;
            try {
              await runContractAttacks({
                contract,
                input: {},
                expectedOutput: { value: 'approved' },
                evaluator: () => true,
                generator() {
                  Map.prototype.get = () => contract.rules[0];
                  return output('invented');
                }
              });
            } catch (error) {
              mapRejected = /unknown Quality Contract rule id/.test(String(error.message));
            }
            if (!mapRejected) throw new Error('Map tamper smoke failed');

            let promiseRejected = false;
            try {
              await runContractAttacks({
                contract,
                input: {},
                expectedOutput: { value: 'approved' },
                evaluator: () => true,
                generator() {
                  const p = Promise.reject(new Error('safe constructor rejection'));
                  Object.defineProperty(p, 'constructor', {
                    value: Promise, writable: false, configurable: false
                  });
                  return p;
                }
              });
            } catch (error) {
              promiseRejected = /safe constructor rejection/.test(String(error.message));
            }
            if (!promiseRejected) throw new Error('Promise observation smoke failed');

            const storage = new AsyncLocalStorage();
            storage.run('secret', () => {
              const originalPrototype = Object.getPrototypeOf(storage);
              try {
                Object.setPrototypeOf(storage, Object.prototype);
                storage.foo = 'bar';
                let rejected = false;
                try { cloneAiData(storage, 'storage'); } catch (error) {
                  rejected = /unsupported runtime object/.test(String(error.message));
                }
                if (!rejected) throw new Error('AsyncLocalStorage smoke failed');
              } finally {
                Object.setPrototypeOf(storage, originalPrototype);
              }
            });
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Diff checks
        run: |
          git diff --check
          git diff origin/main...HEAD -- src/engine.js

      - name: Commit validated round 6 source
        run: |
          if git diff --quiet -- src/contract-attacks.js src/ai-data.js docs/M8_AI_ATTACKS_SPEC.md test/m8-codex-round6.test.js; then
            echo "Round 6 already applied; nothing to commit."
            exit 0
          fi
          git config user.name "AidaMichel"
          git config user.email "126730924+AidaMichel@users.noreply.github.com"
          git add src/contract-attacks.js src/ai-data.js docs/M8_AI_ATTACKS_SPEC.md test/m8-codex-round6.test.js
          git commit -m "fix: consolidate M8 callback and data boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
