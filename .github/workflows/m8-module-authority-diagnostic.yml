name: M8 Module Authority Diagnostic

on:
  push:
    branches:
      - temp/m8-module-authority-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Map URLPattern builtin source
        run: |
          node - <<'NODE'
          "use strict";
          const nodeUrl = require("node:url");
          const natives = process.binding("natives");
          const C = nodeUrl.URLPattern;
          console.log("node", process.version, "constructor", typeof C);
          if (typeof C !== "function") process.exit(0);
          const getter = Object.getOwnPropertyDescriptor(C.prototype, "pathname")?.get;
          for (const [label, fn] of [["constructor", C], ["pathname", getter]]) {
            const source = Function.prototype.toString.call(fn);
            const hits = Object.entries(natives)
              .filter(([, moduleSource]) => typeof moduleSource === "string" && moduleSource.includes(source))
              .map(([name]) => name);
            console.log(label, JSON.stringify(source.slice(0, 300)), JSON.stringify(hits));
          }
          NODE
