name: M8 Module Authority Diagnostic

on:
  push:
    branches:
      - temp/m8-module-authority-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Inspect relocated global brand constructors
        run: |
          node - <<'NODE'
          "use strict";
          const natives = process.binding("natives");
          const specs = [
            ["TextEncoder", "encoding", "internal/encoding"],
            ["TextDecoder", "encoding", "internal/encoding"],
            ["Blob", "slice", "internal/blob"],
            ["File", "name", "internal/file"]
          ];
          console.log("node", process.version);
          for (const [name, prop, moduleName] of specs) {
            const d = Object.getOwnPropertyDescriptor(globalThis, name);
            let C = d && d.value;
            if (!C && d && typeof d.get === "function") {
              try { C = Reflect.apply(d.get, globalThis, []); } catch {}
            }
            const source = typeof C === "function" ? Function.prototype.toString.call(C) : null;
            const pd = C && C.prototype && Object.getOwnPropertyDescriptor(C.prototype, prop);
            const callable = pd && (pd.get || pd.value);
            const callableSource = typeof callable === "function" ? Function.prototype.toString.call(callable) : null;
            const moduleSource = natives[moduleName];
            console.log(JSON.stringify({
              name,
              descriptor: d ? {hasValue:Object.prototype.hasOwnProperty.call(d,"value"), hasGet:typeof d.get==="function", configurable:d.configurable, enumerable:d.enumerable} : null,
              type: typeof C,
              source: source && source.slice(0,180),
              sourceIncluded: typeof moduleSource === "string" && typeof source === "string" && moduleSource.includes(source),
              callableType: typeof callable,
              callableSource: callableSource && callableSource.slice(0,180),
              callableSourceIncluded: typeof moduleSource === "string" && typeof callableSource === "string" && moduleSource.includes(callableSource)
            }));
          }
          NODE
