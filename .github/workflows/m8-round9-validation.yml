name: M8 Round 9 validation

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  round9:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.ref == 'milestone-8-ai-attacks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-8-ai-attacks
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Apply Round 9 patch
        run: python3 .github/scripts/m8_round9_patch.py

      - name: Syntax checks
        run: |
          node --check src/contract-attacks.js
          node --check src/ai-data.js
          node --check test/m8-codex-round9.test.js

      - name: Round 9 regressions
        run: node --test test/m8-codex-round9.test.js

      - name: Focused M8 suites
        run: node --test test/ai-data.test.js test/contract-attacks.test.js test/m8-codex-remediation.test.js test/m8-codex-round3.test.js test/m8-codex-round4.test.js test/m8-codex-round5.test.js test/m8-codex-round6.test.js test/m8-codex-round7.test.js test/m8-codex-round8.test.js test/m8-codex-round9.test.js

      - name: Full repository tests
        run: node --test

      - name: Diff integrity
        run: |
          git diff --check
          git fetch origin main
          test -z "$(git diff origin/main -- src/engine.js)"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Node 24 adversarial gate
        run: node --test test/m8-codex-round9.test.js

      - name: Set up Node 14.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 14.18.0

      - name: Node 14 minimum-runtime smoke
        run: node .github/scripts/m8_round9_node14_smoke.js

      - name: Commit validated source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/M8_AI_ATTACKS_SPEC.md src/ai-data.js src/contract-attacks.js test/m8-codex-round9.test.js
          git commit -m "fix: harden M8 round 9 boundaries"
          git push origin HEAD:milestone-8-ai-attacks
