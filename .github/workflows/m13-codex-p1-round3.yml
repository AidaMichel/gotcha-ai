name: M13 Codex P1 round 3

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  remediate-prove-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply remediation
        run: python3 scripts/qa/m13-codex-p1-round3.py

      - name: Diff hygiene
        run: |
          git diff --check
          node --check src/contract-attacks-core.js
          node --check src/contract-quality-loop.js
          node --check src/provider-adapter-m13.js
          node --check src/contract-protection-proposal.js
          node --check src/mutation-pack.js

      - uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: npm
      - run: npm ci
      - name: Node 14 compatibility
        run: node -e "const api=require('./src'); if(typeof api.generateContractProtectionProposal!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm
      - run: npm ci
      - name: Node 16 compatibility
        run: node -e "const api=require('./src'); if(typeof api.createStructuredProviderAdapter!=='function') process.exit(1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Node 18 focused and full
        run: |
          node --test test/m13-review-remediation.test.js test/contract-protection-proposal.test.js test/provider-adapter-m13.test.js test/package-contract-protection-proposal.test.js test/contract-quality-loop.test.js test/mutation-pack.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Node 20 focused and full
        run: |
          node --test test/m13-review-remediation.test.js test/contract-protection-proposal.test.js test/provider-adapter-m13.test.js test/package-contract-protection-proposal.test.js test/contract-quality-loop.test.js test/mutation-pack.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Node 22 focused and full
        run: |
          node --test test/m13-review-remediation.test.js test/contract-protection-proposal.test.js test/provider-adapter-m13.test.js test/package-contract-protection-proposal.test.js test/contract-quality-loop.test.js test/mutation-pack.test.js
          npm test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Node 24 focused and full
        run: |
          node --test test/m13-review-remediation.test.js test/contract-protection-proposal.test.js test/provider-adapter-m13.test.js test/package-contract-protection-proposal.test.js test/contract-quality-loop.test.js test/mutation-pack.test.js
          npm test

      - name: Commit proven remediation and remove harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/m13-codex-p1-round3.yml scripts/qa/m13-codex-p1-round3.py
          git add src/contract-attacks-core.js src/contract-quality-loop.js src/provider-adapter-m13.js src/contract-protection-proposal.js src/mutation-pack.js test/m13-review-remediation.test.js test/provider-adapter-m13.test.js test/mutation-pack.test.js .github/workflows/m13-codex-p1-round3.yml scripts/qa/m13-codex-p1-round3.py
          git diff --cached --check
          git commit -m "fix: close final M13 authority and rejection gaps"
          git push origin HEAD:milestone-13-runtime-slice-a
