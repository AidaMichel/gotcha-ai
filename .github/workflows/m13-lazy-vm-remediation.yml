name: M13 lazy VM authority remediation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Syntax and compatibility smoke
        run: |
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check test/m13-review-remediation.test.js
          git diff --check
          node - <<'NODE'
          const api = require('./src');
          for (const name of ['runContractAttacks','generateContractProtectionProposal','createStructuredProviderAdapter']) {
            if (typeof api[name] !== 'function') throw new Error(name + ' is not callable');
          }
          NODE

  supported-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Syntax and diff hygiene
        run: |
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check test/m13-review-remediation.test.js
          git diff --check
      - name: Focused security regressions
        run: |
          node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js
      - name: Node 22 focused stress
        if: startsWith(matrix.node, '22')
        run: |
          for i in 1 2 3; do
            echo "Focused stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js
          done
      - name: Full repository suite
        run: npm test

  materialize:
    needs: [compatibility, supported-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-13-runtime-slice-a
          fetch-depth: 1
      - name: Apply tested remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Verify tested state
        run: |
          node --check src/runtime-authority.js
          node --check src/contract-attacks-core.js
          node --check test/m13-review-remediation.test.js
          git diff --check
      - name: Remove temporary remediation harness
        run: |
          rm -f .github/workflows/m13-lazy-vm-remediation.yml
          rm -f scripts/qa/m13-lazy-vm-remediation.py
          if find .github scripts/qa -type f -iname '*lazy-vm*' -print 2>/dev/null | grep -q .; then
            echo 'Temporary lazy-vm harness remains:'
            find .github scripts/qa -type f -iname '*lazy-vm*' -print 2>/dev/null
            exit 1
          fi
      - name: Commit materialized production state
        run: |
          git config user.name 'AidaMichel'
          git config user.email '126730924+AidaMichel@users.noreply.github.com'
          git add src/runtime-authority.js src/contract-attacks-core.js test/m13-review-remediation.test.js
          git add -u .github/workflows scripts/qa
          git diff --cached --check
          git status --short
          git commit -m 'fix: close lazy M8 vm authority seam'
          git push origin HEAD:milestone-13-runtime-slice-a
