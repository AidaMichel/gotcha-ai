name: M13 centralized VM authority remediation

on:
  push:
    branches:
      - milestone-13-runtime-slice-a

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [14.21.3, 16.20.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply centralized remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Static single-authority check
        run: |
          offenders=$(grep -R -l -E 'require\("node:vm"\)|runInNewContext' src --include='*.js' | grep -v '^src/runtime-authority.js$' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            exit 1
          fi
      - name: Syntax and compatibility smoke
        run: |
          for f in \
            src/runtime-authority.js \
            src/index.js \
            src/contract-attacks-core.js \
            src/provider-adapter-m13.js \
            src/contract-quality-loop.js \
            src/contract-experiment-safe.js \
            src/contract-experiment.js \
            src/ai-data-core.js \
            src/mutation-pack.js \
            src/contract-protection-proposal.js \
            test/m13-review-remediation.test.js; do
            node --check "$f"
          done
          git diff --check
          node - <<'NODE'
          const api = require('./src');
          for (const name of ['runContractAttacks','generateContractProtectionProposal','createStructuredProviderAdapter']) {
            if (typeof api[name] !== 'function') throw new Error(name + ' is not callable');
          }
          NODE

  supported-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.20.8, 20.20.2, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply centralized remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Static single-authority and diff hygiene
        run: |
          offenders=$(grep -R -l -E 'require\("node:vm"\)|runInNewContext' src --include='*.js' | grep -v '^src/runtime-authority.js$' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            exit 1
          fi
          git diff --check
      - name: Focused security regressions
        run: |
          node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js
      - name: Node 22 focused stress
        if: startsWith(matrix.node, '22')
        run: |
          for i in 1 2 3; do
            echo "Focused stress pass $i"
            node --test test/m13-review-remediation.test.js test/runtime-authority.test.js test/provider-adapter-m13.test.js
          done
      - name: Full repository suite
        run: npm test

  materialize:
    needs: [compatibility, supported-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-13-runtime-slice-a
          fetch-depth: 1
      - name: Apply tested centralized remediation
        run: python3 scripts/qa/m13-lazy-vm-remediation.py
      - name: Verify tested state
        run: |
          offenders=$(grep -R -l -E 'require\("node:vm"\)|runInNewContext' src --include='*.js' | grep -v '^src/runtime-authority.js$' || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            exit 1
          fi
          git diff --check
      - name: Remove temporary remediation harness
        run: |
          rm -f .github/workflows/m13-lazy-vm-remediation.yml
          rm -f scripts/qa/m13-lazy-vm-remediation.py
          if find .github scripts/qa -type f \( -iname '*lazy-vm*' -o -iname '*vm-inventory*' \) -print 2>/dev/null | grep -q .; then
            echo 'Temporary VM remediation harness remains:'
            find .github scripts/qa -type f \( -iname '*lazy-vm*' -o -iname '*vm-inventory*' \) -print 2>/dev/null
            exit 1
          fi
      - name: Commit materialized production state
        run: |
          git config user.name 'AidaMichel'
          git config user.email '126730924+AidaMichel@users.noreply.github.com'
          git add \
            src/runtime-authority.js \
            src/index.js \
            src/contract-attacks-core.js \
            src/provider-adapter-m13.js \
            src/contract-quality-loop.js \
            src/contract-experiment-safe.js \
            src/contract-experiment.js \
            src/ai-data-core.js \
            src/mutation-pack.js \
            src/contract-protection-proposal.js \
            test/m13-review-remediation.test.js
          git add -u .github/workflows scripts/qa
          git diff --cached --check
          git status --short
          git commit -m 'fix: centralize lazy VM authority consumers'
          git push origin HEAD:milestone-13-runtime-slice-a
