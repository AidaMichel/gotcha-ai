name: M13 Round11 early Node20 brand diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-early20-brand-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.11.1", "20.12.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round11 candidate
        run: |
          python3 scripts/qa/m13-round11-codex-remediation.py
          python3 scripts/qa/m13-round11-codex-remediation-v2.py
          python3 scripts/qa/m13-round11-codex-remediation-v3.py
      - name: Locate lazy Headers accessor source
        run: |
          node - <<'NODE'
          const natives = process.binding('natives');
          const descriptor = Object.getOwnPropertyDescriptor(globalThis, 'Headers');
          const getter = descriptor && descriptor.get;
          const setter = descriptor && descriptor.set;
          const getterSource = typeof getter === 'function' ? Function.prototype.toString.call(getter) : null;
          const setterSource = typeof setter === 'function' ? Function.prototype.toString.call(setter) : null;
          const matches = (source) => source ? Object.keys(natives).filter((key) => typeof natives[key] === 'string' && natives[key].includes(source)) : [];
          console.log(JSON.stringify({
            node: process.version,
            descriptor: descriptor && { accessor: ('get' in descriptor)||('set' in descriptor), configurable:descriptor.configurable, enumerable:descriptor.enumerable, writable:descriptor.writable },
            getterName: getter && getter.name,
            getterLength: getter && getter.length,
            getterSource,
            getterModules: matches(getterSource),
            setterName: setter && setter.name,
            setterLength: setter && setter.length,
            setterSource,
            setterModules: matches(setterSource)
          }));
          NODE
      - name: Exercise host-brand boundary
        run: |
          node - <<'NODE'
          try {
            const ai = require('./src/ai-data-core');
            ai.cloneAiData({ ok: true });
            console.log('HOST_BRAND_OK');
          } catch (error) {
            console.log('HOST_BRAND_ERROR', error && error.message);
          }
          NODE
