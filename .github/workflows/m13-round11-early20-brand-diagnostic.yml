name: M13 Round11 early Node20 brand diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-early20-brand-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.11.1", "20.12.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round11 candidate
        run: |
          python3 scripts/qa/m13-round11-codex-remediation.py
          python3 scripts/qa/m13-round11-codex-remediation-v2.py
      - name: Instrument exact Undici capture exits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ai-data-core.js')
          s = p.read_text()
          start = s.index('function captureUndiciNativeSource()')
          end = s.index('\nconst undiciNativeSource =', start)
          block = s[start:end]
          needle = 'undiciHostBrandAuthorityAvailable = false;\n    return null;'
          labels = ['binding-descriptor-throw','binding-descriptor-invalid','binding-call-throw','natives-invalid','source-descriptor-throw','source-descriptor-invalid']
          for label in labels:
            if needle not in block:
              break
            block = block.replace(needle, f'console.error("UNDICI_FAIL:{label}");\n    undiciHostBrandAuthorityAvailable = false;\n    return null;', 1)
          s = s[:start] + block + s[end:]
          old = '''function hostBrandAuthorityError() {\n  return new Error(\n    "Host brand probe authority is unavailable."\n  );\n}'''
          new = '''function hostBrandAuthorityError() {\n  return new Error(\n    "Host brand probe authority is unavailable." +\n    " additional=" + additionalHostBrandMethodAuthorityAvailable +\n    " abort=" + abortControllerBrandAuthorityAvailable +\n    " trusted=" + trustedModuleBrandAuthorityAvailable +\n    " undici=" + undiciHostBrandAuthorityAvailable\n  );\n}'''
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Exercise host-brand boundary
        run: |
          node - <<'NODE'
          try {
            const ai = require('./src/ai-data-core');
            ai.cloneAiData({ ok: true });
            console.log('HOST_BRAND_OK');
          } catch (error) {
            console.log('HOST_BRAND_ERROR', error && error.message);
          }
          NODE
