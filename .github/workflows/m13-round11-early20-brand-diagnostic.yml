name: M13 Round11 early Node20 brand diagnostic

on:
  push:
    branches: [milestone-13-runtime-slice-a]
    paths:
      - .github/workflows/m13-round11-early20-brand-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.0.0", "20.11.1", "20.12.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply Round11 candidate
        run: |
          python3 scripts/qa/m13-round11-codex-remediation.py
          python3 scripts/qa/m13-round11-codex-remediation-v2.py
          python3 scripts/qa/m13-round11-codex-remediation-v3.py
      - name: Compare Headers metadata to embedded Undici
        run: |
          node - <<'NODE'
          const source = process.binding('natives')['internal/deps/undici/undici'];
          const ctor = globalThis.Headers;
          const get = ctor && ctor.prototype && ctor.prototype.get;
          const ctorSource = typeof ctor === 'function' ? Function.prototype.toString.call(ctor) : null;
          const getSource = typeof get === 'function' ? Function.prototype.toString.call(get) : null;
          console.log(JSON.stringify({
            node: process.version,
            ctorName: ctor && ctor.name,
            ctorLength: ctor && ctor.length,
            ctorSource: ctorSource && ctorSource.slice(0, 180),
            ctorInBundle: !!(source && ctorSource && source.includes(ctorSource)),
            getName: get && get.name,
            getLength: get && get.length,
            getSource: getSource && getSource.slice(0, 180),
            getInBundle: !!(source && getSource && source.includes(getSource)),
            globalDescriptor: (() => { const d = Object.getOwnPropertyDescriptor(globalThis, 'Headers'); return d && { accessor: ('get' in d)||('set' in d), configurable:d.configurable, enumerable:d.enumerable, writable:d.writable }; })()
          }));
          NODE
      - name: Exercise host-brand boundary
        run: |
          node - <<'NODE'
          try {
            const ai = require('./src/ai-data-core');
            ai.cloneAiData({ ok: true });
            console.log('HOST_BRAND_OK');
          } catch (error) {
            console.log('HOST_BRAND_ERROR', error && error.message);
          }
          NODE
